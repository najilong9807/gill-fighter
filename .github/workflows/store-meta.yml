# 1.1.13 스토어 정보 등록 (codemagic.yaml 'store-meta'와 같음, 빌드 없음 · 리눅스라 무료 분 적게 씀)
# 버전 만들기 · 업데이트 문구 39개 언어 · 스크린샷 54장 · 순위표 범위 확인
name: Store meta
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'DRY=1 이면 읽기만 (바꾸지 않음)'
        default: '1'
        required: true
      steps:
        description: '단계 (version,whatsnew,shots,gc / 스토어 글: ,listing / 빌드 붙이기 · 심사 메모 · 제출: ,build,notes,submit / 미리보기 영상: ,previews / 판매 중 홍보 문구만: promo_now)'
        default: 'version,whatsnew,shots,gc'
        required: true
      submit_ok:
        description: '실제 심사 제출 잠금: 제출할 버전을 그대로 적어야 제출됨 (비우면 확인만)'
        default: ''
        required: false
      version:
        description: '스토어 버전'
        default: '1.1.14'
        required: true
concurrency:
  group: store-meta
  cancel-in-progress: false
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_STORE_APPLE_ID: '6816376999'
      STORE_VERSION: ${{ inputs.version }}
      DRY: ${{ inputs.dry }}
      STEPS: ${{ inputs.steps }}
      SUBMIT_OK: ${{ inputs.submit_ok }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: 준비
        run: python3 -m pip install --quiet requests pyjwt cryptography
      - name: 스토어 정보 등록
        shell: bash
        run: |
          set -o pipefail
          ec=0; python3 store_meta.py 2>&1 | tee out.txt || ec=$?
          # 로그 파일을 못 여는 환경에서도 결과를 보려고 핵심 줄만 알림(annotation)으로 남김 — 키 값은 원래 출력 안 함
          grep -E "VERSION|state|SUBMIT|submit|BUILD|build|NOTES|WHATSNEW|SHOTS|uploaded|PREVIEW|preview|ERR|Error|DRY|CANCEL" out.txt | cut -c1-200 | head -80 > sum.txt || true
          echo "::notice title=summary::$(sed ':a;N;$!ba;s/\n/%0A/g' sum.txt)"
          if [ "$ec" != "0" ]; then tail -8 out.txt | cut -c1-300 | sed 's/^/::notice::TAIL /' || true; fi
          exit $ec
