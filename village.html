<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>물고기 마을 (시험판)</title>
<!-- 물고기 마을 3차 — 늑구 '땅이 너무 좁음 · 건물이 처음부터 완성되면 안 됨, 화이트아웃 서바이벌처럼 짓는 데 시간 · 물고기밥 만드는 공장 · 스펀지밥 느낌으로'
     · 땅 40×40, 8×8 구획으로 나눠 처음엔 6구획만 내 땅 → 옆 구획을 조개돈으로 사서 넓힘
     · 모든 건물은 공사장(비계 · 게 일꾼 · 진행 막대 · 남은 시간)부터 시작해 시간이 지나야 완성, 커질 때도 공사
     · 직접 짓는 시설은 게 일꾼 2마리가 맡음(동시에 2곳까지), 조개돈으로 바로 끝내기 가능 · 구역 건물은 주민들이 알아서 지음
     · 먹이 사슬: 해초 밭(해초) → 물고기밥 공장(해초 → 물고기밥) → 조개 식당(땅값) · 물고기들이 물고기밥을 먹고, 떨어지면 배고파서 떠남
     · 도시 건설식: 구역(집 · 가게 · 공장) · 수요 · 산소(거품 펌프) · 땅값 · 탁한 물 · 세율/예산 · 빠르기 · 지도 보기 · 목표
     · 4차(늑구 '기존 수족관 애셋 쓰지 마 · 진짜 건물 시뮬 게임 만든다 생각 · 주체가 바닷속 · 땅이 바다 맨 밑바닥인데 배경이 바다면 이상'): 건물은 전부 코드로 그린 입체(상자 · 지붕 · 돔 · 원통 · 공 모양 + 둥근 창 · 문 · 간판), 돌리면 모양도 같이 돎. 집은 귤 · 깡통 · 조개 · 찻주전자 · 오두막 같은 물건 집. 배경은 도시 밖까지 이어지는 바닷속 모래 바닥 + 위에서 내려오는 빛 · 물결 무늬 · 가장자리 깊은 물빛. 특정 만화의 집 · 인물은 따라 그리지 않음 -->
<style>
:root{--ink:#123049;--paper:#FFF9EE;--gold:#FFD25C;--red:#E5484D;--ok:#35C27A;--R:#43C46B;--C:#3D9BFF;--I:#FFB02E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0B6BA8;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 60px)}
.pill{pointer-events:auto;background:rgba(255,249,238,.95);border:2px solid #123049;border-radius:999px;padding:4px 9px;font:800 13.5px/1.15 system-ui,sans-serif;box-shadow:0 3px 0 #123049;display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--ink)}
button.pill{cursor:pointer}
.pill.warn{background:#FFD9D9;animation:blink 1s infinite}
@keyframes blink{50%{transform:scale(1.06)}}
.dem{display:flex;gap:4px;align-items:center;height:24px}
.dem b{display:flex;flex-direction:column;align-items:center;font-size:9px;line-height:1;gap:1px}
.dem i{display:block;width:9px;height:15px;border-radius:3px;background:#dfe7ee;position:relative;overflow:hidden;border:1px solid #123049}
.dem i u{position:absolute;left:0;right:0;bottom:0}
.side{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:7px}
.rb{width:46px;height:46px;border:2px solid #123049;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 #123049;font:800 18px system-ui;color:var(--ink);padding:0}
.rb small{display:block;font-size:9px;font-weight:800;margin-top:-1px}
.rb[aria-pressed=true]{background:var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(8,60,100,0),rgba(8,60,100,.88) 28%)}
.tabs{display:flex;gap:2px;background:#123049;border-radius:14px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;border-radius:10px;padding:7px 0;font:800 12px system-ui;color:#DCEBF6;background:transparent;white-space:nowrap;min-width:0}
.tabs button[aria-pressed=true]{background:var(--gold);color:#3A2400}
.tray{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;touch-action:pan-x}
.tray::-webkit-scrollbar{display:none}
.card{flex:none;width:80px;border:2px solid #123049;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 #123049;padding:4px 3px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font:800 11px system-ui;color:var(--ink);position:relative}
.card img,.card .sw{width:50px;height:42px;object-fit:contain}
.card .sw{border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px}
.card b{font-size:11px;max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:10px;font-weight:700;white-space:nowrap}
.card[data-on="1"]{background:#FFE7A0;transform:translateY(-3px)}
.card[data-poor="1"]{opacity:.5}
.card .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(255,249,238,.75);border-radius:12px}
.panel{position:fixed;left:10px;right:10px;bottom:calc(172px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--paper);border:2px solid #123049;border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 #123049;font:14px/1.45 system-ui}
.panel h2{margin:0 0 4px;font-size:17px}
.panel .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.panel button{flex:1;border:2px solid #123049;border-radius:12px;padding:8px 6px;font:800 13px system-ui;background:#E8F1F8;color:var(--ink)}
.panel button.hot{background:var(--gold)}
.panel button.no{background:#FFD9D9}
.panel table{width:100%;border-collapse:collapse;font-size:13.5px}
.panel td{padding:2px 0}.panel td:last-child{text-align:right;font-weight:800}
.panel input[type=range]{width:100%}
.meter{height:9px;border-radius:5px;background:#dfe7ee;overflow:hidden;margin:3px 0;border:1px solid #123049}
.meter i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:50%;top:calc(126px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#123049;color:#fff;padding:9px 14px;border-radius:14px;font:800 13.5px system-ui;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s}
.hint{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);border:2px solid #123049;padding:6px 10px;border-radius:12px;font:800 13px system-ui;white-space:nowrap;box-shadow:0 3px 0 #123049}
.hint button{margin-left:8px;border:0;border-radius:9px;padding:4px 9px;font:800 12px system-ui;background:var(--red);color:#fff}
.goal{position:fixed;left:10px;top:calc(88px + env(safe-area-inset-top,0px));background:rgba(255,249,238,.95);border:2px solid #123049;border-radius:12px;padding:6px 10px;font:800 12.5px/1.35 system-ui;max-width:60vw;box-shadow:0 3px 0 #123049}
.goal small{display:block;font-weight:700;opacity:.7}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <button class="pill" id="hMoney" type="button">🐚 0</button>
  <div class="pill" id="hPop">🐟 0</div>
  <div class="pill" id="hFood">🍙 0</div>
  <div class="pill" id="hCrab">🦀 2/2</div>
  <div class="pill" id="hDate">1년 1월</div>
  <div class="pill" aria-label="수요"><div class="dem" id="hDem"><b><i><u style="background:var(--R)"></u></i>집</b><b><i><u style="background:var(--C)"></u></i>가</b><b><i><u style="background:var(--I)"></u></i>공</b></div></div>
</div>
<div class="goal" id="goal"></div>
<div class="side">
  <button class="rb" id="bSpd" aria-label="빠르기">▶<small>보통</small></button>
  <button class="rb" id="bView" aria-label="지도 보기">👁<small>보기</small></button>
  <button class="rb" id="bRot" aria-label="화면 돌리기">⟳<small>돌리기</small></button>
  <button class="rb" id="bZin" aria-label="크게">＋</button>
  <button class="rb" id="bZout" aria-label="작게">－</button>
</div>
<div class="hint" id="hint" hidden><span></span><button type="button" id="hintX">그만</button></div>
<div class="panel" id="panel" hidden></div>
<div class="bar">
  <div class="tabs" id="tabs">
    <button data-t="road">길</button><button data-t="zone">구역</button><button data-t="util">산소</button><button data-t="food">먹이</button><button data-t="svc">편의</button><button data-t="deco">꾸미기</button><button data-t="tool">불도저</button>
  </div>
  <div class="tray" id="tray"></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d'),dpr=1,cw=0,ch=0,t=0;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function hh(n){var x=(n*2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;x=Math.imul(x,3266489917)>>>0;x^=x>>>16;return (x>>>0)/4294967296}
function mmss(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}

/* ===== 구역에서 주민이 짓는 건물(Lv.1~3) · 공사 시간(틱 = 보통 빠르기 1초) ===== */
var ZG={R:{n:'집',cap:[0,4,10,24],arts:[[],['house1','dc_orangehouse','dc_berryhouse','dc_melonhouse'],['house2','dc_cottage'],['house3']]},
        C:{n:'가게',jobs:[0,3,8,18],arts:[[],['dc_amphora','dc_chest'],['dc_mushroom','dc_clam'],['dc_coralcastle']]},
        I:{n:'공장',jobs:[0,5,12,24],arts:[[],['dc_marimo','dc_anemgarden'],['dc_pearlclam','dc_tablecoral'],['dc_braincoral']]}};
var ZBT=[0,18,45,90];
/* ===== 직접 짓는 시설(게 일꾼이 지음) ===== */
var P={
 hall:{n:'마을 회관',k:'house4',s:2,c:0,fixed:1,sc:1.15,bt:0},
 pump:{t:'util',n:'거품 펌프',k:'dc_bubbler',s:1,c:300,bt:20,o2:6,up:12,info:'주변 6칸에 산소 · 건물이 자라려면 꼭 필요해요'},
 pump2:{t:'util',n:'큰 거품 탑',k:'dc_crystal',s:1,c:900,bt:75,o2:10,up:30,need:120,info:'주변 10칸에 산소'},
 farm:{t:'food',n:'해초 밭',draw:'farm',s:2,c:200,bt:25,jobs:4,kelp:.4,up:4,info:'일꾼이 해초를 키워요'},
 factory:{t:'food',n:'물고기밥 공장',k:'dc_ship',s:2,c:600,bt:60,jobs:8,make:.5,up:10,sc:1.05,info:'해초를 물고기밥으로 바꿔요(해초 1 → 밥 2)'},
 diner:{t:'food',n:'조개 식당',k:'dc_shellpile',s:1,c:250,bt:30,jobs:3,r:5,hap:10,up:5,info:'따끈한 물고기밥 · 주변 땅값이 올라요'},
 park:{t:'svc',n:'산호 공원',k:'dc_coralarch',s:1,c:150,bt:20,r:4,hap:12,up:5},
 lamp:{t:'svc',n:'빛버섯 가로등',k:'dc_mushroom',s:1,c:70,bt:10,r:2,hap:6,up:2},
 light:{t:'svc',n:'등대',k:'dc_lighthouse',s:1,c:450,bt:50,r:7,hap:10,up:12,need:60},
 gold:{t:'svc',n:'황금 물고기상',k:'dc_goldstatue',s:1,c:800,bt:90,r:6,hap:18,up:15,need:150},
 king:{t:'svc',n:'용왕 동상',k:'dc_dragonking',s:1,c:1600,bt:150,r:8,hap:26,up:25,need:300},
 d1:{t:'deco',n:'분재 산호',k:'dc_bonsai',s:1,c:40,bt:6,deco:4},d2:{t:'deco',n:'부채 산호',k:'dc_seafan',s:1,c:30,bt:5,deco:3},d3:{t:'deco',n:'바위 정원',k:'dc_iwagumi',s:1,c:45,bt:6,deco:4},d4:{t:'deco',n:'작은 산호',k:'coral',s:1,c:20,bt:4,deco:2}
};
var COST={road:10,zone:5,rock:40,kelp:15,doze:2};

/* ===== 상태 · 땅(40×40, 8×8 구획) ===== */
var N=40,MID=20,CK=8,KEY='fishvillage.v3',VG=null;
function genMap(seed){var T=[],x,y;for(y=0;y<N;y++)for(x=0;x<N;x++){var n=hh(seed*977+x*31+y*7),c=hh(seed+Math.floor(x/4)*13+Math.floor(y/4)*29),v=0;if(c>.7&&n>.5)v=2;else if(n>.965)v=1;if(c<.07&&n>.45)v=1;T.push(v)}
  for(y=MID-5;y<=MID+5;y++)for(x=0;x<13;x++)T[y*N+x]=0;return T}
function fresh(){var seed=Math.floor(Math.random()*1e6),g={v:3,seed:seed,money:5000,food:120,kelp:0,tax:9,tick:0,month:1,year:1,rot:0,ter:genMap(seed),road:{},zone:{},b:[],nid:1,last:{inc:0,exp:0},spd:1,gi:0,crabs:2,own:{}};
  for(var cx=0;cx<2;cx++)for(var cy=1;cy<4;cy++)g.own[cx+','+cy]=1;for(var x=0;x<6;x++)g.road[x+','+MID]=1;g.b.push({id:g.nid++,p:'hall',x:6,y:MID-2,f:0,bp:1,bt:0});return g}
function load(){try{var s=localStorage.getItem(KEY);if(s){var g=JSON.parse(s);if(g&&g.v===3)return g}}catch(e){}return fresh()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(VG))}catch(e){}}
VG=load();
function tk(x,y){return x+','+y}
function inb(x,y){return x>=0&&y>=0&&x<N&&y<N}
function own(x,y){return inb(x,y)&&!!VG.own[Math.floor(x/CK)+','+Math.floor(y/CK)]}
function ter(x,y){return VG.ter[y*N+x]}
function isRoad(x,y){return !!VG.road[tk(x,y)]}
function bSize(b){return b.p?P[b.p].s:1}
function built(b){return !b.bt||b.bp>=b.bt}
var OCC={};function occMap(){OCC={};VG.b.forEach(function(b){var s=bSize(b);for(var i=0;i<s;i++)for(var j=0;j<s;j++)OCC[tk(b.x+i,b.y+j)]=b})}occMap();
function freeArea(x,y,s,ign){for(var i=0;i<s;i++)for(var j=0;j<s;j++){var X=x+i,Y=y+j,o=OCC[tk(X,Y)];if(!own(X,Y)||isRoad(X,Y)||ter(X,Y)||(o&&o!==ign))return false}return true}
function ring(x,y,s,fn){for(var i=-1;i<=s;i++)for(var j=-1;j<=s;j++){if((i>=0&&i<s)&&(j>=0&&j<s))continue;if((i===-1||i===s)&&(j===-1||j===s))continue;if(fn(x+i,y+j))return true}return false}
var LINK={};function linkCalc(){LINK={};if(!isRoad(0,MID))return;var q=[[0,MID]],seen={};seen[tk(0,MID)]=1;while(q.length){var c=q.shift();LINK[tk(c[0],c[1])]=1;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var X=c[0]+d[0],Y=c[1]+d[1],k=tk(X,Y);if(!seen[k]&&isRoad(X,Y)){seen[k]=1;q.push([X,Y])}})}}
function linked(x,y,s){return ring(x,y,s||1,function(X,Y){return !!LINK[tk(X,Y)]})}
function crabsBusy(){return VG.b.filter(function(b){return b.p&&!built(b)}).length+VG.b.filter(function(b){return b.p&&b.up}).length}
function chunkPrice(){var n=Object.keys(VG.own).length;return Math.round(800*Math.pow(1.35,n-6)/50)*50}
function chunkBuyable(cx,cy){if(VG.own[cx+','+cy]||cx<0||cy<0||cx>=N/CK||cy>=N/CK)return false;return !!(VG.own[(cx-1)+','+cy]||VG.own[(cx+1)+','+cy]||VG.own[cx+','+(cy-1)]||VG.own[cx+','+(cy+1)])}

/* ===== 지도 값: 산소 · 탁한 물 · 땅값 ===== */
var O2={},POL={},LV={};
function fields(){O2={};POL={};LV={};VG.b.forEach(function(b){if(!built(b))return;var d=b.p?P[b.p]:null,s=bSize(b),cx=b.x+s/2-.5,cy=b.y+s/2-.5,x,y;
  if(d&&d.o2){for(y=Math.floor(cy-d.o2);y<=cy+d.o2;y++)for(x=Math.floor(cx-d.o2);x<=cx+d.o2;x++)if(inb(x,y)&&Math.hypot(x-cx,y-cy)<=d.o2+.3)O2[tk(x,y)]=1}
  var pol=b.z==='I'?10+b.lv*6:b.p==='factory'?18:0,r=b.z==='I'?2+b.lv:3;if(pol&&!b.ab){for(y=b.y-r;y<=b.y+s-1+r;y++)for(x=b.x-r;x<=b.x+s-1+r;x++)if(inb(x,y)){var dd=Math.max(Math.abs(x-cx),Math.abs(y-cy));POL[tk(x,y)]=(POL[tk(x,y)]||0)+pol*clamp(1-dd/(r+1),0,1)}}
  if(d&&(d.hap||d.deco)){var rr=d.r||2,h=d.hap||d.deco;for(y=b.y-rr;y<=b.y+rr;y++)for(x=b.x-rr;x<=b.x+rr;x++)if(inb(x,y))LV[tk(x,y)]=(LV[tk(x,y)]||0)+h}
  if(b.z==='C'&&!b.ab){for(y=b.y-4;y<=b.y+4;y++)for(x=b.x-4;x<=b.x+4;x++)if(inb(x,y))LV[tk(x,y)]=(LV[tk(x,y)]||0)+2+b.lv}})}
function landVal(x,y){var v=48+Math.min(40,LV[tk(x,y)]||0)-Math.min(45,POL[tk(x,y)]||0),near=0;for(var j=-2;j<=2;j++)for(var i=-2;i<=2;i++)if(inb(x+i,y+j)&&ter(x+i,y+j)===2)near++;v+=Math.min(8,near*2);v-=(VG.tax-9)*2.5;if(ST.hungry)v-=15;return clamp(Math.round(v),0,100)}

/* ===== 시뮬레이션: 1틱 = 1초(빠르게 0.35초) · 30틱 = 한 달 ===== */
var ST={pop:0,jobsC:0,jobsI:0,jobsP:0,work:0,hap:0,dem:{R:0,C:0,I:0},cnt:{R:0,C:0,I:0},hungry:false,eat:0,makeR:0,kelpR:0};
function vgTick(){linkCalc();var bs=VG.b,done=[];
  /* 공사 진행 */
  bs.forEach(function(b){if(!built(b)){b.bp=(b.bp||0)+1;if(built(b)){puff(b);floatTxt(b,'완성!');if(b.p)toast((P[b.p].n)+' 완성! 🦀')}}
    if(b.up){b.up.bp++;if(b.up.bp>=b.up.bt){b.lv=b.up.lv;delete b.up;puff(b);floatTxt(b,ZG[b.z].n+' Lv.'+b.lv+' 완성!')}}});
