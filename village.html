<!-- 물고기 마을 3차 — 늑구 '땅이 너무 좁음 · 건물이 처음부터 완성되면 안 됨, 화이트아웃 서바이벌처럼 짓는 데 시간 · 물고기밥 만드는 공장 · 스펀지밥 느낌으로'
     · 땅 40×40, 8×8 구획으로 나눠 처음엔 6구획만 내 땅 → 옆 구획을 조개돈으로 사서 넓힘
     · 모든 건물은 공사장(비계 · 게 일꾼 · 진행 막대 · 남은 시간)부터 시작해 시간이 지나야 완성, 커질 때도 공사
     · 직접 짓는 시설은 게 일꾼 2마리가 맡음(동시에 2곳까지), 조개돈으로 바로 끝내기 가능 · 구역 건물은 주민들이 알아서 지음
     · 먹이 사슬: 해초 밭(해초) → 물고기밥 공장(해초 → 물고기밥) → 조개 식당(땅값) · 물고기들이 물고기밥을 먹고, 떨어지면 배고파서 떠남
     · 도시 건설식: 구역(집 · 가게 · 공장) · 수요 · 산소(거품 펌프) · 땅값 · 탁한 물 · 세율/예산 · 빠르기 · 지도 보기 · 목표
     · 4차(늑구 '기존 수족관 애셋 쓰지 마 · 진짜 건물 시뮬 게임 만든다 생각 · 주체가 바닷속 · 땅이 바다 맨 밑바닥인데 배경이 바다면 이상'): 건물은 전부 코드로 그린 입체(상자 · 지붕 · 돔 · 원통 · 공 모양 + 둥근 창 · 문 · 간판), 돌리면 모양도 같이 돎. 집은 귤 · 깡통 · 조개 · 찻주전자 · 오두막 같은 물건 집. 배경은 도시 밖까지 이어지는 바닷속 모래 바닥 + 위에서 내려오는 빛 · 물결 무늬 · 가장자리 깊은 물빛. 특정 만화의 집 · 인물은 따라 그리지 않음 -->

<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)};

function mmss(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}

/* ===== 5차 — 늑구 '칸 넓게 · 땅 더 넓게 · 단계별로(시청 레벨에 따라 지을 수 있는 게 정해지게) · 자료 읽고 다시 구성 · 구도 · 그래픽'
   참고한 구조: 화이트아웃 서바이벌(용광로 레벨이 다른 건물 최대 레벨을 막고, 다음 레벨엔 특정 건물 레벨 조건 · 자원 · 점점 긴 공사 시간),
   클래시 오브 클랜(타운홀 레벨마다 건물 개수 한도 · 새 건물), 심시티 빌드잇(인구로 단계 · 재료로 집 업그레이드 · 붙은 땅만 넓히기)
   → 마을 회관 Lv.1~10: 다음 레벨 조건(시설 레벨 · 물고기 수) + 조개돈 · 산호석 + 공사 시간, 레벨마다 새 시설 · 개수 한도 · 구역 건물 최대 단계 · 게 일꾼 수 · 살 수 있는 땅 수가 늘어남
   · 시설도 레벨업(회관 레벨까지), 레벨이 오를수록 효과 ↑ · 비용 1.6배 · 시간 1.45배

/* ===== 상태 · 땅(64×64, 8×8 구획 64개) ===== */
var N=64,MID=32,CK=8,KEY='fishvillage.v5',VG=null;

  else if(b&&b.chunk){var pr=chunkPrice(),lim=HL[HLV()].land,n=Object.keys(VG.own).length;h='<h2>🔒 새 땅</h2>8×8칸을 내 땅으로 만들어요<br>값 '+costTxt(pr)+'<br>지금 땅 '+n+' / '+lim+'구획(회관 레벨이 오르면 더 살 수 있어요)<div class="row">'+(n<lim?'<button class="hot" data-a="buy">땅 사기</button>':'<button disabled>회관을 키워요</button>')+'<button data-a="x">닫기</button></div>'}

    if(!built(b)||b.up){var tot=b.up?b.up.bt:b.bt,pr2=b.up?b.up.bp:b.bp;h+='<b>🔨 '+(b.up?'Lv.'+b.up.lv+'로 올리는 중':'짓는 중')+'</b> · 남은 시간 '+mmss(tot-pr2)+'<div class="meter"><i style="width:'+Math.round(pr2/tot*100)+'%;background:#FFD25C"></i></div>'+(b.p?'<small>게 일꾼이 일하고 있어요</small>':'<small>주민들이 짓고 있어요</small>')}
    else{if(b.ab)h+='<div class="bad">빈 건물 · 길이나 산소가 끊겼어요</div>';else if(b.ok===false)h+='<div class="bad">'+(b.z&&!O2[tk(b.x,b.y)]?'산소가 닿지 않아요 · 거품 펌프를 놓아요':'해류 입구와 길로 이어져야 해요')+'</div>'}
    if(b.z&&built(b)){h+='땅값 '+(b.lvv|0)+'<div class="meter"><i style="width:'+(b.lvv|0)+'%;background:'+(b.lvv>=60?'#35C27A':b.lvv>=40?'#F2B233':'#E5484D')+'"></i></div>'+(b.z==='R'?'사는 물고기 '+(b.occ|0)+' / '+ZG.R.cap[b.lv]:'일자리 '+ZG[b.z].jobs[b.lv]);if(b.lv<3&&!b.up){var zl=HL[HLV()].zl;h+='<br><small>'+(b.lv>=zl?'회관 Lv.'+(b.lv===1?3:6)+'부터 더 크게 다시 지어요':'땅값이 오르고 수요가 있으면 🪨'+ZST[b.lv+1]+'을 써서 더 크게 다시 지어요')+'</small>'}}
    if(d&&built(b)&&b.p!=='hall'){if(d.info)h+='<small>'+d.info+'</small><br>';h+=effTxt(b)+(d.up?' · 유지비 🐚'+d.up*L+'/달':'')}
    if(b.p==='hall'&&built(b)){h+='물고기 '+ST.pop+' · 일꾼 🦀'+crabsMax()+' · 땅 '+Object.keys(VG.own).length+'/'+HL[L].land+'구획 · 집 최대 '+HL[L].zl+'단계'}
    var U=(built(b)&&!b.up&&b.p&&!(d.t==='deco'))?upInfo(b):null;
    if(U){h+='<div class="up"><b>⬆ Lv.'+(L+1)+' 조건</b><br>'+U.req.map(function(r){return (r[1]?'✅ ':'⬜ ')+r[0]}).join('<br>')+'<br>'+(VG.money>=U.cost[0]&&VG.stone>=U.cost[1]?'✅ ':'⬜ ')+costTxt(U.cost)+' · ⏱'+mmss(U.bt);
      if(U.open){var nm=U.open.map(function(k){return k==='zI'?'공장 구역':k==='zC'?'가게 구역':P[k]?P[k].n:k});var mx=Object.keys(U.max).map(function(k){return P[k].n+' '+U.max[k]+'개'});h+='<br><small>열리는 것: '+(nm.concat(mx).join(', ')||'-')+(U.nx.crabs>HL[L].crabs?', 게 일꾼 +1':'')+(U.nx.zl>HL[L].zl?', 집 '+U.nx.zl+'단계':'')+', 땅 '+U.nx.land+'구획</small>'}h+='</div>'}
    h+='<div class="row">'+((!built(b)||b.up)?'<button class="hot" data-a="rush">🐚'+rushCost(b)+' 바로 완성</button>':'')+(U?'<button class="hot" data-a="up">레벨업</button>':'')+(d&&d.fixed?'':(d&&built(b)?'<button data-a="move">옮기기</button>':'')+'<button data-a="flip">돌리기</button><button class="no" data-a="del">부수기</button>')+'<button data-a="x">닫기</button></div>'}
  if(p.dataset.h!==h){p.innerHTML=h;p.dataset.h=h;p.querySelectorAll('button').forEach(function(bt){bt.addEventListener('click',function(){act(bt.dataset.a,b)})});var tr=$('taxR');if(tr)tr.addEventListener('input',function(){VG.tax=+tr.value;persist();openPanel('budget')})}p.hidden=false}
function act(a,b){if(a==='x'){SEL=null;$('panel').hidden=true;return}
  if(a==='new'){if(confirm('지금 마을을 지우고 새로 시작할까요?')){VG=fresh();occMap();FISH.length=0;persist();SEL=null;$('panel').hidden=true;camHome();setSpeed()}return}
  if(a==='buy'){var pr=chunkPrice();if(Object.keys(VG.own).length>=HL[HLV()].land){toast('회관을 키우면 더 살 수 있어요');return}if(!pay(pr)){toast('조개돈 · 산호석이 모자라요');return}VG.own[b.cx+','+b.cy]=1;persist();toast('새 땅이 생겼어요! 🎉');SEL=null;$('panel').hidden=true;paintHud();return}
  if(a==='rush'){var c=rushCost(b);if(VG.money<c){toast('조개돈이 모자라요');return}VG.money-=c;if(b.up)b.up.bp=b.up.bt-.001;else b.bp=b.bt-.001;vgTick();return}
  if(a==='up'){var U=upInfo(b);if(!U)return;var bad=U.req.filter(function(r){return !r[1]});if(bad.length){toast('조건: '+bad[0][0]);return}if(crabsBusy()>=crabsMax()){toast('🦀 게 일꾼이 모두 일하는 중이에요');return}if(!pay(U.cost)){toast('조개돈 · 산호석이 모자라요');return}b.up={lv:(b.lv||1)+1,bp:0,bt:U.bt};persist();paintHud();return}
  if(a==='flip'){b.f=b.f?0:1;persist();return}
  if(a==='del'){VG.b.splice(VG.b.indexOf(b),1);if(b.z)delete VG.zone[tk(b.x,b.y)];occMap();if(b.p){var back=costOf(b.p,1);VG.money+=Math.floor(back[0]/2);VG.stone+=Math.floor(back[1]/2);toast(P[b.p].n+' 부숨 · 절반 돌려받음')}SEL=null;$('panel').hidden=true;persist();return}
  if(a==='move'){TOOL='move';PICK=b;SEL=null;$('panel').hidden=true;showHint('옮길 칸을 눌러요')}}
$('hMoney').addEventListener('click',function(){SEL='budget';openPanel('budget')});
$('hFood').addEventListener('click',function(){SEL='budget';openPanel('budget')});
$('hHall').addEventListener('click',function(){var h=hallB();SEL=h;openPanel(h);var F=foot(h.x,h.y,2),c=iso(F.vx+1,F.vy+1);cam.x=c[0];cam.y=c[1]-40});

/* ===== 입력 ===== */
var PT={},pinch=null,tapStart=null,paint=null;
function paintable(){return TOOL==='road'||(TOOL&&TOOL[0]==='z')||TOOL==='doze'}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);PT[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(PT);
  if(ids.length===2){var a=PT[ids[0]],b=PT[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};tapStart=null;paint=null;GHOST=null;return}
  tapStart={x:e.clientX,y:e.clientY,t:Date.now(),cx:cam.x,cy:cam.y,moved:false};if(paintable()){paint={a:s2tile(e.clientX,e.clientY)};paint.b=paint.a;ghostPaint()}});
cv.addEventListener('pointermove',function(e){if(!PT[e.pointerId])return;PT[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(PT);
  if(pinch&&ids.length===2){var a=PT[ids[0]],b=PT[ids[1]];cam.z=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,.22,2.8);return}
  if(!tapStart)return;var dx=e.clientX-tapStart.x,dy=e.clientY-tapStart.y;if(Math.hypot(dx,dy)>8)tapStart.moved=true;
  if(paint){paint.b=s2tile(e.clientX,e.clientY);ghostPaint();return}
  if(tapStart.moved){cam.x=tapStart.cx-dx/cam.z;cam.y=tapStart.cy-dy/cam.z;clampCam()}});
function endPt(e){delete PT[e.pointerId];if(Object.keys(PT).length<2)pinch=null;if(paint){applyPaint();paint=null;GHOST=null;tapStart=null;return}if(tapStart&&!tapStart.moved&&Date.now()-tapStart.t<500)tap(e.clientX,e.clientY);tapStart=null}
cv.addEventListener('pointerup',endPt);cv.addEventListener('pointercancel',function(e){delete PT[e.pointerId];pinch=null;tapStart=null;paint=null;GHOST=null});
cv.addEventListener('wheel',function(e){e.preventDefault();cam.z=clamp(cam.z*(e.deltaY<0?1.1:.9),.22,2.4)},{passive:false});
function clampCam(){var c=iso(N/2,N/2),r=N*TW*.55;cam.x=clamp(cam.x,c[0]-r,c[0]+r);cam.y=clamp(cam.y,c[1]-r*.6,c[1]+r*.6)}
function paintTiles(){var a=paint.a,b=paint.b,out=[],x,y;if(TOOL==='road'){var dx=b[0]>=a[0]?1:-1,dy=b[1]>=a[1]?1:-1;for(x=a[0];x!==b[0]+dx;x+=dx)out.push([x,a[1]]);for(y=a[1]+dy;y!==b[1]+dy;y+=dy)out.push([b[0],y])}
  else{for(y=Math.min(a[1],b[1]);y<=Math.max(a[1],b[1]);y++)for(x=Math.min(a[0],b[0]);x<=Math.max(a[0],b[0]);x++)out.push([x,y])}return out.filter(function(q){return own(q[0],q[1])})}
function tileCost(q){var k=tk(q[0],q[1]),o=OCC[k],tv=ter(q[0],q[1]);
  if(TOOL==='road')return (isRoad(q[0],q[1])||o||tv)?-1:COST.road;
  if(TOOL==='doze'){if(tv===1)return COST.rock;if(tv===2)return COST.kelp;if(isRoad(q[0],q[1]))return (q[0]===0&&q[1]===MID)?-1:COST.doze;if(o&&!o.p)return COST.doze;return -1}
  if(TOOL==='z0')return VG.zone[k]?0:-1;if(isRoad(q[0],q[1])||tv||(o&&o.p))return -1;return VG.zone[k]===TOOL[1]?-1:COST.zone}
function ghostPaint(){var tl=paintTiles(),sum=0,ok=[];tl.forEach(function(q){var c=tileCost(q);if(c>=0){sum+=c;ok.push(q)}});GHOST={tiles:ok,ok:sum<=VG.money};$('hint').firstChild.textContent=ok.length+'칸 · 🐚'+sum}
function applyPaint(){var tl=paintTiles(),spent=0,n=0;tl.forEach(function(q){var c=tileCost(q);if(c<0||VG.money<c)return;var k=tk(q[0],q[1]),o=OCC[k];VG.money-=c;spent+=c;n++;
    if(TOOL==='road')VG.road[k]=1;
    else if(TOOL==='z0'){delete VG.zone[k];if(o&&o.z)VG.b.splice(VG.b.indexOf(o),1)}
    else if(TOOL==='doze'){if(ter(q[0],q[1]))VG.ter[q[1]*N+q[0]]=0;else if(isRoad(q[0],q[1]))delete VG.road[k];else if(o){VG.b.splice(VG.b.indexOf(o),1);delete VG.zone[k]}}
    else{VG.zone[k]=TOOL[1];if(o&&o.z&&o.z!==TOOL[1])VG.b.splice(VG.b.indexOf(o),1)}occMap()});
  if(n){persist();showHint(n+'칸 · 🐚'+spent+' 썼어요')}else if(tl.length)toast(VG.money<COST.zone?'조개돈이 모자라요':'여긴 안 돼요');paintHud()}
function hitB(sx,sy){var best=null,bz=-1;VG.b.forEach(function(b){var s=bSize(b),c=centerOf(b.x,b.y,s),p=w2s(c),w=s*TW*cam.z*.45,h=s*TH*cam.z*3;if(sx>p[0]-w&&sx<p[0]+w&&sy<p[1]+s*TH*cam.z*.5&&sy>p[1]-h){var F=foot(b.x,b.y,s),z=F.vX+F.vY;if(z>bz){bz=z;best=b}}});return best}
function tap(sx,sy){var tl=s2tile(sx,sy),x=tl[0],y=tl[1];
  if(TOOL&&TOOL.indexOf('p:')===0){var k=TOOL.slice(2),d=P[k],s=d.s,gx=x-(s>1?1:0),gy=y-(s>1?1:0),ok=freeArea(gx,gy,s);
    if(GHOST&&GHOST.p&&GHOST.x===gx&&GHOST.y===gy&&ok){var c0=costOf(k,1);if(countOf(k)>=limitOf(k)){toast('회관 레벨 한도예요');return}if(crabsBusy()>=crabsMax()){toast('🦀 게 일꾼이 모두 일하는 중이에요 · 하나가 끝나면 지어요');return}if(!pay(c0)){toast('조개돈 · 산호석이 모자라요');return}
      var nb={id:VG.nid++,p:k,x:gx,y:gy,f:0,bp:0,bt:d.bt,lv:1};VG.b.push(nb);occMap();floatTxt(nb,'-'+costTxt(c0));persist();GHOST=null;paintHud();return}
    var tl2=[];for(var i=0;i<s;i++)for(var j=0;j<s;j++)tl2.push([gx+i,gy+j]);GHOST={p:k,x:gx,y:gy,ok:ok&&VG.money>=costOf(k,1)[0],tiles:tl2};if(!ok)toast(inb(x,y)&&!own(x,y)?'아직 내 땅이 아니에요':inb(x,y)&&ter(x,y)?'바위 · 해초는 불도저로 치워요':'이 칸엔 못 지어요');return}
  if(TOOL==='move'&&PICK){var s2=bSize(PICK),mx=x-(s2>1?1:0),my=y-(s2>1?1:0);if(freeArea(mx,my,s2,PICK)){PICK.x=mx;PICK.y=my;occMap();persist();var b0=PICK;stopTool();SEL=b0;openPanel(b0)}else toast('이 칸엔 못 옮겨요');return}
  var hb=hitB(sx,sy);if(hb){SEL=hb;openPanel(hb);return}
  if(inb(x,y)&&!own(x,y)){var cx=Math.floor(x/CK),cy=Math.floor(y/CK);if(chunkBuyable(cx,cy)){SEL={chunk:1,cx:cx,cy:cy};openPanel(SEL);return}toast('붙어 있는 땅부터 살 수 있어요');return}
  SEL=null;$('panel').hidden=true}
$('bRot').addEventListener('click',function(){var c0=s2tile(cw/2,ch*.47);VG.rot=(VG.rot+1)%4;var r=rot(clamp(c0[0],0,N-1),clamp(c0[1],0,N-1)),p=iso(r[0]+.5,r[1]+.5);cam.x=p[0];cam.y=p[1];persist()});
$('bZin').addEventListener('click',function(){cam.z=clamp(cam.z*1.2,.22,2.8)});$('bZout').addEventListener('click',function(){cam.z=clamp(cam.z/1.2,.22,2.4)});
$('bSpd').addEventListener('click',function(){VG.spd=(VG.spd+1)%3;setSpeed()});
$('bView').addEventListener('click',function(){VIEW=(VIEW+1)%4;$('bView').lastChild.textContent=['보기','산소','땅값','탁함'][VIEW];$('bView').setAttribute('aria-pressed',VIEW?'true':'false');toast(['보통 화면','산소 지도 · 파랑이 산소 닿는 곳','땅값 지도 · 초록일수록 좋아요','탁한 물 지도 · 공장 근처'][VIEW])});

/* ===== 돌리기 ===== */
var last=performance.now();function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;fishStep(dt);var i;for(i=FLT.length-1;i>=0;i--){FLT[i].t+=dt;if(FLT[i].t>1.8)FLT.splice(i,1)}for(i=PUFF.length-1;i>=0;i--){PUFF[i].t+=dt;if(PUFF[i].t>.8)PUFF.splice(i,1)}try{vgDraw()}catch(e){console.error(e)}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
renderTray();setSpeed();vgTick();
if(VG.tick<3)toast('빈 바닷속 땅이에요 · 마을 회관을 키우며 단계별로 넓혀 가요');
addEventListener('visibilitychange',function(){if(document.hidden)persist()});
window.__vg={get VG(){return VG},P:P,ST:ST,cam:cam,tick:vgTick,
  road:function(x0,y0,x1,y1){for(var y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)for(var x=Math.min(x0,x1);x<=Math.max(x0,x1);x++){VG.ter[y*N+x]=0;VG.road[tk(x,y)]=1}},
  zone:function(z,x0,y0,x1,y1){for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){if(isRoad(x,y)||OCC[tk(x,y)])continue;VG.ter[y*N+x]=0;VG.zone[tk(x,y)]=z}},
  put:function(k,x,y,done){var s=P[k].s;for(var i=0;i<s;i++)for(var j=0;j<s;j++)VG.ter[(y+j)*N+x+i]=0;VG.b.push({id:VG.nid++,p:k,x:x,y:y,f:0,bp:done?P[k].bt:0,bt:P[k].bt,lv:1});occMap()},hall:function(l){hallB().lv=l},lv:function(k,l){VG.b.forEach(function(b){if(b.p===k)b.lv=l})},
  own:function(cx,cy){VG.own[cx+','+cy]=1}};
})();
</script>
