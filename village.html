<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>물고기 마을 (시험판)</title>
<!-- 물고기 마을 2차 — 늑구 '약간 스펀지밥 마을처럼 꾸미고, 진짜 도시 시뮬처럼 시작 · 수족관이랑 다르게 · 심시티 · 시티즈 스카이라인 · 모바일 건설경영 게임처럼'
     · 빈 바닷속 땅에서 시작: 해류 입구 길 하나뿐, 바위 · 해초 숲은 불도저로 치움
     · 구역 칠하기(집 · 가게 · 공장) → 수요가 있고 입구와 길로 이어지고 산소가 닿으면 건물이 저절로 자라고, 땅값이 좋으면 커짐(Lv.1~3)
     · 산소 = 거품 펌프(전기 · 수도 같은 기반 시설), 공장 근처는 물이 탁해져 땅값이 떨어짐
     · 도시 돈은 조개돈(🐚)으로 따로: 세율 · 한 달(30초) 세금/유지비 · 빠르기 · 지도 보기(산소 · 땅값 · 탁함) · 목표
     · 그림은 게임 svart/ 그대로(저장소 맨 위, svart/ 옆). 밝은 열대 바다 · 굵은 외곽선 만화 느낌(특정 만화의 집 · 인물은 따라 그리지 않음) -->
<style>
:root{--ink:#123049;--paper:#FFF9EE;--gold:#FFD25C;--hot:#FF9F2E;--red:#E5484D;--ok:#35C27A;--R:#43C46B;--C:#3D9BFF;--I:#FFB02E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0B6BA8;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 60px)}
.pill{pointer-events:auto;background:rgba(255,249,238,.95);border:2px solid #123049;border-radius:999px;padding:4px 10px;font:800 14px/1.15 system-ui,sans-serif;box-shadow:0 3px 0 #123049;display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--ink)}
button.pill{cursor:pointer}
.dem{display:flex;gap:4px;align-items:center;height:24px}
.dem b{display:flex;flex-direction:column;align-items:center;font-size:9px;line-height:1;gap:1px}
.dem i{display:block;width:9px;height:15px;border-radius:3px;background:#dfe7ee;position:relative;overflow:hidden;border:1px solid #123049}
.dem i u{position:absolute;left:0;right:0;bottom:0}
.side{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:7px}
.rb{width:46px;height:46px;border:2px solid #123049;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 #123049;font:800 18px system-ui;color:var(--ink);padding:0}
.rb small{display:block;font-size:9px;font-weight:800;margin-top:-1px}
.rb[aria-pressed=true]{background:var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(8,60,100,0),rgba(8,60,100,.88) 28%)}
.tabs{display:flex;gap:3px;background:#123049;border-radius:14px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;border-radius:10px;padding:7px 1px;font:800 12.5px system-ui;color:#DCEBF6;background:transparent;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--gold);color:#3A2400}
.tray{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;touch-action:pan-x}
.tray::-webkit-scrollbar{display:none}
.card{flex:none;width:78px;border:2px solid #123049;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 #123049;padding:4px 3px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font:800 11px system-ui;color:var(--ink);position:relative}
.card img,.card .sw{width:50px;height:42px;object-fit:contain}
.card .sw{border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px}
.card b{font-size:11px;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:10.5px;font-weight:700;white-space:nowrap}
.card[data-on="1"]{background:#FFE7A0;transform:translateY(-3px)}
.card[data-poor="1"]{opacity:.5}
.card .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(255,249,238,.75);border-radius:12px}
.panel{position:fixed;left:10px;right:10px;bottom:calc(172px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--paper);border:2px solid #123049;border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 #123049;font:14px/1.45 system-ui}
.panel h2{margin:0 0 4px;font-size:17px}
.panel .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.panel button{flex:1;border:2px solid #123049;border-radius:12px;padding:8px 6px;font:800 13px system-ui;background:#E8F1F8;color:var(--ink)}
.panel button.no{background:#FFD9D9}
.panel table{width:100%;border-collapse:collapse;font-size:13.5px}
.panel td{padding:2px 0}.panel td:last-child{text-align:right;font-weight:800}
.panel input[type=range]{width:100%}
.meter{height:8px;border-radius:5px;background:#dfe7ee;overflow:hidden;margin:3px 0}
.meter i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#123049;color:#fff;padding:9px 14px;border-radius:14px;font:800 13.5px system-ui;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s}
.hint{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);border:2px solid #123049;padding:6px 10px;border-radius:12px;font:800 13px system-ui;white-space:nowrap;box-shadow:0 3px 0 #123049}
.hint button{margin-left:8px;border:0;border-radius:9px;padding:4px 9px;font:800 12px system-ui;background:var(--red);color:#fff}
.goal{position:fixed;left:10px;top:calc(86px + env(safe-area-inset-top,0px));background:rgba(255,249,238,.95);border:2px solid #123049;border-radius:12px;padding:6px 10px;font:800 12.5px/1.35 system-ui;max-width:60vw;box-shadow:0 3px 0 #123049}
.goal small{display:block;font-weight:700;opacity:.7}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <button class="pill" id="hMoney" type="button">🐚 0</button>
  <div class="pill" id="hPop">🐟 0</div>
  <div class="pill" id="hDate">1년 1월</div>
  <div class="pill" id="hHap">😊 –</div>
  <div class="pill" aria-label="수요"><div class="dem" id="hDem"><b><i><u style="background:var(--R)"></u></i>집</b><b><i><u style="background:var(--C)"></u></i>가</b><b><i><u style="background:var(--I)"></u></i>공</b></div></div>
</div>
<div class="goal" id="goal"></div>
<div class="side">
  <button class="rb" id="bSpd" aria-label="빠르기">▶<small>보통</small></button>
  <button class="rb" id="bView" aria-label="지도 보기">👁<small>보기</small></button>
  <button class="rb" id="bRot" aria-label="화면 돌리기">⟳<small>돌리기</small></button>
  <button class="rb" id="bZin" aria-label="크게">＋</button>
  <button class="rb" id="bZout" aria-label="작게">－</button>
</div>
<div class="hint" id="hint" hidden><span></span><button type="button" id="hintX">그만</button></div>
<div class="panel" id="panel" hidden></div>
<div class="bar">
  <div class="tabs" id="tabs">
    <button data-t="road">길</button><button data-t="zone">구역</button><button data-t="util">산소</button><button data-t="svc">편의</button><button data-t="deco">꾸미기</button><button data-t="tool">불도저</button>
  </div>
  <div class="tray" id="tray"></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d'),dpr=1,cw=0,ch=0,t=0;
var ART={};function art(k){var o=ART[k];if(!o){o=ART[k]=new Image();o.decoding='async';o.src='svart/'+k+'.webp'}return o.complete&&o.naturalWidth?o:null}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function hh(n){var x=(n*2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;x=Math.imul(x,3266489917)>>>0;x^=x>>>16;return (x>>>0)/4294967296}

/* ===== 구역에서 저절로 자라는 건물(Lv.1~3) ===== */
var ZG={R:{n:'집',cap:[0,4,10,24],arts:[[],['house1','dc_orangehouse','dc_berryhouse','dc_melonhouse'],['house2','dc_cottage'],['house3']]},
        C:{n:'가게',jobs:[0,3,8,18],arts:[[],['dc_amphora','dc_chest'],['dc_mushroom','dc_clam'],['dc_coralcastle']]},
        I:{n:'공장',jobs:[0,5,12,24],arts:[[],['dc_marimo','dc_anemgarden'],['dc_pearlclam','dc_tablecoral'],['dc_braincoral']]}};
/* ===== 직접 놓는 시설 ===== */
var P={
 hall:{n:'마을 회관',k:'house4',s:2,c:0,fixed:1,sc:1.15},
 pump:{t:'util',n:'거품 펌프',k:'dc_bubbler',s:1,c:300,o2:6,up:12,info:'주변 6칸에 산소 · 건물이 자라려면 꼭 필요해요'},
 pump2:{t:'util',n:'큰 거품 탑',k:'dc_crystal',s:1,c:900,o2:10,up:30,need:120,info:'주변 10칸에 산소'},
 park:{t:'svc',n:'산호 공원',k:'dc_coralarch',s:1,c:150,r:4,hap:12,up:5},
 lamp:{t:'svc',n:'빛버섯 가로등',k:'dc_mushroom',s:1,c:70,r:2,hap:6,up:2},
 light:{t:'svc',n:'등대',k:'dc_lighthouse',s:1,c:450,r:7,hap:10,up:12,need:60},
 gold:{t:'svc',n:'황금 물고기상',k:'dc_goldstatue',s:1,c:800,r:6,hap:18,up:15,need:150},
 king:{t:'svc',n:'용왕 동상',k:'dc_dragonking',s:1,c:1600,r:8,hap:26,up:25,need:300},
 d1:{t:'deco',n:'분재 산호',k:'dc_bonsai',s:1,c:40,deco:4},d2:{t:'deco',n:'부채 산호',k:'dc_seafan',s:1,c:30,deco:3},d3:{t:'deco',n:'바위 정원',k:'dc_iwagumi',s:1,c:45,deco:4},d4:{t:'deco',n:'작은 산호',k:'coral',s:1,c:20,deco:2}
};
var COST={road:10,zone:5,rock:40,kelp:15,doze:2};

/* ===== 상태 ===== */
var N=24,MID=N/2,KEY='fishvillage.v2',VG=null;
function genMap(seed){var T=[],x,y;for(y=0;y<N;y++)for(x=0;x<N;x++){var n=hh(seed*977+x*31+y*7),c=hh(seed+Math.floor(x/4)*13+Math.floor(y/4)*29),v=0;if(c>.7&&n>.5)v=2;else if(n>.965)v=1;if(c<.07&&n>.45)v=1;T.push(v)}
  for(y=MID-5;y<=MID+5;y++)for(x=0;x<13;x++)T[y*N+x]=0;return T}
function fresh(){var seed=Math.floor(Math.random()*1e6),g={v:2,seed:seed,money:5000,tax:9,tick:0,month:1,year:1,rot:0,ter:genMap(seed),road:{},zone:{},b:[],nid:1,last:{inc:0,exp:0},spd:1,gi:0};
  for(var x=0;x<6;x++)g.road[x+','+MID]=1;g.b.push({id:g.nid++,p:'hall',x:6,y:MID-2,f:0});return g}
function load(){try{var s=localStorage.getItem(KEY);if(s){var g=JSON.parse(s);if(g&&g.v===2)return g}}catch(e){}return fresh()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(VG))}catch(e){}}
VG=load();
function tk(x,y){return x+','+y}
function inb(x,y){return x>=0&&y>=0&&x<N&&y<N}
function ter(x,y){return VG.ter[y*N+x]}
function isRoad(x,y){return !!VG.road[tk(x,y)]}
function bSize(b){return b.p?P[b.p].s:1}
var OCC={};function occMap(){OCC={};VG.b.forEach(function(b){var s=bSize(b);for(var i=0;i<s;i++)for(var j=0;j<s;j++)OCC[tk(b.x+i,b.y+j)]=b})}occMap();
function freeTile(x,y,ign){return inb(x,y)&&!isRoad(x,y)&&!(OCC[tk(x,y)]&&OCC[tk(x,y)]!==ign)&&ter(x,y)===0}
function ring(x,y,s,fn){for(var i=-1;i<=s;i++)for(var j=-1;j<=s;j++){if((i>=0&&i<s)&&(j>=0&&j<s))continue;if((i===-1||i===s)&&(j===-1||j===s))continue;if(fn(x+i,y+j))return true}return false}
function roadNear(x,y,s){return ring(x,y,s||1,isRoad)}
/* 해류 입구와 길로 이어졌는지 */
var LINK={};function linkCalc(){LINK={};if(!isRoad(0,MID))return;var q=[[0,MID]],seen={};seen[tk(0,MID)]=1;while(q.length){var c=q.shift();LINK[tk(c[0],c[1])]=1;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var X=c[0]+d[0],Y=c[1]+d[1],k=tk(X,Y);if(!seen[k]&&isRoad(X,Y)){seen[k]=1;q.push([X,Y])}})}}
function linked(x,y,s){return ring(x,y,s||1,function(X,Y){return !!LINK[tk(X,Y)]})}

/* ===== 지도 값: 산소 · 탁한 물 · 땅값 ===== */
var O2={},POL={},LV={};
function fields(){O2={};POL={};LV={};VG.b.forEach(function(b){var d=b.p?P[b.p]:null,s=bSize(b),cx=b.x+s/2-.5,cy=b.y+s/2-.5,x,y;
  if(d&&d.o2&&b.ok!==false){for(y=Math.floor(cy-d.o2);y<=cy+d.o2;y++)for(x=Math.floor(cx-d.o2);x<=cx+d.o2;x++)if(inb(x,y)&&Math.hypot(x-cx,y-cy)<=d.o2+.3)O2[tk(x,y)]=1}
  if(b.z==='I'&&!b.ab){var r=2+b.lv;for(y=b.y-r;y<=b.y+r;y++)for(x=b.x-r;x<=b.x+r;x++)if(inb(x,y)){var dd=Math.max(Math.abs(x-b.x),Math.abs(y-b.y));POL[tk(x,y)]=(POL[tk(x,y)]||0)+(10+b.lv*6)*(1-dd/(r+1))}}
  if(d&&(d.hap||d.deco)){var rr=d.r||2,h=d.hap||d.deco;for(y=b.y-rr;y<=b.y+rr;y++)for(x=b.x-rr;x<=b.x+rr;x++)if(inb(x,y))LV[tk(x,y)]=(LV[tk(x,y)]||0)+h}
  if(b.z==='C'&&!b.ab){for(y=b.y-4;y<=b.y+4;y++)for(x=b.x-4;x<=b.x+4;x++)if(inb(x,y))LV[tk(x,y)]=(LV[tk(x,y)]||0)+2+b.lv}})}
function landVal(x,y){var v=48+Math.min(40,LV[tk(x,y)]||0)-Math.min(45,POL[tk(x,y)]||0),near=0;for(var j=-2;j<=2;j++)for(var i=-2;i<=2;i++)if(inb(x+i,y+j)&&ter(x+i,y+j)===2)near++;v+=Math.min(8,near*2);v-=(VG.tax-9)*2.5;return clamp(Math.round(v),0,100)}

/* ===== 시뮬레이션: 1틱 = 1초(빠르게 0.35초) · 30틱 = 한 달 ===== */
var ST={pop:0,jobsC:0,jobsI:0,work:0,hap:0,dem:{R:0,C:0,I:0},cnt:{R:0,C:0,I:0}};
function vgTick(){linkCalc();var bs=VG.b;bs.forEach(function(b){if(b.p)b.ok=true});fields();var pop=0,jC=0,jI=0,hs=0,cnt={R:0,C:0,I:0};
  bs.forEach(function(b){if(!b.z)return;cnt[b.z]++;b.ok=linked(b.x,b.y,1)&&!!O2[tk(b.x,b.y)];if(!b.ok){b.bad=(b.bad||0)+1;if(b.bad>12)b.ab=1}else{b.bad=0;if(b.ab&&Math.random()<.15)b.ab=0}
    b.lvv=landVal(b.x,b.y);if(b.ab)return;
    if(b.z==='R'){var cap=ZG.R.cap[b.lv],tgt=Math.round(cap*clamp(.45+b.lvv/90,0,1));if((b.occ|0)<tgt&&Math.random()<.5){b.occ=(b.occ|0)+1;arrive()}else if((b.occ|0)>tgt)b.occ--;pop+=b.occ|0;hs+=b.lvv*(b.occ|0)}
    else if(b.z==='C')jC+=ZG.C.jobs[b.lv];else jI+=ZG.I.jobs[b.lv]});
  var workers=Math.round(pop*.65),jobs=jC+jI;
  var dR=(jobs*1.5+20-workers)/30,dC=(pop*.22-jC)/12,dI=(pop*.42+14-jI)/20;dR-=(VG.tax-9)*.06;dC-=(VG.tax-9)*.05;dI-=(VG.tax-9)*.05;
  ST.dem={R:clamp(dR,-1,1),C:clamp(dC,-1,1),I:clamp(dI,-1,1)};
  ['R','C','I'].forEach(function(z){var d=ST.dem[z];if(d<=0)return;var tries=d>.6?3:d>.3?2:1;for(var k=0;k<tries;k++)if(Math.random()<.7)growOne(z)});
  if(VG.tick%3===0)upgradeOne();
  ST.pop=pop;ST.jobsC=jC;ST.jobsI=jI;ST.work=Math.min(workers,jobs);ST.hap=pop?Math.round(hs/pop):0;ST.cnt=cnt;
  VG.tick++;if(VG.tick%30===0)monthEnd();if(VG.tick%15===0)persist();paintHud()}
function zoneTiles(z){var out=[];for(var k in VG.zone)if(VG.zone[k]===z&&!OCC[k]&&O2[k]){var q=k.split(','),x=+q[0],y=+q[1];if(linked(x,y))out.push([x,y])}return out}
function growOne(z){var L=zoneTiles(z);if(!L.length)return;L.sort(function(a,b){return landVal(b[0],b[1])-landVal(a[0],a[1])});var p=L[Math.floor(Math.random()*Math.min(L.length,4))];
  var A=ZG[z].arts[1],nb={id:VG.nid++,z:z,lv:1,x:p[0],y:p[1],art:A[Math.floor(Math.random()*A.length)],occ:0,f:Math.random()<.5?1:0,born:t};VG.b.push(nb);OCC[tk(p[0],p[1])]=nb;puff(nb)}
function upgradeOne(){var c=VG.b.filter(function(b){if(!b.z||b.ab||b.lv>=3||!b.ok||ST.dem[b.z]<=-.2)return false;var need=b.lv===1?55:72;if(b.z==='R')return b.lvv>=need&&(b.occ|0)>=ZG.R.cap[b.lv]*.8;return ST.pop>=(b.lv===1?60:220)&&b.lvv>=need-15});
  if(!c.length)return;var b=c[Math.floor(Math.random()*c.length)];b.lv++;var A=ZG[b.z].arts[b.lv];b.art=A[Math.floor(Math.random()*A.length)];b.born=t;puff(b);floatTxt(b,ZG[b.z].n+' 커졌어요!')}
function monthEnd(){var inc=Math.round((ST.pop*1.1+ST.jobsC*1.4+ST.jobsI*1.1)*VG.tax/9*(.8+ST.hap/250)),exp=Math.round(Object.keys(VG.road).length*.5);VG.b.forEach(function(b){if(b.p&&P[b.p].up)exp+=P[b.p].up});
  VG.money+=inc-exp;VG.last={inc:inc,exp:exp};VG.month++;if(VG.month>12){VG.month=1;VG.year++}floatTxt(VG.b[0],(inc-exp>=0?'+':'')+(inc-exp)+'🐚');if(VG.money<0)toast('조개돈이 바닥났어요 · 세금을 올리거나 유지비를 줄여요');persist()}

 {t:'물고기 300마리',d:'용왕 동상을 세워 봐요',ok:function(){return ST.pop>=300}}];
function goalPaint(){var i;for(i=0;i<GOALS.length;i++)if(!GOALS[i].ok())break;var el=$('goal');if(i>(VG.gi|0)){VG.gi=i;toast('목표 달성! 🎉 🐚+200');VG.money+=200}if(i>=GOALS.length){el.hidden=true;return}var g=GOALS[i],h='🎯 '+g.t+'<small>'+g.d+'</small>';if(el.dataset.h!==h){el.innerHTML=h;el.dataset.h=h}el.hidden=false}
var TOAST=0;function toast(s){var el=$('toast');el.textContent=s;el.hidden=false;el.style.opacity=1;clearTimeout(TOAST);TOAST=setTimeout(function(){el.style.opacity=0;setTimeout(function(){el.hidden=true},300)},2400)}

/* ===== 도구 서랍 ===== */
var TAB='util';
function tools(){var L=[];if(TAB==='road')L.push({id:'road',n:'모래 길',sw:'🛤️',bg:'#DDAE78',c:COST.road+'🐚/칸'});
  else if(TAB==='zone')L.push({id:'zR',n:'집 구역',sw:'🏠',bg:'rgba(67,196,107,.45)',c:COST.zone+'🐚/칸'},{id:'zC',n:'가게 구역',sw:'🛍️',bg:'rgba(61,155,255,.45)',c:COST.zone+'🐚/칸'},{id:'zI',n:'공장 구역',sw:'🏭',bg:'rgba(255,176,46,.5)',c:COST.zone+'🐚/칸'},{id:'z0',n:'구역 지우기',sw:'🧽',bg:'#eee',c:'무료'});
  else if(TAB==='tool')L.push({id:'doze',n:'불도저',sw:'🚜',bg:'#FFD9D9',c:'바위 '+COST.rock+' · 해초 '+COST.kelp});
  else Object.keys(P).forEach(function(k){var d=P[k];if(d.t===TAB)L.push({id:'p:'+k,n:d.n,k:d.k,c:d.c,need:d.need})});return L}
function renderTray(soft){var tr=$('tray'),sig=TAB+'|'+(TOOL||'')+'|'+Math.floor(VG.money/50)+'|'+Math.floor(ST.pop/10);if(soft&&tr.dataset.k===sig)return;tr.dataset.k=sig;tr.textContent='';
  document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===TAB?'true':'false')});
  tools().forEach(function(o){var el=document.createElement('button');el.type='button';el.className='card';
    if(o.k){var im=new Image();im.src='svart/'+o.k+'.webp';el.appendChild(im)}else{var sw=document.createElement('div');sw.className='sw';sw.style.background=o.bg;sw.textContent=o.sw;el.appendChild(sw)}
    var nm=document.createElement('b');nm.textContent=o.n;el.appendChild(nm);var sp=document.createElement('span');sp.textContent=typeof o.c==='number'?'🐚 '+o.c:o.c;el.appendChild(sp);
    var lock=o.need&&ST.pop<o.need;if(lock){var lk=document.createElement('div');lk.className='lk';lk.textContent='🔒 🐟'+o.need;el.appendChild(lk)}
    if(typeof o.c==='number'&&VG.money<o.c)el.dataset.poor='1';if(TOOL===o.id)el.dataset.on='1';
    el.addEventListener('click',function(){if(lock){toast('물고기 '+o.need+'마리부터 지을 수 있어요');return}if(TOOL===o.id){stopTool();return}TOOL=o.id;SEL=null;$('panel').hidden=true;GHOST=null;
      showHint(o.id==='road'?'끌어서 길을 깔아요(ㄱ자로)':o.id[0]==='z'?(o.id==='z0'?'끌어서 구역을 지워요':'끌어서 네모로 칠해요'):o.id==='doze'?'누르거나 끌어서 치워요':'놓을 칸을 눌러요 · 한 번 더 누르면 지어요');renderTray()});tr.appendChild(el)})}
document.querySelectorAll('#tabs button').forEach(function(b){b.addEventListener('click',function(){TAB=b.dataset.t;stopTool()})});
function showHint(s){var h=$('hint');h.firstChild.textContent=s;h.hidden=false}
function stopTool(){TOOL=null;GHOST=null;PICK=null;$('hint').hidden=true;renderTray()}
$('hintX').addEventListener('click',stopTool);

/* ===== 패널: 건물 정보 · 예산 ===== */
function openPanel(b){var p=$('panel'),h='';
  if(b==='budget'){h='<h2>🐚 마을 예산</h2><table><tr><td>지난달 세금</td><td>+'+fmt(VG.last.inc)+'</td></tr><tr><td>지난달 유지비(길 · 시설)</td><td>-'+fmt(VG.last.exp)+'</td></tr><tr><td>집 · 가게 · 공장</td><td>'+ST.cnt.R+' · '+ST.cnt.C+' · '+ST.cnt.I+'</td></tr><tr><td>일자리(가게 · 공장)</td><td>'+ST.jobsC+' · '+ST.jobsI+'</td></tr></table>'+
    '<div style="margin-top:6px;font-weight:800">세율 '+VG.tax+'%</div><input type="range" min="0" max="20" value="'+VG.tax+'" id="taxR"><small>세금을 올리면 돈은 늘지만 땅값 · 수요가 떨어져요</small><div class="row"><button data-a="new" class="no">새 마을</button><button data-a="x">닫기</button></div>'}
  else{var d=b.p?P[b.p]:null;h='<h2>'+(d?d.n:ZG[b.z].n+' Lv.'+b.lv)+'</h2>';
    if(b.ab)h+='<div style="color:#8A1E22;font-weight:800">빈 건물 · 길이나 산소가 끊겼어요</div>';else if(b.ok===false)h+='<div style="color:#B3261E;font-weight:800">'+(b.z&&!O2[tk(b.x,b.y)]?'산소가 닿지 않아요 · 거품 펌프를 놓아요':'해류 입구와 길로 이어져야 해요')+'</div>';
    if(b.z){h+='땅값 '+(b.lvv|0)+'<div class="meter"><i style="width:'+(b.lvv|0)+'%;background:'+(b.lvv>=60?'#35C27A':b.lvv>=40?'#F2B233':'#E5484D')+'"></i></div>';
      h+=b.z==='R'?'사는 물고기 '+(b.occ|0)+' / '+ZG.R.cap[b.lv]:'일자리 '+ZG[b.z].jobs[b.lv];if(b.z==='I')h+=' · 주변 물이 탁해져요';if(b.lv<3)h+='<br><small>땅값이 오르고 수요가 있으면 더 크게 자라요</small>'}
    if(d){if(d.o2)h+=d.info;if(d.r)h+='주변 '+d.r+'칸 땅값 +'+d.hap;if(d.deco)h+='주변 2칸 땅값 +'+d.deco;if(d.up)h+='<br>한 달 유지비 🐚'+d.up;if(b.p==='hall')h+='물고기 '+ST.pop+' · 일자리 '+(ST.jobsC+ST.jobsI)+'<br>한 달(30초)마다 세금이 들어와요'}
    h+='<div class="row">'+(d&&d.fixed?'':(d?'<button data-a="move">옮기기</button>':'')+'<button data-a="flip">뒤집기</button><button class="no" data-a="del">부수기</button>')+'<button data-a="x">닫기</button></div>'}
  if(p.dataset.h!==h){p.innerHTML=h;p.dataset.h=h;p.querySelectorAll('button').forEach(function(bt){bt.addEventListener('click',function(){act(bt.dataset.a,b)})});var tr=$('taxR');if(tr)tr.addEventListener('input',function(){VG.tax=+tr.value;persist();openPanel('budget')})}p.hidden=false}
function act(a,b){if(a==='x'){SEL=null;$('panel').hidden=true;return}
  if(a==='new'){if(confirm('지금 마을을 지우고 새로 시작할까요?')){VG=fresh();occMap();FISH.length=0;persist();SEL=null;$('panel').hidden=true;camHome();setSpeed()}return}
  if(a==='flip'){b.f=b.f?0:1;persist();return}
  if(a==='del'){VG.b.splice(VG.b.indexOf(b),1);if(b.z)delete VG.zone[tk(b.x,b.y)];occMap();if(b.p){var back=Math.floor(P[b.p].c/2);VG.money+=back;toast(P[b.p].n+' 부숨 · 🐚'+back+' 돌려받음')}SEL=null;$('panel').hidden=true;persist();return}
  if(a==='move'){TOOL='move';PICK=b;SEL=null;$('panel').hidden=true;showHint('옮길 칸을 눌러요')}}
$('hMoney').addEventListener('click',function(){SEL='budget';openPanel('budget')});

/* ===== 입력: 밀기 · 두 손가락 확대 · 끌어서 칠하기 ===== */
var PT={},pinch=null,tapStart=null,paint=null;
function paintable(){return TOOL==='road'||(TOOL&&TOOL[0]==='z')||TOOL==='doze'}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);PT[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(PT);
  if(ids.length===2){var a=PT[ids[0]],b=PT[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};tapStart=null;paint=null;GHOST=null;return}
  tapStart={x:e.clientX,y:e.clientY,t:Date.now(),cx:cam.x,cy:cam.y,moved:false};if(paintable()){paint={a:s2tile(e.clientX,e.clientY)};paint.b=paint.a;ghostPaint()}});
cv.addEventListener('pointermove',function(e){if(!PT[e.pointerId])return;PT[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(PT);
  if(pinch&&ids.length===2){var a=PT[ids[0]],b=PT[ids[1]];cam.z=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,.3,2.4);return}
  if(!tapStart)return;var dx=e.clientX-tapStart.x,dy=e.clientY-tapStart.y;if(Math.hypot(dx,dy)>8)tapStart.moved=true;
  if(paint){paint.b=s2tile(e.clientX,e.clientY);ghostPaint();return}
  if(tapStart.moved){cam.x=tapStart.cx-dx/cam.z;cam.y=tapStart.cy-dy/cam.z;clampCam()}});
function endPt(e){delete PT[e.pointerId];if(Object.keys(PT).length<2)pinch=null;if(paint){applyPaint();paint=null;GHOST=null;tapStart=null;return}if(tapStart&&!tapStart.moved&&Date.now()-tapStart.t<500)tap(e.clientX,e.clientY);tapStart=null}
cv.addEventListener('pointerup',endPt);cv.addEventListener('pointercancel',function(e){delete PT[e.pointerId];pinch=null;tapStart=null;paint=null;GHOST=null});
cv.addEventListener('wheel',function(e){e.preventDefault();cam.z=clamp(cam.z*(e.deltaY<0?1.1:.9),.3,2.4)},{passive:false});
function clampCam(){var c=iso(N/2,N/2),r=N*TW*.55;cam.x=clamp(cam.x,c[0]-r,c[0]+r);cam.y=clamp(cam.y,c[1]-r*.6,c[1]+r*.6)}
function paintTiles(){var a=paint.a,b=paint.b,out=[],x,y;if(TOOL==='road'){var dx=b[0]>=a[0]?1:-1,dy=b[1]>=a[1]?1:-1;for(x=a[0];x!==b[0]+dx;x+=dx)out.push([x,a[1]]);for(y=a[1]+dy;y!==b[1]+dy;y+=dy)out.push([b[0],y])}
  else{for(y=Math.min(a[1],b[1]);y<=Math.max(a[1],b[1]);y++)for(x=Math.min(a[0],b[0]);x<=Math.max(a[0],b[0]);x++)out.push([x,y])}return out.filter(function(q){return inb(q[0],q[1])})}
function tileCost(q){var k=tk(q[0],q[1]),o=OCC[k],tv=ter(q[0],q[1]);
  if(TOOL==='road')return (isRoad(q[0],q[1])||o||tv)?-1:COST.road;
  if(TOOL==='doze'){if(tv===1)return COST.rock;if(tv===2)return COST.kelp;if(isRoad(q[0],q[1]))return (q[0]===0&&q[1]===MID)?-1:COST.doze;if(o&&!o.p)return COST.doze;return -1}
  if(TOOL==='z0')return VG.zone[k]?0:-1;if(isRoad(q[0],q[1])||tv||(o&&o.p))return -1;return VG.zone[k]===TOOL[1]?-1:COST.zone}
function ghostPaint(){var tl=paintTiles(),sum=0,ok=[];tl.forEach(function(q){var c=tileCost(q);if(c>=0){sum+=c;ok.push(q)}});GHOST={tiles:ok,ok:sum<=VG.money};$('hint').firstChild.textContent=ok.length+'칸 · 🐚'+sum}
function applyPaint(){var tl=paintTiles(),spent=0,n=0;tl.forEach(function(q){var c=tileCost(q);if(c<0||VG.money<c)return;var k=tk(q[0],q[1]),o=OCC[k];VG.money-=c;spent+=c;n++;
    if(TOOL==='road')VG.road[k]=1;
    else if(TOOL==='z0'){delete VG.zone[k];if(o&&o.z)VG.b.splice(VG.b.indexOf(o),1)}
    else if(TOOL==='doze'){if(ter(q[0],q[1]))VG.ter[q[1]*N+q[0]]=0;else if(isRoad(q[0],q[1]))delete VG.road[k];else if(o){VG.b.splice(VG.b.indexOf(o),1);delete VG.zone[k]}}
    else{VG.zone[k]=TOOL[1];if(o&&o.z&&o.z!==TOOL[1])VG.b.splice(VG.b.indexOf(o),1)}occMap()});
  if(n){persist();showHint(n+'칸 · 🐚'+spent+' 썼어요')}else if(tl.length)toast(VG.money<COST.zone?'조개돈이 모자라요':'여긴 안 돼요');paintHud()}
function hitB(sx,sy){var best=null,bz=-1;VG.b.forEach(function(b){var s=bSize(b),c=centerOf(b.x,b.y,s),p=w2s(c),w=s*TW*cam.z*.45,h=s*TH*cam.z*3;if(sx>p[0]-w&&sx<p[0]+w&&sy<p[1]+s*TH*cam.z*.5&&sy>p[1]-h){var F=foot(b.x,b.y,s),z=F.vX+F.vY;if(z>bz){bz=z;best=b}}});return best}
function tap(sx,sy){var tl=s2tile(sx,sy),x=tl[0],y=tl[1];
  if(TOOL&&TOOL.indexOf('p:')===0){var k=TOOL.slice(2),d=P[k],ok=freeTile(x,y);if(GHOST&&GHOST.p&&GHOST.x===x&&GHOST.y===y&&ok){if(VG.money<d.c){toast('조개돈이 모자라요');return}VG.money-=d.c;var nb={id:VG.nid++,p:k,x:x,y:y,f:0,born:t};VG.b.push(nb);occMap();puff(nb);floatTxt(nb,'-'+d.c+'🐚');persist();GHOST=null;vgTickSoft();return}
    GHOST={p:k,x:x,y:y,ok:ok&&VG.money>=d.c,tiles:[[x,y]]};if(!ok)toast(inb(x,y)&&ter(x,y)?'바위 · 해초는 불도저로 치워요':'이 칸엔 못 지어요');return}
  if(TOOL==='move'&&PICK){if(freeTile(x,y,PICK)){PICK.x=x;PICK.y=y;occMap();persist();var b0=PICK;stopTool();SEL=b0;openPanel(b0)}else toast('이 칸엔 못 옮겨요');return}
  var hb=hitB(sx,sy);if(hb){SEL=hb;openPanel(hb)}else{SEL=null;$('panel').hidden=true}}
function vgTickSoft(){linkCalc();VG.b.forEach(function(b){if(b.p)b.ok=true});fields();paintHud()}
$('bRot').addEventListener('click',function(){var c0=s2tile(cw/2,ch*.47);VG.rot=(VG.rot+1)%4;var r=rot(clamp(c0[0],0,N-1),clamp(c0[1],0,N-1)),p=iso(r[0]+.5,r[1]+.5);cam.x=p[0];cam.y=p[1];persist()});
$('bZin').addEventListener('click',function(){cam.z=clamp(cam.z*1.2,.3,2.4)});$('bZout').addEventListener('click',function(){cam.z=clamp(cam.z/1.2,.3,2.4)});
$('bSpd').addEventListener('click',function(){VG.spd=(VG.spd+1)%3;setSpeed()});
$('bView').addEventListener('click',function(){VIEW=(VIEW+1)%4;$('bView').lastChild.textContent=['보기','산소','땅값','탁함'][VIEW];$('bView').setAttribute('aria-pressed',VIEW?'true':'false');toast(['보통 화면','산소 지도 · 파랑이 산소 닿는 곳','땅값 지도 · 초록일수록 좋아요','탁한 물 지도 · 공장 근처'][VIEW])});

/* ===== 돌리기 ===== */
var last=performance.now();function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;fishStep(dt);var i;for(i=FLT.length-1;i>=0;i--){FLT[i].t+=dt;if(FLT[i].t>1.8)FLT.splice(i,1)}for(i=PUFF.length-1;i>=0;i--){PUFF[i].t+=dt;if(PUFF[i].t>.8)PUFF.splice(i,1)}try{vgDraw()}catch(e){console.error(e)}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
renderTray();setSpeed();vgTick();
if(VG.tick<3)toast('빈 바닷속 땅이에요 · 해류 입구에서 길을 내고 산소부터 놓아요');
addEventListener('visibilitychange',function(){if(document.hidden)persist()});
window.__vg={get VG(){return VG},P:P,ST:ST,cam:cam,tick:vgTick,
  road:function(x0,y0,x1,y1){for(var y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)for(var x=Math.min(x0,x1);x<=Math.max(x0,x1);x++){VG.ter[y*N+x]=0;VG.road[tk(x,y)]=1}},
  zone:function(z,x0,y0,x1,y1){for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){if(isRoad(x,y)||OCC[tk(x,y)])continue;VG.ter[y*N+x]=0;VG.zone[tk(x,y)]=z}},
  put:function(k,x,y){VG.ter[y*N+x]=0;VG.b.push({id:VG.nid++,p:k,x:x,y:y,f:0});occMap()}};
})();
</script>
