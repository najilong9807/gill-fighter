<title>물고기 마을 (시험판)</title>
<!-- 이름(11/17 늑구 '물고기밥도 물고기 입장에선 다르게'): 물고기밥 → 다시마 경단(🍡), 물고기밥 공장 → 경단 공장
     물고기 마을 3차 — 늑구 '땅이 너무 좁음 · 건물이 처음부터 완성되면 안 됨, 화이트아웃 서바이벌처럼 짓는 데 시간 · 물고기밥 만드는 공장 · 스펀지밥 느낌으로'
     · 땅 40×40, 8×8 구획으로 나눠 처음엔 6구획만 내 땅 → 옆 구획을 조개돈으로 사서 넓힘
     · 모든 건물은 공사장(비계 · 게 일꾼 · 진행 막대 · 남은 시간)부터 시작해 시간이 지나야 완성, 커질 때도 공사
     · 직접 짓는 시설은 게 일꾼 2마리가 맡음(동시에 2곳까지), 조개돈으로 바로 끝내기 가능 · 구역 건물은 주민들이 알아서 지음
     · 먹이 사슬: 다시마 농장(해초) → 물고기밥 공장(해초 → 물고기밥) → 말미잘 식당(땅값) · 물고기들이 물고기밥을 먹고, 떨어지면 배고파서 떠남
     · 도시 건설식: 구역(집 · 장터 · 공방) · 수요 · 산소(숨샘) · 땅값 · 탁한 물 · 세율/예산 · 빠르기 · 지도 보기 · 목표
     · 4차(늑구 '기존 수족관 애셋 쓰지 마 · 진짜 건물 시뮬 게임 만든다 생각 · 주체가 바닷속 · 땅이 바다 맨 밑바닥인데 배경이 바다면 이상'): 건물은 전부 코드로 그린 입체(상자 · 지붕 · 돔 · 원통 · 공 모양 + 둥근 창 · 문 · 간판), 돌리면 모양도 같이 돎. 집은 귤 · 깡통 · 조개 · 찻주전자 · 오두막 같은 물건 집. 배경은 도시 밖까지 이어지는 바닷속 모래 바닥 + 위에서 내려오는 빛 · 물결 무늬 · 가장자리 깊은 물빛. 특정 만화의 집 · 인물은 따라 그리지 않음 -->
<style>

<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d'),dpr=1,cw=0,ch=0,t=0;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function hh(n){var x=(n*2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;x=Math.imul(x,3266489917)>>>0;x^=x>>>16;return (x>>>0)/4294967296}
function mmss(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}

/* ===== 5차 — 늑구 '칸 넓게 · 땅 더 넓게 · 단계별로(시청 레벨에 따라 지을 수 있는 게 정해지게) · 자료 읽고 다시 구성 · 구도 · 그래픽'
   참고한 구조: 화이트아웃 서바이벌(용광로 레벨이 다른 건물 최대 레벨을 막고, 다음 레벨엔 특정 건물 레벨 조건 · 자원 · 점점 긴 공사 시간),
   클래시 오브 클랜(타운홀 레벨마다 건물 개수 한도 · 새 건물), 심시티 빌드잇(인구로 단계 · 재료로 집 업그레이드 · 붙은 땅만 넓히기)
   → 산호궁 Lv.1~10: 다음 레벨 조건(시설 레벨 · 물고기 수) + 조개돈 · 산호석 + 공사 시간, 레벨마다 새 시설 · 개수 한도 · 구역 건물 최대 단계 · 게 일꾼 수 · 살 수 있는 땅 수가 늘어남
   · 시설도 레벨업(산호궁 레벨까지), 레벨이 오를수록 효과 ↑ · 비용 1.6배 · 시간 1.45배
   · 새 자원 산호석(🪨): 산호 광산에서 캐서 공사 · 레벨업 · 집 단계 올리기에 씀 ===== */
var ZG={R:{n:'집',cap:[0,4,10,24]},C:{n:'장터',jobs:[0,3,8,18]},I:{n:'공방',jobs:[0,5,12,24]}};
var ZBT=[0,18,45,90],ZST=[0,0,20,60];
var P={
 hall:{n:'산호궁',s:3,ds:2,c:[0,0],bt:0,fixed:1},
 pump:{t:'base',n:'숨샘',s:1,c:[250,40],bt:15,up:8,info:'주변에 산소 · 건물이 자라려면 꼭 필요'},
 quarry:{t:'base',n:'산호 광산',s:2,ds:1,c:[150,0],bt:15,up:4,info:'산호석(🪨)을 캐요 · 공사 · 레벨업에 써요'},
 pump2:{t:'base',n:'큰 숨탑',s:2,ds:1,c:[1500,400],bt:60,up:25,info:'넓은 곳에 산소'},
 farm:{t:'food',n:'다시마 농장',s:3,c:[200,30],bt:20,up:4,info:'다시마를 키워요'},
 factory:{t:'food',n:'경단 공장',s:3,ds:2,c:[600,150],bt:45,up:10,info:'다시마 1 → 경단 2'},
 diner:{t:'food',n:'말미잘 식당',s:2,ds:1,c:[300,80],bt:25,up:5,info:'따끈한 밥 · 주변 땅값 ↑'},
 park:{t:'svc',n:'산호 정원',s:2,ds:1,c:[150,40],bt:15,up:4},
 lamp:{t:'svc',n:'해파리 가로등',s:1,gap:0,c:[70,20],bt:8,up:1},
 school:{t:'svc',n:'해마 학교',s:2,ds:1,c:[900,250],bt:50,up:12,info:'배운 물고기가 사는 동네는 땅값 ↑'},
 clinic:{t:'svc',n:'불가사리 병원',s:2,ds:1,c:[1200,300],bt:60,up:15,info:'아픈 물고기를 돌봐요 · 행복 ↑'},
 light:{t:'svc',n:'초롱아귀 등대',s:1,c:[800,200],bt:50,up:10},
 gold:{t:'svc',n:'황금 물고기상',s:1,c:[2000,600],bt:80,up:12},
 king:{t:'svc',n:'용왕상',s:2,ds:1,c:[4000,1200],bt:120,up:20},
 d1:{t:'deco',n:'분홍 산호',s:1,c:[30,5],bt:4},d2:{t:'deco',n:'주황 산호',s:1,c:[30,5],bt:4},d3:{t:'deco',n:'보라 산호',s:1,c:[40,8],bt:5},d4:{t:'deco',n:'청록 산호',s:1,c:[40,8],bt:5}
};
/* 레벨별 효과 */
function eff(b){var k=b.p,L=b.lv||1;switch(k){
 case 'pump':return {o2:4+L};case 'pump2':return {o2:9+L};
 case 'quarry':return {jobs:2+L,stone:.12*(1+.4*(L-1))};
 case 'farm':return {jobs:3+L,kelp:.35*(1+.35*(L-1))};
 case 'factory':return {jobs:5+2*L,make:.45*(1+.35*(L-1))};
 case 'diner':return {jobs:2+L,r:4,hap:6+3*L};
 case 'park':return {r:3+Math.floor(L/3),hap:8+3*L};
 case 'lamp':return {r:2,hap:4+2*L};
 case 'school':return {jobs:2+L,r:6,hap:10+3*L};case 'clinic':return {jobs:3+L,r:7,hap:12+3*L};
 case 'light':return {r:7+Math.floor(L/2),hap:8+3*L};case 'gold':return {r:6,hap:16+4*L};case 'king':return {r:8,hap:24+5*L};
 default:if(P[k]&&P[k].t==='deco')return {r:2,hap:3};return {}}}
function costOf(k,L){var c=P[k].c,m=Math.pow(1.6,L-1);return [Math.round(c[0]*m),Math.round(c[1]*m)]}
function timeOf(k,L){return Math.round(P[k].bt*Math.pow(1.45,L-1))}
/* 산호궁 레벨표: 조건 · 비용 · 시간 · 새로 열림 · 개수 한도 · 구역 최대 단계 · 게 일꾼 · 땅 구획 수 */
var HL=[null,
 {open:['road','zR','pump','quarry','farm','d1','d2'],max:{pump:1,quarry:1,farm:1},zl:1,crabs:1,land:6},
 {req:[['pump',1],['quarry',1],['pop',10]],cost:[600,150],bt:30,open:['zI','factory'],max:{pump:2,farm:2,factory:1},zl:1,crabs:1,land:8},
 {req:[['factory',1],['farm',2],['pop',35]],cost:[1500,400],bt:60,open:['zC','diner','park'],max:{diner:1,park:2,quarry:2},zl:2,crabs:2,land:10},
 {req:[['quarry',3],['park',2],['pop',70]],cost:[3000,900],bt:90,open:['lamp','school','d3'],max:{pump:3,farm:3,lamp:6,school:1},zl:2,crabs:2,land:13},
 {req:[['diner',3],['school',2],['pop',120]],cost:[5500,1600],bt:120,open:['light','pump2','clinic'],max:{light:1,pump2:1,clinic:1,factory:2,park:4},zl:2,crabs:2,land:16},
 {req:[['factory',5],['clinic',2],['pop',190]],cost:[9000,2600],bt:180,open:['gold','d4'],max:{gold:1,farm:5,quarry:3,diner:2},zl:3,crabs:3,land:20},
 {req:[['light',4],['pop',270]],cost:[14000,4000],bt:240,open:[],max:{pump2:2,school:2,clinic:2,lamp:12,pump:4},zl:3,crabs:3,land:26},
 {req:[['gold',3],['pop',360]],cost:[20000,6000],bt:300,open:['king'],max:{king:1,factory:3,park:6},zl:3,crabs:3,land:34},
 {req:[['king',2],['pop',480]],cost:[28000,8500],bt:420,open:[],max:{pump2:3,diner:3,farm:7},zl:3,crabs:4,land:46},
 {req:[['school',5],['clinic',5],['pop',620]],cost:[40000,12000],bt:600,open:[],max:{factory:4,gold:2,light:2},zl:3,crabs:4,land:64}];
function hallB(){return VG.b[0]}
function HLV(){return hallB().lv||1}
function opened(id){for(var l=1;l<=HLV();l++)if(HL[l].open.indexOf(id)>=0)return true;return false}
function openAt(id){for(var l=1;l<HL.length;l++)if(HL[l].open.indexOf(id)>=0)return l;return 99}
function limitOf(k){if(P[k].t==='deco')return 999;var m=0;for(var l=1;l<=HLV();l++)if(HL[l].max[k]!=null)m=HL[l].max[k];return m}
function countOf(k){return VG.b.filter(function(b){return b.p===k}).length}
function crabsMax(){return HL[HLV()].crabs}
function bestLv(k){var m=0;VG.b.forEach(function(b){if(b.p===k&&built(b))m=Math.max(m,b.lv||1)});return m}

var PT={},pinch=null,tapStart=null,paint=null;
function paintable(){return TOOL==='road'||(TOOL&&TOOL[0]==='z')||TOOL==='doze'}

  if(ids.length===2){var a=PT[ids[0]],b=PT[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};tapStart=null;paint=null;GHOST=null;return}

  if(paint){paint.b=s2tile(e.clientX,e.clientY);ghostPaint();return}
  if(tapStart.moved){cam.x=tapStart.cx-dx/cam.z;cam.y=tapStart.cy-dy/cam.z;clampCam()}});

function paintTiles(){var a=paint.a,b=paint.b,out=[],x,y;if(TOOL==='road'){var dx=b[0]>=a[0]?1:-1,dy=b[1]>=a[1]?1:-1;for(x=a[0];x!==b[0]+dx;x+=dx)out.push([x,a[1]]);for(y=a[1]+dy;y!==b[1]+dy;y+=dy)out.push([b[0],y])}
  else{for(y=Math.min(a[1],b[1]);y<=Math.max(a[1],b[1]);y++)for(x=Math.min(a[0],b[0]);x<=Math.max(a[0],b[0]);x++)out.push([x,y])}return out.filter(function(q){return own(q[0],q[1])})}
function tileCost(q){var k=tk(q[0],q[1]),o=OCC[k],tv=ter(q[0],q[1]);
  if(TOOL==='road')return (isRoad(q[0],q[1])||o||tv)?-1:COST.road;
  if(TOOL==='doze'){if(tv===1)return COST.rock;if(tv===2)return COST.kelp;if(isRoad(q[0],q[1]))return (q[0]===0&&q[1]===MID)?-1:COST.doze;if(o&&!o.p)return COST.doze;return -1}
  if(TOOL==='z0')return VG.zone[k]?0:-1;if(isRoad(q[0],q[1])||tv||(o&&o.p))return -1;return VG.zone[k]===TOOL[1]?-1:COST.zone}

    else if(TOOL==='z0'){delete VG.zone[k];if(o&&o.z)VG.b.splice(VG.b.indexOf(o),1)}
    else if(TOOL==='doze'){if(ter(q[0],q[1]))VG.ter[q[1]*N+q[0]]=0;else if(isRoad(q[0],q[1]))delete VG.road[k];else if(o){VG.b.splice(VG.b.indexOf(o),1);delete VG.zone[k]}}
    else{VG.zone[k]=TOOL[1];if(o&&o.z&&o.z!==TOOL[1])VG.b.splice(VG.b.indexOf(o),1)}occMap()});
