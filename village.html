<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>물고기 마을 (시험판)</title>
<!-- 1.1.30 후보 — 늑구 '도시 건설 시뮬을 수족관 안에 · 물고기 마을 만들기 · 일단 따로 html로 만들어 보고 갖다 붙이자'
     비스듬히 내려다보는(아이소메트릭) 바닷속 마을. 그림은 게임 svart/ 그림을 그대로 씀(이 파일은 저장소 맨 위, svart/ 옆에 둠).
     게임에 붙일 때: VG(상태) · vgTick(시뮬) · vgDraw(그리기)를 그대로 가져가고, 저장 키 · 진주를 게임 save로 바꾸면 됨 -->
<style>
:root{--ink:#0B2C4A;--paper:#FFF8EC;--gold:#FFD25C;--hot:#F2A52A;--red:#E5484D;--sea0:#0E4E86;--sea1:#0A2F57;--ok:#3CC17A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea1);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.pill{pointer-events:auto;background:rgba(255,248,236,.94);border-radius:999px;padding:6px 11px;font:700 14px/1.1 system-ui,sans-serif;box-shadow:0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill img{width:18px;height:18px}
.pill small{font-weight:600;opacity:.65;font-size:11px}
.dem{display:flex;gap:4px;align-items:flex-end;height:18px}
.dem i{display:block;width:7px;border-radius:2px;background:#9fb3c6}
.side{position:fixed;right:10px;top:calc(56px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.rb{width:46px;height:46px;border:0;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.25);font:700 20px system-ui;color:var(--ink)}
.rb small{display:block;font-size:9px;font-weight:700;margin-top:-2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(10,40,72,0),rgba(10,40,72,.85) 30%);}
.tabs{display:flex;gap:4px;background:rgba(20,44,70,.9);border-radius:14px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;border:0;border-radius:10px;padding:7px 2px;font:700 13px system-ui;color:#DCE8F2;background:transparent}
.tabs button[aria-pressed=true]{background:var(--gold);color:#3A2400}
.tray{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;touch-action:pan-x}
.tray::-webkit-scrollbar{display:none}
.card{flex:none;width:76px;border:0;border-radius:14px;background:var(--paper);box-shadow:0 2px 0 #9fb4c8;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font:700 11px system-ui;color:var(--ink);position:relative}
.card img{width:52px;height:46px;object-fit:contain}
.card b{font-size:11px;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:10.5px;display:flex;align-items:center;gap:2px}
.card span img{width:12px;height:12px}
.card[data-on="1"]{outline:3px solid var(--hot);background:#FFF1C9}
.card[data-poor="1"]{opacity:.5}
.card[data-lock="1"]{opacity:.45}
.card .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(255,248,236,.6);border-radius:14px;text-align:center;padding:4px}
.panel{position:fixed;left:10px;right:10px;bottom:calc(172px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 rgba(0,0,0,.25);font:14px/1.45 system-ui}
.panel h2{margin:0 0 4px;font-size:17px}
.panel .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.panel button{flex:1;border:0;border-radius:12px;padding:9px 6px;font:700 13px system-ui;background:#E8F1F8;color:var(--ink)}
.panel button.hot{background:linear-gradient(180deg,#FFE27A,#F2A52A);color:#3A2400}
.panel button.no{background:#FFE1E1;color:#8A1E22}
.meter{height:8px;border-radius:5px;background:#dfe7ee;overflow:hidden;margin:3px 0}
.meter i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(11,44,74,.92);color:#fff;padding:9px 14px;border-radius:14px;font:700 13.5px system-ui;max-width:86vw;text-align:center;pointer-events:none;transition:opacity .3s}
.hint{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(255,248,236,.95);padding:7px 12px;border-radius:12px;font:700 13px system-ui;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.hint button{margin-left:8px;border:0;border-radius:9px;padding:4px 9px;font:700 12px system-ui;background:var(--red);color:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="pill" id="hPearl"><img src="svart/pearl.webp" alt="">0</div>
  <div class="pill" id="hPop">🐟 0</div>
  <div class="pill" id="hHap">😊 0</div>
  <div class="pill" id="hDay">1일</div>
  <div class="pill" title="수요: 집 · 일터 · 가게"><div class="dem" id="hDem"><i></i><i></i><i></i></div><small>집 일 가</small></div>
</div>
<div class="side">
  <button class="rb" id="bRot" aria-label="화면 돌리기">⟳<small>돌리기</small></button>
  <button class="rb" id="bZin" aria-label="크게">＋</button>
  <button class="rb" id="bZout" aria-label="작게">－</button>
  <button class="rb" id="bDel" aria-label="부수기">🧹<small>부수기</small></button>
</div>
<div class="hint" id="hint" hidden><span></span><button type="button" id="hintX">그만</button></div>
<div class="panel" id="panel" hidden></div>
<div class="bar">
  <div class="tabs" id="tabs">
    <button data-t="road">길</button><button data-t="home">집</button><button data-t="work">일터</button><button data-t="shop">가게</button><button data-t="svc">편의</button><button data-t="deco">꾸미기</button>
  </div>
  <div class="tray" id="tray"></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d'),dpr=1,cw=0,ch=0,t=0;
var ART={};function art(k){var o=ART[k];if(!o){o=ART[k]=new Image();o.decoding='async';o.src='svart/'+k+'.webp'}return o.complete&&o.naturalWidth?o:null}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function hh(n){var x=(n*2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;x=Math.imul(x,3266489917)>>>0;x^=x>>>16;return (x>>>0)/4294967296}

/* ===== 건물 목록 =====
   k 그림 · s 크기(칸) · c 진주 · cap 사는 물고기 · jobs 일자리 · pearl 일꾼 1마리당 진주/초 · food 먹이(물고기 수) · r 편의 반경 · hap 행복 · tax 가게(세금 +%) · need 열리는 인구 */
var B={
 road:{t:'road',n:'해초 길',c:5,s:1},
 hall:{t:'hall',n:'마을 회관',k:'house4',s:2,c:0,jobs:4,fixed:1,sc:1.2},
 h1:{t:'home',n:'소라 집',k:'house1',s:1,c:60,cap:4,sc:1.05},
 h2:{t:'home',n:'귤 집',k:'dc_orangehouse',s:1,c:80,cap:5},
 h3:{t:'home',n:'딸기 집',k:'dc_berryhouse',s:1,c:90,cap:5},
 h4:{t:'home',n:'수박 집',k:'dc_melonhouse',s:1,c:110,cap:6},
 h5:{t:'home',n:'산호 집',k:'house2',s:1,c:140,cap:7,sc:1.05,need:20},
 h6:{t:'home',n:'통나무 집',k:'dc_cottage',s:1,c:160,cap:8,need:30},
 h7:{t:'home',n:'이끼 탑',k:'house3',s:1,c:260,cap:12,sc:1.05,need:50},
 h8:{t:'home',n:'산호 궁전',k:'house5',s:2,c:900,cap:40,sc:1.15,need:90},
 w1:{t:'work',n:'진주 조개밭',k:'dc_clam',s:1,c:120,jobs:4,pearl:.05},
 w2:{t:'work',n:'진주 양식장',k:'dc_pearlclam',s:1,c:220,jobs:6,pearl:.065,need:25},
 w3:{t:'work',n:'말미잘 농장',k:'dc_anemgarden',s:1,c:90,jobs:3,food:14},
 w4:{t:'work',n:'마리모 밭',k:'dc_marimo',s:1,c:70,jobs:2,food:9},
 s1:{t:'shop',n:'보물 상점',k:'dc_chest',s:1,c:180,jobs:4,tax:.12},
 s2:{t:'shop',n:'항아리 가게',k:'dc_amphora',s:1,c:130,jobs:3,tax:.08},
 v1:{t:'svc',n:'산호 아치 공원',k:'dc_coralarch',s:1,c:120,r:3,hap:14},
 v2:{t:'svc',n:'빛버섯 가로등',k:'dc_mushroom',s:1,c:80,r:2,hap:8},
 v3:{t:'svc',n:'거품 샘',k:'dc_bubbler',s:1,c:100,r:3,hap:10},
 v4:{t:'svc',n:'등대',k:'dc_lighthouse',s:1,c:200,r:5,hap:10,need:15},
 v5:{t:'svc',n:'황금 물고기상',k:'dc_goldstatue',s:1,c:320,r:4,hap:18,need:35},
 v6:{t:'svc',n:'용왕 동상',k:'dc_dragonking',s:1,c:500,r:5,hap:24,need:60},
 d1:{t:'deco',n:'분재 산호',k:'dc_bonsai',s:1,c:40,deco:3},
 d2:{t:'deco',n:'수정',k:'dc_crystal',s:1,c:50,deco:3},
 d3:{t:'deco',n:'부채 산호',k:'dc_seafan',s:1,c:30,deco:2},
 d4:{t:'deco',n:'탁자 산호',k:'dc_tablecoral',s:1,c:30,deco:2},
 d5:{t:'deco',n:'뇌 산호',k:'dc_braincoral',s:1,c:25,deco:2},
 d6:{t:'deco',n:'바위 정원',k:'dc_iwagumi',s:1,c:45,deco:3}
};
var TABS=['road','home','work','shop','svc','deco'];

/* ===== 상태 ===== */
var N=16,KEY='fishvillage.v1';
var VG=null;
function fresh(){var g={v:1,pearls:900,day:1,tick:0,pop:0,rot:0,b:[],road:{},nid:1};
  var c=Math.floor(N/2)-1;g.b.push({id:g.nid++,k:'hall',x:c,y:c,f:0,occ:0,st:0});
  for(var i=2;i<N-2;i++){g.road[i+','+(c+2)]=1}for(i=c+3;i<N-3;i++)g.road[(c+2)+','+i]=1;return g}
function load(){try{var s=localStorage.getItem(KEY);if(s){var g=JSON.parse(s);if(g&&g.v===1)return g}}catch(e){}return fresh()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(VG))}catch(e){}}
VG=load();

/* ===== 칸 ===== */
function occMap(){var m={};VG.b.forEach(function(b){var s=B[b.k].s;for(var i=0;i<s;i++)for(var j=0;j<s;j++)m[(b.x+i)+','+(b.y+j)]=b});return m}
var OCC=occMap();
function isRoad(x,y){return !!VG.road[x+','+y]}
function free(x,y,s,ign){for(var i=0;i<s;i++)for(var j=0;j<s;j++){var X=x+i,Y=y+j;if(X<0||Y<0||X>=N||Y>=N)return false;var o=OCC[X+','+Y];if((o&&o!==ign)||isRoad(X,Y))return false}return true}
function nearRoad(b){var s=B[b.k].s,i;for(i=0;i<s;i++){if(isRoad(b.x+i,b.y-1)||isRoad(b.x+i,b.y+s)||isRoad(b.x-1,b.y+i)||isRoad(b.x+s,b.y+i))return true}return false}
function dist(a,b){var sa=B[a.k].s,sb=B[b.k].s;var ax=a.x+sa/2,ay=a.y+sa/2,bx=b.x+sb/2,by=b.y+sb/2;return Math.max(Math.abs(ax-bx),Math.abs(ay-by))-(sa+sb)/4}

/* ===== 시뮬레이션: 1초마다 · 20초 = 하루 ===== */
var ST={pop:0,cap:0,jobs:0,emp:0,food:0,hap:0,taxRate:0,dem:[0,0,0],income:0};
function vgTick(){var bs=VG.b,i,j;bs.forEach(function(b){b.on=nearRoad(b)});
  var homes=bs.filter(function(b){return B[b.k].t==='home'}),svcs=bs.filter(function(b){return B[b.k].t==='svc'&&b.on}),decos=bs.filter(function(b){return B[b.k].t==='deco'}),works=bs.filter(function(b){var d=B[b.k];return d.jobs&&b.on});
  var pop=0,cap=0,jobs=0,food=0,foodCap=0,taxR=0;homes.forEach(function(b){pop+=b.occ|0;if(b.on)cap+=B[b.k].cap});works.forEach(function(b){jobs+=B[b.k].jobs});
  var emp=Math.min(pop,jobs),wr=jobs?emp/jobs:0;
  works.forEach(function(b){var d=B[b.k];b.wk=Math.round(d.jobs*wr*10)/10;if(d.food)foodCap+=d.food*(b.wk/d.jobs);if(d.tax)taxR+=d.tax*(b.wk/d.jobs);
    if(d.pearl){b.st=Math.min(60,(b.st||0)+d.pearl*b.wk)}});
  var fed=pop<=foodCap+6,unemp=pop?1-emp/pop:0,hsum=0;
  homes.forEach(function(b){var h=50;if(!b.on)h=5;else{svcs.forEach(function(s){var d=B[s.k];if(dist(b,s)<=d.r)h+=d.hap});var dv=0;decos.forEach(function(s){if(dist(b,s)<=2)dv+=B[s.k].deco});h+=Math.min(12,dv);
      h+=fed?8:-22;h+=unemp>.4?-12:unemp>.2?-4:6;var nw=works.some(function(w){return dist(b,w)<=6});if(!nw)h-=10}
    b.hap=clamp(Math.round(h),0,100);var d=B[b.k],tgt=b.on?Math.round(d.cap*clamp(b.hap/70,0,1)):0;
    if((b.occ|0)<tgt&&VG.tick%2===0){b.occ=(b.occ|0)+1;spawnFish(b)}else if((b.occ|0)>tgt&&VG.tick%3===0)b.occ--;hsum+=b.hap*(b.occ|0)});
  ST.pop=pop;ST.cap=cap;ST.jobs=jobs;ST.emp=emp;ST.food=Math.round(foodCap);ST.fed=fed;ST.hap=pop?Math.round(hsum/pop):0;ST.taxRate=taxR;
  ST.dem=[clamp((jobs-pop+4)/12,0,1),clamp((pop-jobs+2)/12,0,1),clamp((pop/25)-taxR*4,0,1)];
  VG.tick++;if(VG.tick%20===0){VG.day++;var tax=Math.round(pop*.6*(1+taxR)*(.6+ST.hap/250));if(tax>0){VG.pearls+=tax;var hb=bs[0];floatTxt(hb,'세금 +'+tax)}if(VG.day%3===0)persist()}
  VG.pop=pop;paintHud()}
setInterval(function(){try{vgTick()}catch(e){console.error(e)}},1000);

/* ===== 화면 좌표 (돌리기 0~3) ===== */
var TW=64,TH=32,cam={x:0,y:0,z:1},GHOST=null,MODE='view',SEL=null,PICK=null,DRAG=null;
function rot(x,y){var r=VG.rot;return r===0?[x,y]:r===1?[N-1-y,x]:r===2?[N-1-x,N-1-y]:[y,N-1-x]}
function unrot(x,y){var r=VG.rot;return r===0?[x,y]:r===1?[y,N-1-x]:r===2?[N-1-x,N-1-y]:[N-1-y,x]}
function iso(vx,vy){return [(vx-vy)*TW/2,(vx+vy)*TH/2]}
function w2s(p){return [(p[0]-cam.x)*cam.z+cw/2,(p[1]-cam.y)*cam.z+ch*.46]}
function s2tile(sx,sy){var wx=(sx-cw/2)/cam.z+cam.x,wy=(sy-ch*.46)/cam.z+cam.y,vx=(wx/(TW/2)+wy/(TH/2))/2,vy=(wy/(TH/2)-wx/(TW/2))/2;var u=unrot(Math.floor(vx),Math.floor(vy));return u}
function foot(x,y,s){var c=[];for(var i=0;i<s;i++)for(var j=0;j<s;j++)c.push(rot(x+i,y+j));var mx=1e9,my=1e9,Mx=-1e9,My=-1e9;c.forEach(function(p){mx=Math.min(mx,p[0]);my=Math.min(my,p[1]);Mx=Math.max(Mx,p[0]);My=Math.max(My,p[1])});return {vx:mx,vy:my,vX:Mx,vY:My}}
function centerOf(x,y,s){var F=foot(x,y,s),a=iso(F.vx,F.vy+s),b=iso(F.vx+s,F.vy);return [(a[0]+b[0])/2,(a[1]+b[1])/2]}

/* ===== 그리기 ===== */
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);cw=innerWidth;ch=innerHeight;cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);if(!cam.inited){cam.inited=1;var c=iso(N/2,N/2);cam.x=c[0];cam.y=c[1];cam.z=clamp(Math.min(cw/(N*TW)*1.12,ch*.6/(N*TH)),.3,2.2)}}
addEventListener('resize',resize);resize();
function diamond(vx,vy,w,h){var a=iso(vx,vy),b=iso(vx+w,vy),c=iso(vx+w,vy+h),d=iso(vx,vy+h);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath()}
var GLOW={};function glow(rgb){var g=GLOW[rgb];if(g)return g;g=document.createElement('canvas');g.width=g.height=64;var x=g.getContext('2d'),rg=x.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,'rgba('+rgb+',1)');rg.addColorStop(1,'rgba('+rgb+',0)');x.fillStyle=rg;x.fillRect(0,0,64,64);GLOW[rgb]=g;return g}
function vgDraw(){ctx.setTransform(dpr,0,0,dpr,0,0);
  var g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#1A6FAE');g.addColorStop(.5,'#0E4E86');g.addColorStop(1,'#08284A');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
  ctx.save();ctx.globalCompositeOperation='lighter';for(var i=0;i<5;i++){var a=-.25+i*.14+Math.sin(t*.2+i)*.03,x0=cw*(.15+.18*i);var lg=ctx.createLinearGradient(x0,0,x0-Math.sin(a)*ch,ch);lg.addColorStop(0,'rgba(170,220,255,.10)');lg.addColorStop(1,'rgba(170,220,255,0)');ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(x0-20,0);ctx.lineTo(x0+30,0);ctx.lineTo(x0-Math.sin(a)*ch+90,ch);ctx.lineTo(x0-Math.sin(a)*ch-60,ch);ctx.fill()}ctx.restore();
  ctx.save();ctx.translate(cw/2,ch*.46);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
  /* 바닥 두께 */
  var L=iso(0,N),R=iso(N,0),Bt=iso(N,N),dep=TH*1.1;ctx.beginPath();ctx.moveTo(L[0],L[1]);ctx.lineTo(Bt[0],Bt[1]);ctx.lineTo(R[0],R[1]);ctx.lineTo(R[0],R[1]+dep);ctx.lineTo(Bt[0],Bt[1]+dep);ctx.lineTo(L[0],L[1]+dep);ctx.closePath();ctx.fillStyle='#8C6A3E';ctx.fill();
  ctx.beginPath();ctx.moveTo(Bt[0],Bt[1]);ctx.lineTo(R[0],R[1]);ctx.lineTo(R[0],R[1]+dep);ctx.lineTo(Bt[0],Bt[1]+dep);ctx.closePath();ctx.fillStyle='#6E5230';ctx.fill();
  /* 모래 칸 */
  for(var vy=0;vy<N;vy++)for(var vx=0;vx<N;vx++){var u=unrot(vx,vy),hv=hh(u[0]*31+u[1]*7);diamond(vx,vy,1,1);ctx.fillStyle=hv<.33?'#EBD3A0':hv<.66?'#E6CC97':'#EFD9A9';ctx.fill();ctx.strokeStyle='rgba(140,105,60,.13)';ctx.lineWidth=1;ctx.stroke();
    if(hv>.93){var c0=iso(vx+.5,vy+.5);ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(c0[0]+6,c0[1],3,1.6,0,0,7);ctx.fill()}}
  /* 편의 반경 보이기 */
