v.15에 한 칸씩 늘어요.":"<b>⚖ Town Policies<\/b> (☰ Menu) unlock at Coral Hall Lv.6. Each policy has a benefit and a cost. You get one more slot at Lv.10 and Lv.15.","<b>⚠ 마을 사건<\/b>: 산호궁 Lv.6부터 가끔 상어 · 뜨거운 물 · 감기 · 적조가 생겨요. 🚒 소방서 · 👮 순찰대 · 🏥 병원 범위 안이면 저절로 막고, 못 막으면 건물을 눌러 해결하거나 2시간 기다려요.":"<b>⚠ Town incidents<\/b>: from Coral Hall Lv.6, sharks, hot water vents, colds and red tides sometimes happen. Inside the range of a 🚒 Fire Station, 👮 Patrol or 🏥 Clinic they are stopped automatically; otherwise tap the building to fix it or wait 2 hours.","숨샘":"Breath Spring","큰 숨탑":"Big Breath Tower","<b>💨 숨샘 · 큰 숨탑<\/b>(⚙ 기반)은 여러 개 지을 수 있어요. 산소 펌프만으로 모자란 곳에 놓아 구역이 자라는 범위를 넓혀요.":"<b>💨 Breath Springs · Big Breath Towers<\/b> (⚙ Utilities) can be built as many times as you like. Place them where the Oxygen Pump does not reach to widen the area where zones can grow.","우리 집 앞에 상어가 왔어요! 무서워서 못 들어가요":"A shark is right outside my home! I’m too scared to go in","콜록… 우리 동네에 감기가 돌아요":"Cough… a cold is going around my neighborhood","바닥에서 뜨거운 물이 나와요!":"Hot water is coming out of the floor!","붉은 물 때문에 숨쉬기 힘들어요":"The red water makes it hard to breathe","물이 너무 탁해서 아가미가 따끔해요… 물 거르개가 있으면 좋겠어요":"The water is so murky my gills sting… I wish we had a water filter","요즘 물이 좀 뿌옇네요":"The water’s been a bit cloudy lately","배고파요… 장터에 경단이 없대요":"I’m hungry… they say the shops are out of dumplings","옷이 다 해졌어요. 새 옷 사고 싶어요":"My clothes are worn out. I want new ones","친구들이 이사 오고 싶어 하는데 마을이 꽉 찼대요":"My friends want to move here, but they say the town is full","장 볼 가게가 모자라요. 줄이 너무 길어요":"There aren’t enough shops. The lines are so long","일자리는 많은데 살 집이 모자라요":"Plenty of jobs, but not enough homes","바다 축제의 밤 최고! 매일 했으면 좋겠어요":"Sea Festival Nights are the best! I wish it was every day","아침 일찍 나오니까 졸려요… 하암":"Coming out so early makes me sleepy… yawn","게 일꾼들이 밤새 망치질해요. 쿵쿵!":"The crab workers hammer all night. Bang bang!","밤에도 길이 환해서 좋아요":"I love how bright the streets are at night","우리 동네 땅값이 많이 올랐대요!":"They say land value in my neighborhood went way up!","아가미시티에 살아서 행복해요!":"I’m so happy to live in Gill City!","요즘 마을 분위기가 좀 가라앉았어요":"The town feels a bit down lately","수족관이 생기면 구경 가고 싶어요":"I’d love to visit an aquarium if we get one","오늘도 열심히 헤엄쳐요!":"Swimming hard again today!","산호궁이 정말 멋져요":"The Coral Hall is so pretty","거북 택배가 언제 오려나":"I wonder when the turtle delivery comes","다시마 냄새가 좋아요":"I love the smell of kelp","주말엔 친구랑 산책할 거예요":"I’m going for a swim with friends this weekend","🏠 집:":"🏠 Home:","💼 일터:":"💼 Work:","기분:":"Mood:","😄 아주 좋아요":"😄 Great","🙂 좋아요":"🙂 Good","😐 그저 그래요":"😐 So-so","😟 안 좋아요":"😟 Not good","🏠 집 보기":"🏠 See home","💼 일터 보기":"💼 See workplace","<b>🐟 주민<\/b>을 누르면 이름 · 집 · 일터 · 기분과 한마디를 들을 수 있어요. 마을에 무엇이 모자란지 주민 말로 알 수 있어요.":"Tap a <b>🐟 resident<\/b> to see their name, home, workplace and mood, and hear what they have to say. Their words tell you what the town is missing.","⬆ 길 넓히기":"⬆ Widen roads","길 넓히기":"Widen roads","교통":"Traffic","자갈길":"Gravel road","산호 대로":"Coral avenue","해류 버스 정류장":"Current Bus Stop","한산":"Clear","붐빔":"Busy","막힘":"Jammed","끌어서 길을 넓혀요 · 자갈길 40🫧 🪨20 · 산호 대로 120🫧 🪨60 · 이동은 두 손가락":"Drag to widen roads · Gravel 40🫧 🪨20 · Coral avenue 120🫧 🪨60 · move with two fingers","막힌 길을 자갈길 · 산호 대로로":"Turn jammed roads into gravel or coral avenues","<i style=\"background:#46c86e\"><\/i> 한산 <i style=\"background:#ffc83c\"><\/i> 붐빔 <i style=\"background:#eb463c\"><\/i> 막힘 · ⬆ 길 넓히기 · 🚌 버스 정류장으로 풀어요":"<i style=\"background:#46c86e\"><\/i> Clear <i style=\"background:#ffc83c\"><\/i> Busy <i style=\"background:#eb463c\"><\/i> Jammed · fix with ⬆ Widen roads · 🚌 Bus stops","<b>🚦 교통<\/b>: 집 · 가게 · 공방 · 일터가 몰린 길은 막혀요. 막힌 길 옆은 생산 · 입주 · 행복이 줄고, 구역 4단계부터는 길이 안 막혀야 자라요. 🛣 도로 탭 <b>⬆ 길 넓히기<\/b>로 자갈길(Lv.5) · 산호 대로(Lv.12)를 깔거나, ⚙ 기반의 <b>🚌 해류 버스 정류장<\/b>을 놓아요. 🗺 지도 → 교통으로 확인해요.":"<b>🚦 Traffic<\/b>: roads crowded with homes, shops, workshops and workplaces get jammed. Next to a jammed road, production, move-ins and happiness drop, and zones need unjammed roads to reach Lv.4+. Use <b>⬆ Widen roads<\/b> in the 🛣 Roads tab for gravel roads (Lv.5) and coral avenues (Lv.12), or place <b>🚌 Current Bus Stops<\/b> from ⚙ Utilities. Check it on 🗺 Map → Traffic.","해류 열차 정거장":"Current Tram Stop","선로 위에는 못 지어요":"Can't build on rails","선로 옆에 지어야 해요 · 🛣 도로 탭 「🚋 선로 놓기」":"Must be next to rails · 🛣 Roads tab → “🚋 Lay rails”","🚋 선로 놓기":"🚋 Lay rails","건물이 있는 칸이에요":"There's a building there","🚋 해류 열차역을 먼저 지어요":"Build the 🚋 Current Train Station first","🛣 길 자동 연결 켜짐":"🛣 Auto-connect roads on","🛣 길 자동 연결":"🛣 Auto-connect roads","꺼짐 · 길은 직접 깔아요":"Off · lay roads yourself","켜짐 · 길에 안 닿은 칸까지 길을 깔아요":"On · adds roads to reach every zone tile","진주가 모자라 길을 다 잇지 못했어요":"Not enough pearls to connect every road","✅ 이어졌어요":"✅ Connected","⚠ 아직 안 이어졌어요 · 🚋 선로로 다른 정거장까지 이어요":"⚠ Not connected yet · lay 🚋 rails to another stop","<i style=\"background:#9664e6\"><\/i> 선로":"<i style=\"background:#9664e6\"><\/i> Rails","<b>🚋 열차 · 탈것<\/b>: 길 위로 🚌 버스 · 🐢 택배 거북 · 🦀 게 수레가 다니고, 막힌 길에선 💢 하며 느려져요. 산호궁 Lv.9에 해류 열차역을 지으면 🛣 도로 탭 <b>🚋 선로 놓기<\/b>로 선로를 깔 수 있어요. ⚙ 기반의 <b>🚉 해류 열차 정거장<\/b>을 선로 옆에 놓고 다른 정거장(또는 열차역)과 이으면 트램이 오가고 둘레 5칸 길이 덜 막혀요.":"<b>🚋 Trams & vehicles<\/b>: 🚌 buses, 🐢 parcel turtles and 🦀 crab carts drive on your roads and slow down with 💢 on jammed roads. Once you build the Current Train Station (Coral Hall Lv.9), use <b>🚋 Lay rails<\/b> in the 🛣 Roads tab. Put a <b>🚉 Current Tram Stop<\/b> (⚙ Utilities) next to the rails and connect it to another stop (or the station): trams run and roads within 5 tiles jam less.","<b>🛣 길 자동 연결<\/b>: 구역을 칠하고 손을 떼면 길에 안 닿은 칸까지 길을 깔아 줘요(한 칸 10🫧). 🏘 구역 탭에서 끌 수 있어요.":"<b>🛣 Auto-connect roads<\/b>: when you lift your finger after painting zones, roads are added so every zone tile touches one (10🫧 per tile). Turn it off in the 🏘 Zones tab.","세율":"Taxes","올리면 진주가 더 들어오지만 그 구역 수요가 줄고(이사 · 가게 · 공방이 덜 생김) 행복이 내려가요 · 기본 9%":"Higher taxes bring more pearls but lower that zone's demand (fewer move-ins, shops and workshops) and happiness · default 9%","수요 그대로":"Demand unchanged","물건값 ↑":"Prices ↑","<b>💰 세율<\/b>(☰ 메뉴): 산호궁 Lv.4부터 주거 · 상업 · 산업 세율을 0~20%로 정해요. 올리면 진주가 더 들어오지만 그 구역 수요가 줄고, 주거 · 상업 세금이 높으면 행복도 내려가요. 내리면 이사 오고 가게 · 공방이 잘 생겨요.":"<b>💰 Taxes<\/b> (☰ Menu): from Coral Hall Lv.4, set Residential, Commercial and Industrial taxes from 0 to 20%. Higher taxes bring more pearls but lower that zone's demand, and high residential or commercial taxes also lower happiness. Lower taxes bring move-ins and more shops and workshops.","오늘의 마을 일":"Today's Town Tasks","오늘의 일 3개 모두 끝내기":"Finish all 3 of today's tasks","광장":"Plaza","축제 · 기념물":"Festival · Monuments","축제 중":"Festival on","축제 중이에요":"Festival in progress","축제의 날":"Festival Day","축제의 날 열기":"Start Festival Day","축제의 날! 1시간 동안 세금 2배 · 생산 1.5배":"Festival Day! Taxes ×2 · production ×1.5 for 1 hour","하루 한 번 · 1시간 동안 세금 2배 · 생산 1.5배 · 축제 방울 +15":"Once a day · taxes ×2 and production ×1.5 for 1 hour · festival tokens +15","오늘은 이미 열었어요 · 내일 또 열 수 있어요":"Already held today · you can hold it again tomorrow","산호 등대":"Coral Lighthouse","고래 뼈 아치":"Whale Bone Arch","용궁 시계탑":"Dragon Palace Clock Tower","다 지었어요 ✨":"Complete ✨","다음 단계:":"Next stage:","👆 여기를 누르면 다시마 농장 → 경단 공장을 바로 지어요":"👆 Tap here to build a Kelp Farm → Dumpling Factory right away","👆 여기를 누르면 배달소를 바로 짓고, 다 지으면 주문판을 열어요":"👆 Tap here to build the delivery post now, then open the order board when it is done","👆 여기를 누르면 바로 지어요":"👆 Tap here to build it right away","끌면 화면 이동":"drag to move the view","물고기가 살 <b>🏠 집 지을 땅<\/b>을 정해요":"Mark <b>🏠 land for homes<\/b> where fish can live","👆 여기를 누르면 도로 옆 4칸을 바로 정해요 · 집은 물고기가 지어요":"👆 Tap here to mark 4 tiles by the road · the fish build the homes","도로 옆 빈 땅이 없어요 · 직접 지정해 봐요":"No free land by the road · try marking it yourself","다 지어지면 다음 할 일을 알려 드릴게요":"I'll tell you the next task when it's done","👆 여기를 누르면 산호궁 창을 열어요":"👆 Tap here to open the Coral Hall","👆 누르면 집 지을 땅을 더 정해요 · 산소 · 경단이 있어야 와요":"👆 Tap to mark more land for homes · fish need oxygen and dumplings","👆 여기를 누르면 그 건물 창을 열어요":"👆 Tap here to open that building","도미 비서 · 다음 할 일":"Secretary Bream · Next task","이웃 바다 마을이 모자란 물건을 주문했어요 · 거북이 실어다 주면 물건값으로 진주를 받아요":"Neighboring sea towns ordered goods they lack · deliver by turtle and they pay you in Pearls","이웃 바다 마을에 물건을 팔아 진주를 벌어요":"Sell goods to neighboring sea towns for Pearls","거북 배달소를 지으면 이웃 바다 마을에서 물건 주문이 들어와요. 거북이 실어다 주면 물건값으로 진주를 받아요 · 🏛 산호궁 Lv.3에 열려요":"Build a Turtle Post and neighboring sea towns will order goods. Deliver by turtle and they pay you in Pearls · unlocks at 🏛 Coral Hall Lv.3","이웃 바다 마을들은 산호석 · 다시마 · 경단 · 옷이 늘 모자라요. 주문판에 필요한 물건이 올라오면 창고에서 꺼내 거북이 실어다 주고, 물건값으로 진주를 받아요(바닷속에선 진주가 돈이에요). 세금과 함께 마을의 두 가지 수입이라, 우리 마을이 만든 재료를 진주로 바꾸는 곳이에요.":"Neighboring sea towns are always short of coral stone, kelp, dumplings and clothes. When an order appears, the turtle carries it from your storage and they pay in Pearls (Pearls are money under the sea). Together with taxes it is one of the town's two incomes — the place that turns what your town makes into Pearls.","<b>구역 = 물고기가 직접 짓는 땅<\/b>이에요. 🏠 주거엔 집, 🛍 상업엔 가게, 🔧 산업엔 공방이 생겨요. 도로 옆 칸을 손가락으로 쭉 끌면 끝 · 산소가 닿아야 지어요 · 한 칸 5🫧":"<b>Zones = land the fish build on themselves<\/b>. 🏠 Residential gets homes, 🛍 Commercial gets shops, 🔧 Industrial gets workshops. Just drag along the road · they need oxygen · 5🫧 a tile","<small>도미 비서 · 다음 할 일<\/small>":"<small>Secretary Bream · Next task<\/small>","진주(바닷속 돈)로 게 일꾼에게 공사를 맡기고, 도로 옆에 집 지을 땅을 정해 주면 떠돌던 물고기들이 이사 와요. 마을 입구를 지난 물고기는 다리가 쑥 자라 주민이 돼요.":"Pay crab builders in Pearls (the sea's money) and mark land for homes by the road, and wandering fish will move in. Fish that pass the town gate sprout legs and become residents.","주민들은 광산 · 농장 · 공장에서 일해 재료를 만들어요. 건물 머리 위 동그란 말풍선(🪨 🌿 🫧)을 눌러 창고로 모으고, 그 재료로 건물을 올리거나 이웃 바다 마을에 팔아 진주를 벌어요.":"Residents work in quarries, farms and factories to make materials. Tap the round bubbles (🪨 🌿 🫧) above buildings to collect them into storage, then use them to upgrade buildings or sell them to neighboring sea towns for Pearls.","<b>🫧 진주<\/b>는 바닷속의 돈이에요. 아가미 파이터와 같은 지갑이라, 바다에서 모은 진주를 마을에서도 써요. 짓기에 드는 진주는 게 일꾼 품삯과 재료값이에요. <b>💎 보석<\/b>으로는 공사를 바로 끝내요(5분 이하는 무료).":"<b>🫧 Pearls<\/b> are the sea's money. They share Gill Fighter's wallet, so Pearls you collect out at sea work in town too. Building costs pay the crab builders and their supplies. <b>💎 Gems<\/b> finish construction instantly (free under 5 min).","<b>🔁 마을이 도는 순서<\/b>: 주민이 광산 · 농장 · 공장에서 일해 물건을 만들어요 → 창고에 모여요 → 🍡 경단 · 👕 옷은 상점으로 가서 주민이 사 먹고 입어요(그래야 행복해져 주택이 자라요) → 주민은 일해서 번 진주로 장을 보고 세금을 내요 → 남는 물건은 거북이 이웃 마을에 팔아 진주로 바꿔요.":"<b>🔁 How the town runs<\/b>: residents work in quarries, farms and factories to make goods → goods gather in storage → 🍡 dumplings and 👕 clothes go to shops where residents buy them (that makes them happy and homes grow) → residents shop and pay taxes with Pearls earned at work → spare goods are sold to neighboring towns by turtle for Pearls.","<b>🧾 세금<\/b>은 주민이 일해서 번 진주 중 일부를 마을에 내는 거예요. 상점에서 장을 본 인구 × 행복만큼 🏛 산호궁에 쌓여요(8시간치까지). 산호궁 위 🫧 말풍선을 눌러 걷어요.":"<b>🧾 Taxes<\/b> are part of the Pearls residents earn at work. They pile up at the 🏛 Coral Hall based on shoppers × happiness (up to 8 hours). Tap the 🫧 bubble above the Hall to collect.","<b>🐢 주문<\/b>은 이웃 바다 마을이 모자란 물건을 사겠다는 거예요. 우리 마을 광산 · 농장 · 공장이 만들어 창고에 모아 둔 물건을 거북이 실어다 주면 물건값으로 진주 · 명성을 받아요. 세금과 함께 마을의 두 가지 수입이에요. 명성 레벨마다 💎 선물이 있어요.":"<b>🐢 Orders<\/b> are neighboring sea towns asking to buy what they lack. The turtle carries goods your quarries, farms and factories made and stored, and they pay you in Pearls and fame. Together with taxes it is the town's two incomes. Each fame level gives a 💎 gift.","<b>📜 의뢰<\/b>는 주민 대표들이 촌장님께 부탁하는 일이에요. 산호궁 Lv.5부터 매주 월요일에 3개씩 와요. 하나에 🫧 진주, 셋 다 하면 💎 보석도 받아요.":"<b>📜 Requests<\/b> are tasks the residents' council asks of you, the mayor. From Coral Hall Lv.5, 3 arrive every Monday. Each gives 🫧 Pearls, and all three give 💎 Gems too.","<b>📦 재료 상자<\/b>는 내 물고기가 아가미 파이터에서 바다를 헤엄치다 주운 재료를 마을로 보내는 거예요. 20초 넘게 한 판 할 때마다 1개씩(하루 6개) 와요. <b>🐠 내 물고기<\/b>는 가끔 마을에 놀러 오고, 쓰다듬으면 수족관 친밀도가 올라요.":"<b>📦 Supply crates<\/b> hold materials your fish picks up while swimming in Gill Fighter and sends home — one for every run longer than 20 seconds (up to 6 a day). <b>🐠 Your fish<\/b> sometimes visit town — pet them to raise their aquarium friendship.","<b>🐠 수족관 공방<\/b>(📦 창고 아래)에서는 남는 재료로 내 수족관 전용 소품을 만들어요. <b>🐢 거북 배달소<\/b>를 지으면 <b>🐢 마을 택배<\/b> 거북이 수족관에 가끔 들러, 주민들이 촌장님께 고맙다며 모아 보낸 진주를 전해 줘요(하루 3번).":"<b>🐠 Aquarium workshop<\/b> (below 📦 Storage) turns spare materials into decor made only for your aquarium. Once you build the <b>🐢 Turtle Depot<\/b>, the <b>🐢 Town parcel<\/b> turtle sometimes visits your aquarium with Pearls the residents chipped in to thank their mayor (3 times a day).","이웃 바다 마을이 모자란 물건을 주문했어요 · 우리 마을이 만들어 창고에 모은 물건을 거북이 실어다 주면 물건값으로 진주를 받아요":"Neighboring sea towns ordered goods they lack · the turtle delivers what your town made and stored, and they pay you in Pearls","팔 물건이 있어야 주문을 받아요 · 다시마 농장이나 산호 광산을 먼저 지어요":"You need goods to sell before orders come in · build a Kelp Farm or Coral Quarry first","🚋 산 너머 광산 마을로 물건을 바꾸러 갔어요 · 돌아오기까지":"🚋 Off to the mining town over the ridge to trade goods · back in","주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요.":"Residents pay part of the Pearls they earn at work as taxes, and they pile up here.","깊은 바닷속이라 물에 녹은 산소가 모자라요. 물고기는 펌프가 산소를 뿜는 둘레에서만 살 수 있어요.":"This deep, the water holds little oxygen. Fish can only live where a pump spreads it.","주민 일꾼들이 바닥의 산호석을 캐요. 남는 산호석은 주문으로 이웃 마을에 팔 수 있어요.":"Resident workers dig coral stone from the seabed. Spare stone can be sold to neighboring towns through orders.","주민 일꾼들이 다시마를 길러요.":"Resident workers grow the kelp.","짓기에 드는 진주는 이 게 일꾼들의 품삯과 재료값이에요.":"The Pearls you spend on building pay these crabs' wages and supplies.","주민 일꾼이 만든 경단은 상점(상업 구역)으로 가서 주민들에게 팔려요.":"Dumplings made by resident workers go to shops (commercial zones) and are sold to residents.","만든 옷은 상점으로 가서 주민들에게 팔려요.":"The clothes go to shops and are sold to residents.","파는 물건은 우리 광산 · 농장 · 공장이 만들어 창고에 모아 둔 거예요.":"What you sell is what your quarries, farms and factories made and stored.","사 먹을 곳이 늘어야 더 많은 물고기가 끼니 걱정 없이 살 수 있어요.":"More places to eat let more fish live here without worrying about meals.","아이 물고기가 다닐 학교가 있어야 가족들이 이사 와요.":"Families move in when their little fish have a school.","아플 때 갈 곳이 가까워야 큰 건물에 많이 모여 살 수 있어요.":"Fish only crowd into big buildings when a clinic is close by.","바닥 틈에서 솟는 뜨거운 물을 거품으로 식혀 동네를 지켜요. 안전한 동네라야 집이 커져요.":"Cools hot water bursting from seabed cracks with bubbles. Homes only grow in safe neighborhoods.","동네에 나타나는 상어를 쫓아내요. 상어 걱정이 없어야 높은 건물에 살아요.":"Chases off sharks. Fish only live in tall buildings when sharks aren't a worry.","주민 일꾼들이 산호석을 구워 벽돌을 만들어요.":"Resident workers fire coral stone into bricks.","열차가 우리 물건을 싣고 산 너머 광산 마을에 가서 벽돌 · 못과 바꿔 와요.":"The train takes your goods to the mining town over the ridge and trades them for bricks and nails.","구경 오는 손님들 덕에 둘레 땅값이 오르고, 내 수족관과 이어져요.":"Visitors raise land value around it, and it links to your own aquarium.","우리 물건을 먼 바다 마을에 팔고, 그곳 특산품인 진주 못 · 보석을 사 와요.":"Sells your goods to a far-off sea town and brings back its specialties: pearl nails and gems.","⚡ 아가미 파이터 한 판마다 공사 단축 15분 · 재료 상자에 든 연장 덕에 게 일꾼 일이 빨라져요":"⚡ Each Gill Fighter run gives a 15-min build speed-up · the tools in the supply crate help the crabs work faster","축제를 열면 주민들이 광장에 모여 장을 보고, 신이 나서 일도 더 열심히 해요":"Hold a festival and residents gather in the plaza to shop, and they work harder in high spirits","게 일꾼들이 말뚝을 박고 길을 내어 16×16칸 새 땅을 열어요 · 바위 · 덤불이 있어요":"The crab builders stake out and clear a new 16×16 plot · It has rocks and bushes","주민 대표들이 촌장님께 부탁하는 일이에요":"Tasks the residents' council asks of their mayor","거북 배달소를 지으면 이웃 바다 마을에서 물건 주문이 들어와요. 거북이 실어다 주면 물건값으로 진주를 받아요":"Build a Turtle Post and neighboring sea towns will order goods. Deliver by turtle and they pay you in Pearls","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 구역 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"The Coral Hall level is your town's stage. No building can be a higher level, and new buildings, zone levels and land expansion unlock with it. Upgrading needs certain building levels and population. Residents pay part of the Pearls they earn at work as taxes, and they build up here: the more shoppers and the happier they are, the more you collect.","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 집 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"The Coral Hall level is your town's stage. No building can be a higher level, and new buildings, home levels and land expansion unlock with it. Upgrading needs certain building levels and population. Residents pay part of the Pearls they earn at work as taxes, and they build up here: the more shoppers and the happier they are, the more you collect.","산소를 퍼뜨려 집을 지을 수 있게":"Spreads oxygen so you can build homes","주변에 산소를 내보내요. 산소가 닿지 않는 곳에는 집 · 가게 · 공방을 못 지어요. 레벨을 올리면 범위가 넓어지고, 진주 양식장을 여는 조건이 돼요.":"Releases oxygen around it. Homes, shops and workshops can't be built where oxygen doesn't reach. Upgrading widens the range and is required to unlock the Pearl Farm.","모든 공사에 쓰는 산호석을 캐요. 말풍선을 눌러 받아요. 주변 땅값을 조금 내리니 집과 떨어뜨려 지어요.":"Mines the Coral Stone used in all construction. Tap the bubble to collect. It slightly lowers nearby land value, so build it away from homes.","아픈 물고기를 돌봐요. 인구 한도를 늘리고, 범위 안 집 · 가게 · 공방이 5단계로 자랄 수 있게 해요.":"Cares for sick fish. Raises the population cap and lets homes, shops and workshops in range grow to Lv.5.","범위 안 집 · 가게 · 공방이 3단계까지 자람":"Homes, shops and workshops in range can grow to Lv.3","범위 안 집 · 가게 · 공방이 4단계까지 자람":"Homes, shops and workshops in range can grow to Lv.4","해마 순찰대예요. 범위 안에 있는 집 · 가게 · 공방이 4단계(고층)로 자랄 수 있어요.":"The Seahorse Patrol. Homes, shops and workshops in range can grow to Lv.4 (high-rise).","주민 일꾼이 만든 경단은 가게로 가서 주민들에게 팔려요.":"Dumplings made by resident workers go to shops and are sold to residents.","산소 · 집을 지을 수 있는 범위":"Oxygen · Range where you can build homes","건물 · 집 · 가게는 도로에 붙어야 돌아가요. 도로끼리 이어지면 모양이 저절로 맞춰져요.":"Buildings, homes and shops must touch a road to work. Roads connect and shape themselves automatically.","👷 일꾼이 모자라요 · 집을 더 지어요":"👷 Not enough workers · Build more homes","🛍 가게가 모자라요 · 짓기 → 🏠 집 · 가게":"🛍 Not enough shops · Build → 🏠 Homes & Shops","🏠 집 · 가게":"🏠 Homes & Shops","🏠 집":"🏠 Home","🛍 가게":"🛍 Shop","🔧 공방":"🔧 Workshop","🧽 헐기":"🧽 Remove","물고기가 살아요 · 인구 +":"Fish live here · population +","주민이 경단 · 옷을 사요 · 세금 +":"Residents buy dumplings and clothes · taxes +","일자리 + · 생산이 빨라져요":"Jobs + · production speeds up","▲ 더 필요해요":"▲ Needed","▼ 넘쳐요":"▼ Too many","– 적당해요":"– Just right","놓으면 물고기들이 와서 지어요 · 도로 옆 · 산소가 닿는 곳 · ✓를 계속 누르면 옆에 한 채씩 더 지어요 · 다 지은 뒤엔 저절로 커져요":"Place it and the fish come build it · next to a road · where oxygen reaches · keep tapping ✓ to add one more next to it · it grows on its own once built","산소가 안 닿아요 · 산소 펌프 가까이에 지어요":"No oxygen here · build near an Oxygen Pump","여기에 지을 수 있어요 · 끌거나 다른 칸을 눌러 옮겨요 · ✓를 또 누르면 옆에 한 채 더":"You can build here · drag or tap another tile to move · tap ✓ again for one more next to it","도로 옆 · 산소가 닿는 빈 땅이 없어요 · 산소 펌프 · 도로를 먼저 놓아요":"No free land by a road with oxygen · place an Oxygen Pump or road first","물고기가 살 <b>🏠 집<\/b>을 4채 지어요":"Build 4 <b>🏠 homes<\/b> for fish to live in","👆 여기를 누르면 도로 옆에 집 4채를 바로 지어요 · 짓는 건 물고기들이 해요":"👆 Tap here to build 4 homes by the road right away · the fish do the building","👆 누르면 집을 더 지어요 · 산소 · 경단이 있어야 이사 와요":"👆 Tap to build more homes · fish need oxygen and dumplings to move in","<b>🏠 집 · 🛍 가게 · 🔧 공방<\/b>은 🔨 짓기 → 🏠 집 · 가게에서 건물처럼 놓으면 물고기들이 와서 지어요. 도로 옆, 산소 펌프의 산소가 닿는 곳이어야 해요. 다 지으면 땅값 · 행복에 따라 저절로 커져요.":"<b>🏠 Homes · 🛍 Shops · 🔧 Workshops<\/b>: place them like buildings from 🔨 Build → 🏠 Homes & Shops and the fish come build them. They need a road and oxygen from an Oxygen Pump. Once built they grow on their own with land value onumentos, y baja cerca de minas, hornos y fábricas. Antes de colocar un edificio puedes verlo con casillas verdes/rojas y números sobre las casas. Las casas crecen más donde el suelo vale más.","🏛 산호궁 최고 단계예요 ✨":"🏛 El Palacio de Coral está al máximo ✨","🐠 수족관 공방":"🐠 Taller del acuario","만들기":"Hacer","지금은 보낼 수 없어요":"Ahora no se puede enviar","푸른 등대":"Faro azul","다시마 지붕 오두막":"Cabaña de techo de algas","산호 벽돌 성":"Castillo de ladrillo de coral","진주빛 테이블산호":"Coral mesa perlado","황금 산호 아치":"Arco de coral dorado","황금 뇌산호":"Coral cerebro dorado","마을 재료로 <b>내 수족관 전용 소품<\/b>을 만들어 보내요 · 수족관 › 꾸미기 › 소품에 들어가요":"Con materiales del pueblo haz <b>adornos solo para tu acuario<\/b> · van a Acuario › Decorar › Adornos","랜드마크 · 땅값 + · 인구 한도 + · 내 수족관 넓히기":"Monumento · valor del suelo + · población + · acuario más grande","아가미 수족관이에요. 넓은 범위의 땅값을 크게 올리고 인구 한도를 늘려요. 레벨마다 아가미 파이터 내 수족관의 소품 칸이 2칸, 집 진주 샘이 1% 늘어요.":"El Acuario Gill. Sube mucho el valor del suelo en un área amplia y el límite de población. Cada nivel añade 2 espacios de adornos y +1% a la fuente de perlas de tu acuario de Gill Fighter.","🏆 마을 기록":"🏆 Récords del pueblo","마을 기록":"Récords","도장 모으기":"Junta sellos","✓ 다 모음":"✓ Completo","마을 이름 바꾸기":"Cambiar nombre","단계를 넘으면 💎 · ⭐ 명성을 받아요":"Cada etapa superada da 💎 y ⭐ Fama","마을 이름 (10글자까지)":"Nombre del pueblo (hasta 10 caracteres)","<b>🏆 마을 기록<\/b>(☰ 메뉴)은 오래 두고 모으는 도장이에요. 단계를 넘을 때마다 💎 · ⭐ 명성을 받고, 맨 위 ✏로 마을 이름을 지어요.":"Los <b>🏆 Récords del pueblo<\/b> (☰ Menú) son sellos que juntas con el tiempo. Cada etapa superada da 💎 y ⭐ Fama, y con el ✏ de arriba le pones nombre a tu pueblo.","바다 축제의 밤":"Noches de fiesta marina","조개껍데기 재활용":"Reciclaje de conchas","경단 나눔":"Reparto de bolitas","일찍 출근":"Turno temprano","밤길 가로등":"Faroles nocturnos","게 일꾼 야근":"Turno nocturno de cangrejos","안전 훈련":"Simulacros de seguridad","행복 +8":"Felicidad +8","행복 +6":"Felicidad +6","행복 −7":"Felicidad −7","행복 −5":"Felicidad −5","세금 −15%":"Impuestos −15%","세금 −10%":"Impuestos −10%","탁한 물 −30%":"Agua turbia −30%","생산 −10%":"Producción −10%","생산 −5%":"Producción −5%","생산 +15%":"Producción +15%","경단 먹는 양 ×1.6":"Bolitas consumidas ×1.6","모든 땅값 +4":"Todo el valor del suelo +4","공사 시간 −20%":"Tiempo de obra −20%","사건 −40%":"Incidentes −40%","⚖ 마을 정책":"⚖ Políticas del pueblo","마을 정책":"Políticas","⚖ 정책":"⚖ Políticas","끄기":"Desactivar","켜기":"Activar","건물 보기":"Ver edificio","💎1 바로":"💎1 ya","맑음":"Limpia","조금":"Algo","탁함":"Turbia","탁한 물":"Agua turbia","물 거르개":"Filtro de agua","큰 물 거르개":"Filtro de agua grande","🗺 탁한 물 보기":"🗺 Ver agua turbia","(집 근처 평균 · 🗺 지도 → 탁한 물)":"(media cerca de las casas · 🗺 Mapa → Agua turbia)","상어 출몰":"Tiburón a la vista","뜨거운 물 분출":"Chorro de agua caliente","물고기 감기":"Resfriado de peces","적조":"Marea roja","상어가 나타나 주민 절반이 숨었어요":"Apareció un tiburón y la mitad de los habitantes se esconde","바닥에서 뜨거운 물이 솟아 일이 멈췄어요":"Brota agua caliente del suelo y el trabajo se detuvo","감기가 돌아 주민 절반이 쉬고 있어요":"Hay un resfriado y la mitad de los habitantes descansa","탁한 물에 붉은 물이 끼어 일이 멈췄어요":"Se formó agua roja en la turbiedad y el trabajo se detuvo","🫧 물 거르개":"🫧 Filtro de agua","정책은 🏛 산호궁 Lv.6에 열려요 · 좋은 점과 대가가 같이 있어요":"Las políticas se abren con el 🏛 Palacio de Coral Nv 6 · cada una tiene ventaja y coste","막으려면: 🌫 탁한 물 45 밑으로 · ⚙ 기반 → 🫧 물 거르개":"Para evitarlo: mantén el 🌫 agua turbia por debajo de 45 · ⚙ Servicios básicos → 🫧 Filtro de agua","⚠ 사건 🔒 🏛Lv.6":"⚠ Incidentes 🔒 🏛Nv.6","⚖ 정책 🔒 🏛Lv.6":"⚖ Políticas 🔒 🏛Nv.6","🏛 Lv.6에 열려요":"Se abre en 🏛 Nv 6","<i style=\"background:#5ac8ff\"><\/i> 맑음 <i style=\"background:#8c8c5a\"><\/i> 조금 <i style=\"background:#a05a32\"><\/i> 탁함 · 집 3단계 40 · 4단계 25 · 5단계 15 이하 · 🫧 물 거르개로 맑게":"<i style=\"background:#5ac8ff\"><\/i> Limpia <i style=\"background:#8c8c5a\"><\/i> Algo <i style=\"background:#a05a32\"><\/i> Turbia · casas Nv 3 ≤40 · Nv 4 ≤25 · Nv 5 ≤15 · límpiala con 🫧 Filtros de agua","<b>🌫 탁한 물<\/b>: 광산 · 가마 · 공장 · 공방 · 항구 · 산업 구역 둘레의 물이 흐려져요. 집 근처가 탁하면 입주가 줄고 행복이 내려가며, 집 3단계는 40 · 4단계는 25 · 5단계는 15 이하여야 자라요. ⚙ 기반의 <b>🫧 물 거르개<\/b>를 여러 개 지어 맑게 하고, 🗺 지도에서 확인해요.":"<b>🌫 Agua turbia<\/b>: el agua alrededor de canteras, hornos, fábricas, talleres, puertos y zonas industriales se enturbia. Cerca de las casas reduce los habitantes y la felicidad, y las casas necesitan 40 o menos para Nv 3, 25 para Nv 4 y 15 para Nv 5. Construye varios <b>🫧 Filtros de agua<\/b> desde ⚙ Servicios básicos y revísalo en el 🗺 mapa.","<b>⚖ 마을 정책<\/b>(☰ 메뉴)은 산호궁 Lv.6부터 켜요. 정책마다 좋은 점과 대가가 같이 있어요. Lv.10 · Lv.15에 한 칸씩 늘어요.":"Las <b>⚖ Políticas del pueblo<\/b> (☰ Menú) se activan desde el Palacio de Coral Nv 6. Cada una tiene ventaja y coste. Ganas un hueco más en Nv 10 y Nv 15.","<b>⚠ 마을 사건<\/b>: 산호궁 Lv.6부터 가끔 상어 · 뜨거운 물 · 감기 · 적조가 생겨요. 🚒 소방서 · 👮 순찰대 · 🏥 병원 범위 안이면 저절로 막고, 못 막으면 건물을 눌러 해결하거나 2시간 기다려요.":"<b>⚠ Incidentes<\/b>: desde el Palacio de Coral Nv 6 a veces hay tiburones, agua caliente, resfriados o marea roja. Dentro del alcance de 🚒 bomberos, 👮 patrulla o 🏥 clínica se evitan solos; si no, toca el edificio para resolverlo o espera 2 horas.","숨샘":"Manantial de aire","큰 숨탑":"Gran torre de aire","<b>💨 숨샘 · 큰 숨탑<\/b>(⚙ 기반)은 여러 개 지을 수 있어요. 산소 펌프만으로 모자란 곳에 놓아 구역이 자라는 범위를 넓혀요.":"Los <b>💨 Manantiales de aire · Grandes torres de aire<\/b> (⚙ Servicios básicos) se pueden construir varias veces. Ponlos donde no llega la Bomba de Oxígeno para ampliar la zona donde crecen las zonas.","우리 집 앞에 상어가 왔어요! 무서워서 못 들어가요":"¡Hay un tiburón delante de mi casa! Me da miedo entrar","콜록… 우리 동네에 감기가 돌아요":"Cof… hay un resfriado en mi barrio","바닥에서 뜨거운 물이 나와요!":"¡Sale agua caliente del suelo!","붉은 물 때문에 숨쉬기 힘들어요":"Con el agua roja cuesta respirar","물이 너무 탁해서 아가미가 따끔해요… 물 거르개가 있으면 좋겠어요":"El agua está tan turbia que me pican las agallas… ojalá hubiera un filtro de agua","요즘 물이 좀 뿌옇네요":"Últimamente el agua está algo turbia","배고파요… 장터에 경단이 없대요":"Tengo hambre… dicen que no quedan bolitas en las tiendas","옷이 다 해졌어요. 새 옷 사고 싶어요":"Mi ropa está gastada. Quiero ropa nueva","친구들이 이사 오고 싶어 하는데 마을이 꽉 찼대요":"Mis amigos quieren mudarse, pero dicen que el pueblo está lleno","장 볼 가게가 모자라요. 줄이 너무 길어요":"Faltan tiendas. Las colas son larguísimas","일자리는 많은데 살 집이 모자라요":"Hay mucho trabajo pero faltan casas","바다 축제의 밤 최고! 매일 했으면 좋겠어요":"¡Las noches de fiesta marina son lo mejor! Ojalá fueran diarias","아침 일찍 나오니까 졸려요… 하암":"Salir tan temprano me da sueño… ¡aaah!","게 일꾼들이 밤새 망치질해요. 쿵쿵!":"Los cangrejos martillean toda la noche. ¡Pum, pum!","밤에도 길이 환해서 좋아요":"Me encanta que las calles estén iluminadas de noche","우리 동네 땅값이 많이 올랐대요!":"¡Dicen que el valor del suelo de mi barrio subió mucho!","아가미시티에 살아서 행복해요!":"¡Soy feliz de vivir en Gill City!","요즘 마을 분위기가 좀 가라앉았어요":"Últimamente el pueblo está algo decaído","수족관이 생기면 구경 가고 싶어요":"Si abren un acuario, quiero ir a verlo","오늘도 열심히 헤엄쳐요!":"¡Hoy también a nadar con ganas!","산호궁이 정말 멋져요":"El Palacio de Coral es precioso","거북 택배가 언제 오려나":"¿Cuándo llegará la tortuga del reparto?","다시마 냄새가 좋아요":"Me encanta el olor a algas","주말엔 친구랑 산책할 거예요":"El fin de semana saldré a pasear con amigos","🏠 집:":"🏠 Casa:","💼 일터:":"💼 Trabajo:","기분:":"Ánimo:","😄 아주 좋아요":"😄 Genial","🙂 좋아요":"🙂 Bien","😐 그저 그래요":"😐 Regular","😟 안 좋아요":"😟 Mal","🏠 집 보기":"🏠 Ver casa","💼 일터 보기":"💼 Ver trabajo","<b>🐟 주민<\/b>을 누르면 이름 · 집 · 일터 · 기분과 한마디를 들을 수 있어요. 마을에 무엇이 모자란지 주민 말로 알 수 있어요.":"Toca a un <b>🐟 habitante<\/b> para ver su nombre, casa, trabajo y ánimo, y oír lo que dice. Sus palabras te dicen qué le falta al pueblo.","⬆ 길 넓히기":"⬆ Ensanchar calles","길 넓히기":"Ensanchar calles","교통":"Tráfico","자갈길":"Camino de grava","산호 대로":"Avenida de coral","해류 버스 정류장":"Parada del bus de corriente","한산":"Fluido","붐빔":"Lento","막힘":"Atasco","끌어서 길을 넓혀요 · 자갈길 40🫧 🪨20 · 산호 대로 120🫧 🪨60 · 이동은 두 손가락":"Arrastra para ensanchar · Grava 40🫧 🪨20 · Avenida de coral 120🫧 🪨60 · muévete con dos dedos","막힌 길을 자갈길 · 산호 대로로":"Convierte calles atascadas en grava o avenida","<i style=\"background:#46c86e\"><\/i> 한산 <i style=\"background:#ffc83c\"><\/i> 붐빔 <i style=\"background:#eb463c\"><\/i> 막힘 · ⬆ 길 넓히기 · 🚌 버스 정류장으로 풀어요":"<i style=\"background:#46c86e\"><\/i> Fluido <i style=\"background:#ffc83c\"><\/i> Lento <i style=\"background:#eb463c\"><\/i> Atasco · arréglalo con ⬆ Ensanchar · 🚌 Paradas de bus","<b>🚦 교통<\/b>: 집 · 가게 · 공방 · 일터가 몰린 길은 막혀요. 막힌 길 옆은 생산 · 입주 · 행복이 줄고, 구역 4단계부터는 길이 안 막혀야 자라요. 🛣 도로 탭 <b>⬆ 길 넓히기<\/b>로 자갈길(Lv.5) · 산호 대로(Lv.12)를 깔거나, ⚙ 기반의 <b>🚌 해류 버스 정류장<\/b>을 놓아요. 🗺 지도 → 교통으로 확인해요.":"<b>🚦 Tráfico<\/b>: las calles con muchas casas, tiendas, talleres y trabajos se atascan. Junto a una calle atascada bajan la producción, las mudanzas y la felicidad, y las zonas necesitan calles sin atasco para pasar de Nv 4. Usa <b>⬆ Ensanchar calles<\/b> en la pestaña 🛣 Carretera para hacer grava (Nv 5) y avenidas de coral (Nv 12), o pon <b>🚌 Paradas del bus de corriente<\/b> desde ⚙ Servicios básicos. Míralo en 🗺 Mapa → Tráfico.","해류 열차 정거장":"Parada del tranvía de corriente","선로 위에는 못 지어요":"No se puede construir sobre las vías","선로 옆에 지어야 해요 · 🛣 도로 탭 「🚋 선로 놓기」":"Debe estar junto a las vías · pestaña 🛣 Carretera → “🚋 Tender vías”","🚋 선로 놓기":"🚋 Tender vías","건물이 있는 칸이에요":"Ahí ya hay un edificio","🚋 해류 열차역을 먼저 지어요":"Primero construye la 🚋 Estación del Tren Corriente","🛣 길 자동 연결 켜짐":"🛣 Autoconexión de calles activada","🛣 길 자동 연결":"🛣 Autoconexión de calles","꺼짐 · 길은 직접 깔아요":"Desactivada · traza las calles tú","켜짐 · 길에 안 닿은 칸까지 길을 깔아요":"Activada · añade calles hasta cada casilla de zona","진주가 모자라 길을 다 잇지 못했어요":"No hay Perlas suficientes para conectar todas las calles","✅ 이어졌어요":"✅ Conectada","⚠ 아직 안 이어졌어요 · 🚋 선로로 다른 정거장까지 이어요":"⚠ Aún sin conectar · tiende 🚋 vías hasta otra parada","<i style=\"background:#9664e6\"><\/i> 선로":"<i style=\"background:#9664e6\"><\/i> Vías","<b>🚋 열차 · 탈것<\/b>: 길 위로 🚌 버스 · 🐢 택배 거북 · 🦀 게 수레가 다니고, 막힌 길에선 💢 하며 느려져요. 산호궁 Lv.9에 해류 열차역을 지으면 🛣 도로 탭 <b>🚋 선로 놓기<\/b>로 선로를 깔 수 있어요. ⚙ 기반의 <b>🚉 해류 열차 정거장<\/b>을 선로 옆에 놓고 다른 정거장(또는 열차역)과 이으면 트램이 오가고 둘레 5칸 길이 덜 막혀요.":"<b>🚋 Tranvías y vehículos<\/b>: 🚌 buses, 🐢 tortugas mensajeras y 🦀 carritos cangrejo circulan por tus calles y van más lentos con 💢 en calles atascadas. Al construir la Estación del Tren Corriente (Palacio de Coral Lv.9), usa <b>🚋 Tender vías<\/b> en la pestaña 🛣 Carretera. Pon una <b>🚉 Parada del tranvía de corriente<\/b> (⚙ Servicios básicos) junto a las vías y conéctala con otra parada (o la estación): circulan tranvías y las calles a 5 casillas se atascan menos.","<b>🛣 길 자동 연결<\/b>: 구역을 칠하고 손을 떼면 길에 안 닿은 칸까지 길을 깔아 줘요(한 칸 10🫧). 🏘 구역 탭에서 끌 수 있어요.":"<b>🛣 Autoconexión de calles<\/b>: al levantar el dedo tras pintar zonas, se añaden calles para que cada casilla de zona toque una (10🫧 por casilla). Desactívala en la pestaña 🏘 Zonas.","세율":"Impuestos","올리면 진주가 더 들어오지만 그 구역 수요가 줄고(이사 · 가게 · 공방이 덜 생김) 행복이 내려가요 · 기본 9%":"Subirlos da más perlas, pero baja la demanda de esa zona (menos mudanzas, tiendas y talleres) y la felicidad · base 9%","수요 그대로":"Demanda sin cambios","물건값 ↑":"Precios ↑","<b>💰 세율<\/b>(☰ 메뉴): 산호궁 Lv.4부터 주거 · 상업 · 산업 세율을 0~20%로 정해요. 올리면 진주가 더 들어오지만 그 구역 수요가 줄고, 주거 · 상업 세금이 높으면 행복도 내려가요. 내리면 이사 오고 가게 · 공방이 잘 생겨요.":"<b>💰 Impuestos<\/b> (☰ Menú): desde el Palacio de Coral Lv.4, fija los impuestos Residencial, Comercial e Industrial entre 0 y 20%. Subirlos da más perlas, pero baja la demanda de esa zona, y si los impuestos residencial o comercial son altos, también baja la felicidad. Bajarlos atrae mudanzas y más tiendas y talleres.","오늘의 마을 일":"Tareas del pueblo de hoy","오늘의 일 3개 모두 끝내기":"Termina las 3 tareas de hoy","광장":"Plaza","축제 · 기념물":"Festival · Monumentos","축제 중":"Festival en marcha","축제 중이에요":"El festival ya está en marcha","축제의 날":"Día de festival","축제의 날 열기":"Empezar el Día de festival","축제의 날! 1시간 동안 세금 2배 · 생산 1.5배":"¡Día de festival! Impuestos ×2 · producción ×1,5 durante 1 hora","하루 한 번 · 1시간 동안 세금 2배 · 생산 1.5배 · 축제 방울 +15":"Una vez al día · impuestos ×2 y producción ×1,5 durante 1 hora · fichas de festival +15","오늘은 이미 열었어요 · 내일 또 열 수 있어요":"Ya lo celebraste hoy · podrás repetir mañana","산호 등대":"Faro de coral","고래 뼈 아치":"Arco de hueso de ballena","용궁 시계탑":"Torre del reloj del Palacio","다 지었어요 ✨":"¡Terminado! ✨","다음 단계:":"Siguiente fase:","👆 여기를 누르면 다시마 농장 → 경단 공장을 바로 지어요":"👆 Toca aquí para construir ya la granja de algas → fábrica de bolitas","👆 여기를 누르면 배달소를 바로 짓고, 다 지으면 주문판을 열어요":"👆 Toca aquí para construir ya la oficina de reparto y, al terminar, abrir los pedidos","👆 여기를 누르면 바로 지어요":"👆 Toca aquí para construirlo ya","끌면 화면 이동":"arrastra para mover la vista","물고기가 살 <b>🏠 집 지을 땅<\/b>을 정해요":"Marca <b>🏠 terreno para casas<\/b> donde vivan los peces","👆 여기를 누르면 도로 옆 4칸을 바로 정해요 · 집은 물고기가 지어요":"👆 Toca aquí para marcar 4 casillas junto a la calle · las casas las construyen los peces","도로 옆 빈 땅이 없어요 · 직접 지정해 봐요":"No hay terreno libre junto a la calle · márcalo tú","다 지어지면 다음 할 일을 알려 드릴게요":"Cuando termine te diré lo siguiente","👆 여기를 누르면 산호궁 창을 열어요":"👆 Toca aquí para abrir el Palacio de Coral","👆 누르면 집 지을 땅을 더 정해요 · 산소 · 경단이 있어야 와요":"👆 Toca para marcar más terreno · los peces necesitan oxígeno y bolitas","👆 여기를 누르면 그 건물 창을 열어요":"👆 Toca aquí para abrir ese edificio","도미 비서 · 다음 할 일":"Secretaria Dorada · Siguiente tarea","이웃 바다 마을이 모자란 물건을 주문했어요 · 거북이 실어다 주면 물건값으로 진주를 받아요":"Los pueblos marinos vecinos piden lo que les falta · entrégalo en tortuga y te pagan en perlas","이웃 바다 마을에 물건을 팔아 진주를 벌어요":"Vende a los pueblos marinos vecinos y gana perlas","거북 배달소를 지으면 이웃 바다 마을에서 물건 주문이 들어와요. 거북이 실어다 주면 물건값으로 진주를 받아요 · 🏛 산호궁 Lv.3에 열려요":"Construye la oficina de tortugas y los pueblos vecinos harán pedidos. Entrégalos y te pagan en perlas · se abre con 🏛 Palacio Nv.3","이웃 바다 마을들은 산호석 · 다시마 · 경단 · 옷이 늘 모자라요. 주문판에 필요한 물건이 올라오면 창고에서 꺼내 거북이 실어다 주고, 물건값으로 진주를 받아요(바닷속에선 진주가 돈이에요). 세금과 함께 마을의 두 가지 수입이라, 우리 마을이 만든 재료를 진주로 바꾸는 곳이에요.":"A los pueblos marinos vecinos siempre les faltan piedra de coral, algas, bolitas y ropa. Cuando llega un pedido, la tortuga lo lleva desde tu almacén y te pagan en perlas (bajo el mar, las perlas son dinero). Junto con los impuestos es uno de los dos ingresos del pueblo: convierte lo que produces en perlas.","<b>구역 = 물고기가 직접 짓는 땅<\/b>이에요. 🏠 주거엔 집, 🛍 상업엔 가게, 🔧 산업엔 공방이 생겨요. 도로 옆 칸을 손가락으로 쭉 끌면 끝 · 산소가 닿아야 지어요 · 한 칸 5🫧":"<b>Zonas = terreno donde los peces construyen solos<\/b>. 🏠 Residencial: casas, 🛍 Comercial: tiendas, 🔧 Industrial: talleres. Arrastra junto a la calle · necesitan oxígeno · 5🫧 por casilla","<small>도미 비서 · 다음 할 일<\/small>":"<small>Secretaria Dorada · Siguiente tarea<\/small>","진주(바닷속 돈)로 게 일꾼에게 공사를 맡기고, 도로 옆에 집 지을 땅을 정해 주면 떠돌던 물고기들이 이사 와요. 마을 입구를 지난 물고기는 다리가 쑥 자라 주민이 돼요.":"Paga a los cangrejos constructores con perlas (el dinero del mar) y marca terreno para casas junto a la calle: los peces errantes se mudarán. Al cruzar la entrada del pueblo les salen piernas y se vuelven vecinos.","주민들은 광산 · 농장 · 공장에서 일해 재료를 만들어요. 건물 머리 위 동그란 말풍선(🪨 🌿 🫧)을 눌러 창고로 모으고, 그 재료로 건물을 올리거나 이웃 바다 마을에 팔아 진주를 벌어요.":"Los vecinos trabajan en minas, granjas y fábricas para producir materiales. Toca las burbujas (🪨 🌿 🫧) sobre los edificios para guardarlos en el almacén y úsalos para mejorar edificios o véndelos a pueblos vecinos por perlas.","<b>🫧 진주<\/b>는 바닷속의 돈이에요. 아가미 파이터와 같은 지갑이라, 바다에서 모은 진주를 마을에서도 써요. 짓기에 드는 진주는 게 일꾼 품삯과 재료값이에요. <b>💎 보석<\/b>으로는 공사를 바로 끝내요(5분 이하는 무료).":"<b>🫧 Las perlas<\/b> son el dinero del mar. Comparten cartera con Gill Fighter, así que las que juntas en el mar sirven en el pueblo. Lo que cuesta construir paga a los cangrejos y sus materiales. <b>💎 Las gemas<\/b> terminan obras al instante (gratis si quedan menos de 5 min).","<b>🔁 마을이 도는 순서<\/b>: 주민이 광산 · 농장 · 공장에서 일해 물건을 만들어요 → 창고에 모여요 → 🍡 경단 · 👕 옷은 상점으로 가서 주민이 사 먹고 입어요(그래야 행복해져 주택이 자라요) → 주민은 일해서 번 진주로 장을 보고 세금을 내요 → 남는 물건은 거북이 이웃 마을에 팔아 진주로 바꿔요.":"<b>🔁 Cómo funciona el pueblo<\/b>: los vecinos trabajan en minas, granjas y fábricas → todo va al almacén → 🍡 bolitas y 👕 ropa van a las tiendas y los vecinos las compran (así son felices y las casas crecen) → con las perlas de su trabajo compran y pagan impuestos → lo que sobra lo vende la tortuga a pueblos vecinos por perlas.","<b>🧾 세금<\/b>은 주민이 일해서 번 진주 중 일부를 마을에 내는 거예요. 상점에서 장을 본 인구 × 행복만큼 🏛 산호궁에 쌓여요(8시간치까지). 산호궁 위 🫧 말풍선을 눌러 걷어요.":"<b>🧾 Los impuestos<\/b> son parte de las perlas que ganan los vecinos trabajando. Se acumulan en el 🏛 Palacio según compradores × felicidad (hasta 8 horas). Toca la burbuja 🫧 sobre el Palacio para cobrarlos.","<b>🐢 주문<\/b>은 이웃 바다 마을이 모자란 물건을 사겠다는 거예요. 우리 마을 광산 · 농장 · 공장이 만들어 창고에 모아 둔 물건을 거북이 실어다 주면 물건값으로 진주 · 명성을 받아요. 세금과 함께 마을의 두 가지 수입이에요. 명성 레벨마다 💎 선물이 있어요.":"<b>🐢 Los pedidos<\/b> son pueblos marinos vecinos que quieren comprar lo que les falta. La tortuga lleva lo que tus minas, granjas y fábricas produjeron y guardaron, y te pagan con perlas y fama. Con los impuestos son los dos ingresos del pueblo. Cada nivel de fama da un regalo 💎.","<b>📜 의뢰<\/b>는 주민 대표들이 촌장님께 부탁하는 일이에요. 산호궁 Lv.5부터 매주 월요일에 3개씩 와요. 하나에 🫧 진주, 셋 다 하면 💎 보석도 받아요.":"<b>📜 Los encargos<\/b> son lo que el consejo vecinal le pide a su alcalde. Desde Palacio Nv.5 llegan 3 cada lunes. Cada uno da 🫧 perlas y los tres juntos, 💎 gemas.","<b>📦 재료 상자<\/b>는 내 물고기가 아가미 파이터에서 바다를 헤엄치다 주운 재료를 마을로 보내는 거예요. 20초 넘게 한 판 할 때마다 1개씩(하루 6개) 와요. <b>🐠 내 물고기<\/b>는 가끔 마을에 놀러 오고, 쓰다듬으면 수족관 친밀도가 올라요.":"<b>📦 Las cajas de materiales<\/b> traen lo que tu pez recoge nadando en Gill Fighter: llega una por cada partida de más de 20 segundos (hasta 6 al día). <b>🐠 Tus peces<\/b> a veces visitan el pueblo: acarícialos para subir su amistad del acuario.","<b>🐠 수족관 공방<\/b>(📦 창고 아래)에서는 남는 재료로 내 수족관 전용 소품을 만들어요. <b>🐢 거북 배달소<\/b>를 지으면 <b>🐢 마을 택배<\/b> 거북이 수족관에 가끔 들러, 주민들이 촌장님께 고맙다며 모아 보낸 진주를 전해 줘요(하루 3번).":"En el <b>🐠 Taller del acuario<\/b> (debajo de 📦 Almacén) conviertes materiales sobrantes en adornos exclusivos para tu acuario. Cuando construyas el <b>🐢 Reparto Tortuga<\/b>, la tortuga del <b>🐢 Paquete del pueblo<\/b> visita a veces tu acuario con perlas que los vecinos juntaron para agradecer a su alcalde (3 veces al día).","이웃 바다 마을이 모자란 물건을 주문했어요 · 우리 마을이 만들어 창고에 모은 물건을 거북이 실어다 주면 물건값으로 진주를 받아요":"Los pueblos vecinos piden lo que les falta · la tortuga lleva lo que tu pueblo produjo y guardó, y te pagan en perlas","팔 물건이 있어야 주문을 받아요 · 다시마 농장이나 산호 광산을 먼저 지어요":"Necesitas algo que vender para recibir pedidos · construye primero una granja de algas o una mina de coral","🚋 산 너머 광산 마을로 물건을 바꾸러 갔어요 · 돌아오기까지":"🚋 Fue al pueblo minero tras la cordillera a cambiar mercancía · vuelve en","주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요.":"Los vecinos pagan como impuesto parte de las perlas que ganan trabajando, y se acumulan aquí.","깊은 바닷속이라 물에 녹은 산소가 모자라요. 물고기는 펌프가 산소를 뿜는 둘레에서만 살 수 있어요.":"Tan hondo, el agua tiene poco oxígeno. Los peces solo viven donde una bomba lo reparte.","주민 일꾼들이 바닥의 산호석을 캐요. 남는 산호석은 주문으로 이웃 마을에 팔 수 있어요.":"Los vecinos extraen piedra de coral del fondo. La que sobra se vende a pueblos vecinos en pedidos.","주민 일꾼들이 다시마를 길러요.":"Los vecinos cultivan las algas.","짓기에 드는 진주는 이 게 일꾼들의 품삯과 재료값이에요.":"Las perlas que gastas al construir pagan el sueldo y los materiales de estos cangrejos.","주민 일꾼이 만든 경단은 상점(상업 구역)으로 가서 주민들에게 팔려요.":"Las bolitas que hacen los vecinos van a las tiendas (zona comercial) y se venden a los vecinos.","만든 옷은 상점으로 가서 주민들에게 팔려요.":"La ropa va a las tiendas y se vende a los vecinos.","파는 물건은 우리 광산 · 농장 · 공장이 만들어 창고에 모아 둔 거예요.":"Lo que vendes es lo que tus minas, granjas y fábricas produjeron y guardaron.","사 먹을 곳이 늘어야 더 많은 물고기가 끼니 걱정 없이 살 수 있어요.":"Con más sitios donde comer, más peces pueden vivir sin preocuparse por la comida.","아이 물고기가 다닐 학교가 있어야 가족들이 이사 와요.":"Las familias se mudan si sus pececitos tienen escuela.","아플 때 갈 곳이 가까워야 큰 건물에 많이 모여 살 수 있어요.":"Los peces solo se apiñan en edificios grandes si hay una clínica cerca.","바닥 틈에서 솟는 뜨거운 물을 거품으로 식혀 동네를 지켜요. 안전한 동네라야 집이 커져요.":"Enfría con burbujas el agua caliente que brota de las grietas. Las casas solo crecen en barrios seguros.","동네에 나타나는 상어를 쫓아내요. 상어 걱정이 없어야 높은 건물에 살아요.":"Espanta a los tiburones. Los peces solo viven en edificios altos sin miedo a tiburones.","주민 일꾼들이 산호석을 구워 벽돌을 만들어요.":"Los vecinos cuecen piedra de coral para hacer ladrillos.","열차가 우리 물건을 싣고 산 너머 광산 마을에 가서 벽돌 · 못과 바꿔 와요.":"El tren lleva tus mercancías al pueblo minero tras la cordillera y las cambia por ladrillos y clavos.","구경 오는 손님들 덕에 둘레 땅값이 오르고, 내 수족관과 이어져요.":"Los visitantes suben el valor del suelo alrededor, y se conecta con tu acuario.","우리 물건을 먼 바다 마을에 팔고, 그곳 특산품인 진주 못 · 보석을 사 와요.":"Vende tus mercancías a un pueblo lejano y trae sus especialidades: clavos de perla y gemas.","⚡ 아가미 파이터 한 판마다 공사 단축 15분 · 재료 상자에 든 연장 덕에 게 일꾼 일이 빨라져요":"⚡ Cada partida de Gill Fighter da 15 min de aceleración · las herramientas de la caja hacen que los cangrejos trabajen más rápido","축제를 열면 주민들이 광장에 모여 장을 보고, 신이 나서 일도 더 열심히 해요":"Si organizas un festival, los vecinos se reúnen en la plaza a comprar y, animados, trabajan más","게 일꾼들이 말뚝을 박고 길을 내어 16×16칸 새 땅을 열어요 · 바위 · 덤불이 있어요":"Los cangrejos marcan y abren un terreno nuevo de 16×16 · Tiene rocas y matorrales","주민 대표들이 촌장님께 부탁하는 일이에요":"Lo que el consejo vecinal le pide a su alcalde","거북 배달소를 지으면 이웃 바다 마을에서 물건 주문이 들어와요. 거북이 실어다 주면 물건값으로 진주를 받아요":"Construye la oficina de tortugas y los pueblos vecinos harán pedidos. Entrégalos y te pagan en perlas","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 구역 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"El nivel del Palacio de Coral es la etapa de tu pueblo. Ningún edificio puede superarlo, y con él se desbloquean nuevos edificios, niveles de zona y más territorio. Para mejorarlo necesitas ciertos niveles de edificios y población. Los vecinos pagan como impuesto parte de las perlas que ganan trabajando, y se acumulan aquí: cuanta más población compra y más feliz es, más cobras.","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 집 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"El nivel del Palacio de Coral es la etapa de tu pueblo. Ningún edificio puede superarlo, y con él se desbloquean nuevos edificios, niveles de casa y más territorio. Para mejorarlo necesitas ciertos niveles de edificios y población. Los vecinos pagan como impuesto parte de las perlas que ganan trabajando, y se acumulan aquí: cuanta más población compra y más feliz es, más cobras.","산소를 퍼뜨려 집을 지을 수 있게":"Reparte oxígeno para poder construir casas","주변에 산소를 내보내요. 산소가 닿지 않는 곳에는 집 · 가게 · 공방을 못 지어요. 레벨을 올리면 범위가 넓어지고, 진주 양식장을 여는 조건이 돼요.":"Libera oxígeno a su alrededor. Donde no llega el oxígeno no se pueden construir casas, tiendas ni talleres. Al mejorarla, el alcance aumenta, y es requisito para abrir el Criadero de Perlas.","모든 공사에 쓰는 산호석을 캐요. 말풍선을 눌러 받아요. 주변 땅값을 조금 내리니 집과 떨어뜨려 지어요.":"Extrae la Piedra de coral que usan todas las obras. Toca la burbuja para reclamarla. Baja un poco el valor del suelo cercano, así que constrúyela lejos de las casas.","아픈 물고기를 돌봐요. 인구 한도를 늘리고, 범위 안 집 · 가게 · 공방이 5단계로 자랄 수 있게 해요.":"Cuida a los peces enfermos. Aumenta el límite de población y permite que las casas, tiendas y talleres en su alcance crezcan a Lv.5.","범위 안 집 · 가게 · 공방이 3단계까지 자람":"Las casas, tiendas y talleres en el alcance crecen hasta Lv.3","범위 안 집 · 가게 · 공방이 4단계까지 자람":"Las casas, tiendas y talleres en el alcance crecen hasta Lv.4","해마 순찰대예요. 범위 안에 있는 집 · 가게 · 공방이 4단계(고층)로 자랄 수 있어요.":"La Patrulla Caballito. Las casas, tiendas y talleres en su alcance pueden crecer a Lv.4 (torres).","주민 일꾼이 만든 경단은 가게로 가서 주민들에게 팔려요.":"Las bolitas que hacen los vecinos van a las tiendas y se venden a los vecinos.","산소 · 집을 지을 수 있는 범위":"Oxígeno · Alcance donde se pueden construir casas","건물 · 집 · 가게는 도로에 붙어야 돌아가요. 도로끼리 이어지면 모양이 저절로 맞춰져요.":"Los edificios, casas y tiendas deben tocar una carretera para funcionar. Las carreteras se conectan y toman forma solas.","👷 일꾼이 모자라요 · 집을 더 지어요":"👷 Faltan trabajadores · Construye más casas","🛍 가게가 모자라요 · 짓기 → 🏠 집 · 가게":"🛍 Faltan tiendas · Construir → 🏠 Casas y tiendas","🏠 집 · 가게":"🏠 Casas y tiendas","🏠 집":"🏠 Casa","🛍 가게":"🛍 Tienda","🔧 공방":"🔧 Taller","🧽 헐기":"🧽 Derribar","물고기가 살아요 · 인구 +":"Viven peces · población +","주민이 경단 · 옷을 사요 · 세금 +":"Los vecinos compran bolitas y ropa · impuestos +","일자리 + · 생산이 빨라져요":"Empleos + · la producción se acelera","▲ 더 필요해요":"▲ Hacen falta","▼ 넘쳐요":"▼ Sobran","– 적당해요":"– Justo","놓으면 물고기들이 와서 지어요 · 도로 옆 · 산소가 닿는 곳 · ✓를 계속 누르면 옆에 한 채씩 더 지어요 · 다 지은 뒤엔 저절로 커져요":"Colócala y los peces vienen a construirla · junto a una calle · donde llega el oxígeno · sigue tocando ✓ para añadir otra al lado · luego crece sola","산소가 안 닿아요 · 산소 펌프 가까이에 지어요":"Aquí no llega oxígeno · construye cerca de una bomba de oxígeno","여기에 지을 수 있어요 · 끌거나 다른 칸을 눌러 옮겨요 · ✓를 또 누르면 옆에 한 채 더":"Puedes construir aquí · arrastra o toca otra casilla para mover · toca ✓ otra vez para otra al lado","도로 옆 · 산소가 닿는 빈 땅이 없어요 · 산소 펌프 · 도로를 먼저 놓아요":"No hay terreno libre junto a una calle con oxígeno · pon antes una bomba o una calle","물고기가 살 <b>🏠 집<\/b>을 4채 지어요":"Construye 4 <b>🏠 casas<\/b> para los peces","👆 여기를 누르면 도로 옆에 집 4채를 바로 지어요 · 짓는 건 물고기들이 해요":"👆 Toca aquí para construir ya 4 casas junto a la calle · las construyen los peces","👆 누르면 집을 더 지어요 · 산소 · 경단이 있어야 이사 와요":"👆 Toca para construir más casas · los peces necesitan oxígeno y bolitas para mudarse","<b>🏠 집 · 🛍 가게 · 🔧 공방<\/b>은 🔨 짓기 → 🏠 집 · 가게에서 건물처럼 놓으면 물고기들이 와서 지어요. 도로 옆, 산소 펌프의 산소가 닿는 곳이어야 해요. 다 지으면 땅값 · 행복에 따라 저절로 커져요.":"<b>🏠 Casas · 🛍 Tiendas · 🔧 Talleres<\/b>: colócalos como edificios desde 🔨 Construir → 🏠 Casas y tiendas y los peces vienen a construirlos. Necesitan una calle y oxígeno de una bomba. Ya construidos, crecen solos según el valor del suelo y la felicidad.","<b>🌫 탁한 물<\/b>: 광산 · 가마 · 공장 · 공방 · 항구 둘레의 물이 흐려져요. 집 근처가 탁하면 입주가 줄고 행복이 내려가며, 집 3단계는 40 · 4단계는 25 · 5단계는 15 이하여야 자라요. ⚙ 기반의 <b>🫧 물 거르개<\/b>를 여러 개 지어 맑게 하고, 🗺 지도에서 확인해요.":"<b>🌫 Agua turbia<\/b>: el agua alrededor de canteras, hornos, fábricas, talleres y puertos se enturbia. Cerca de las casas reduce los habitantes y la felicidad, y las casas necesitan 40 o menos para Nv 3, 25 para Nv 4 y 15 para Nv 5. Construye varios <b>🫧 Filtros de agua<\/b> desde ⚙ Servicios básicos y revísalo en el 🗺 mapa.","<b>💨 숨샘 · 큰 숨탑<\/b>(⚙ 기반)은 여러 개 지을 수 있어요. 산소 펌프만으로 모자란 장 → 경단 공장을 바로 지어요":"👆 ここを押すと昆布農場 → 団子工場をすぐ建てます","👆 여기를 누르면 배달소를 바로 짓고, 다 지으면 주문판을 열어요":"👆 ここを押すと配達所をすぐ建て、完成したら注文板を開きます","👆 여기를 누르면 바로 지어요":"👆 ここを押すとすぐ建てます","끌면 화면 이동":"ドラッグで画面移動","물고기가 살 <b>🏠 집 지을 땅<\/b>을 정해요":"魚が住む<b>🏠 家を建てる土地<\/b>を決めよう","👆 여기를 누르면 도로 옆 4칸을 바로 정해요 · 집은 물고기가 지어요":"👆 ここを押すと道路沿いの4マスをすぐ決めます · 家は魚が建てます","도로 옆 빈 땅이 없어요 · 직접 지정해 봐요":"道路沿いに空き地がありません · 自分で指定してみて","다 지어지면 다음 할 일을 알려 드릴게요":"完成したら次のやることを教えますね","👆 여기를 누르면 산호궁 창을 열어요":"👆 ここを押すとサンゴ宮を開きます","👆 누르면 집 지을 땅을 더 정해요 · 산소 · 경단이 있어야 와요":"👆 押すと家の土地をもっと決めます · 酸素と団子が必要です","👆 여기를 누르면 그 건물 창을 열어요":"👆 ここを押すとその建物を開きます","도미 비서 · 다음 할 일":"タイ秘書 · 次のやること","이웃 바다 마을이 모자란 물건을 주문했어요 · 거북이 실어다 주면 물건값으로 진주를 받아요":"隣の海の村が足りない品を注文しました · カメが届けると代金として真珠がもらえます","이웃 바다 마을에 물건을 팔아 진주를 벌어요":"隣の海の村に品物を売って真珠を稼ぐ","거북 배달소를 지으면 이웃 바다 마을에서 물건 주문이 들어와요. 거북이 실어다 주면 물건값으로 진주를 받아요 · 🏛 산호궁 Lv.3에 열려요":"カメ配達所を建てると隣の海の村から注文が来ます。カメが届けると代金として真珠がもらえます · 🏛 サンゴ宮Lv.3で解放","이웃 바다 마을들은 산호석 · 다시마 · 경단 · 옷이 늘 모자라요. 주문판에 필요한 물건이 올라오면 창고에서 꺼내 거북이 실어다 주고, 물건값으로 진주를 받아요(바닷속에선 진주가 돈이에요). 세금과 함께 마을의 두 가지 수입이라, 우리 마을이 만든 재료를 진주로 바꾸는 곳이에요.":"隣の海の村はいつもサンゴ石・昆布・団子・服が足りません。注文が来たら倉庫から出してカメが届け、代金として真珠をもらいます(海の中では真珠がお金)。税金と並ぶ村の2つの収入で、村で作った材料を真珠に変える場所です。","<b>구역 = 물고기가 직접 짓는 땅<\/b>이에요. 🏠 주거엔 집, 🛍 상업엔 가게, 🔧 산업엔 공방이 생겨요. 도로 옆 칸을 손가락으로 쭉 끌면 끝 · 산소가 닿아야 지어요 · 한 칸 5🫧":"<b>区画 = 魚が自分で建てる土地<\/b>です。🏠 住宅には家、🛍 商業には店、🔧 工業には工房ができます。道路沿いを指でなぞるだけ · 酸素が届く必要あり · 1マス5🫧","<small>도미 비서 · 다음 할 일<\/small>":"<small>タイ秘書 · 次のやること<\/small>","진주(바닷속 돈)로 게 일꾼에게 공사를 맡기고, 도로 옆에 집 지을 땅을 정해 주면 떠돌던 물고기들이 이사 와요. 마을 입구를 지난 물고기는 다리가 쑥 자라 주민이 돼요.":"真珠(海の中のお金)でカニ職人に工事を頼み、道路沿いに家の土地を決めると、さまよう魚たちが引っ越してきます。町の入口を通った魚は足がにょきっと生えて住民になります。","주민들은 광산 · 농장 · 공장에서 일해 재료를 만들어요. 건물 머리 위 동그란 말풍선(🪨 🌿 🫧)을 눌러 창고로 모으고, 그 재료로 건물을 올리거나 이웃 바다 마을에 팔아 진주를 벌어요.":"住民は鉱山・農場・工場で働いて材料を作ります。建物の上の丸い吹き出し(🪨 🌿 🫧)を押して倉庫に集め、その材料で建物を上げたり、隣の海の村に売って真珠を稼ぎます。","<b>🫧 진주<\/b>는 바닷속의 돈이에요. 아가미 파이터와 같은 지갑이라, 바다에서 모은 진주를 마을에서도 써요. 짓기에 드는 진주는 게 일꾼 품삯과 재료값이에요. <b>💎 보석<\/b>으로는 공사를 바로 끝내요(5분 이하는 무료).":"<b>🫧 真珠<\/b>は海の中のお金です。アガミファイターと同じ財布なので、海で集めた真珠を町でも使えます。建設の真珠はカニ職人の手間賃と材料費です。<b>💎 宝石<\/b>で工事をすぐ終わらせます(5分以下は無料)。","<b>🔁 마을이 도는 순서<\/b>: 주민이 광산 · 농장 · 공장에서 일해 물건을 만들어요 → 창고에 모여요 → 🍡 경단 · 👕 옷은 상점으로 가서 주민이 사 먹고 입어요(그래야 행복해져 주택이 자라요) → 주민은 일해서 번 진주로 장을 보고 세금을 내요 → 남는 물건은 거북이 이웃 마을에 팔아 진주로 바꿔요.":"<b>🔁 町の回り方<\/b>:住民が鉱山・農場・工場で働いて品物を作る → 倉庫に集まる → 🍡 団子・👕 服は店に並び住民が買う(幸せになって家が育つ) → 住民は働いて得た真珠で買い物し税金を払う → 余った品はカメが隣の村に売って真珠に変える。","<b>🧾 세금<\/b>은 주민이 일해서 번 진주 중 일부를 마을에 내는 거예요. 상점에서 장을 본 인구 × 행복만큼 🏛 산호궁에 쌓여요(8시간치까지). 산호궁 위 🫧 말풍선을 눌러 걷어요.":"<b>🧾 税金<\/b>は住民が働いて得た真珠の一部です。店で買い物した人口 × 幸せ分だけ 🏛 サンゴ宮にたまります(8時間分まで)。サンゴ宮の上の 🫧 吹き出しを押して集めます。","<b>🐢 주문<\/b>은 이웃 바다 마을이 모자란 물건을 사겠다는 거예요. 우리 마을 광산 · 농장 · 공장이 만들어 창고에 모아 둔 물건을 거북이 실어다 주면 물건값으로 진주 · 명성을 받아요. 세금과 함께 마을의 두 가지 수입이에요. 명성 레벨마다 💎 선물이 있어요.":"<b>🐢 注文<\/b>は隣の海の村が足りない品を買いたいという依頼です。町の鉱山・農場・工場が作って倉庫にためた品をカメが届けると、代金として真珠と名声がもらえます。税金と並ぶ町の2つの収入です。名声レベルごとに 💎 プレゼント。","<b>📜 의뢰<\/b>는 주민 대표들이 촌장님께 부탁하는 일이에요. 산호궁 Lv.5부터 매주 월요일에 3개씩 와요. 하나에 🫧 진주, 셋 다 하면 💎 보석도 받아요.":"<b>📜 依頼<\/b>は住民代表が村長に頼むことです。サンゴ宮Lv.5から毎週月曜に3つ届きます。1つで 🫧 真珠、3つ全部で 💎 宝石ももらえます。","<b>📦 재료 상자<\/b>는 내 물고기가 아가미 파이터에서 바다를 헤엄치다 주운 재료를 마을로 보내는 거예요. 20초 넘게 한 판 할 때마다 1개씩(하루 6개) 와요. <b>🐠 내 물고기<\/b>는 가끔 마을에 놀러 오고, 쓰다듬으면 수족관 친밀도가 올라요.":"<b>📦 資材箱<\/b>は、エラファイターで泳ぐ自分の魚が拾った材料を町へ送るもので、20秒以上プレイするたびに1つ（1日6つまで）届きます。<b>🐠 自分の魚<\/b>はときどき町に遊びに来て、なでると水族館の仲良し度が上がります。","<b>🐠 수족관 공방<\/b>(📦 창고 아래)에서는 남는 재료로 내 수족관 전용 소품을 만들어요. <b>🐢 거북 배달소<\/b>를 지으면 <b>🐢 마을 택배<\/b> 거북이 수족관에 가끔 들러, 주민들이 촌장님께 고맙다며 모아 보낸 진주를 전해 줘요(하루 3번).":"<b>🐠 水族館工房<\/b>（📦 倉庫の下）では、余った材料で自分の水族館だけの小物を作れます。<b>🐢 カメ配達所<\/b>を建てると<b>🐢 町の宅配便<\/b>のカメが水族館にときどき寄って、住民たちが村長へのお礼に集めた真珠を届けてくれます（1日3回）。","이웃 바다 마을이 모자란 물건을 주문했어요 · 우리 마을이 만들어 창고에 모은 물건을 거북이 실어다 주면 물건값으로 진주를 받아요":"隣の海の村が足りない品を注文しました · 町で作って倉庫にためた品をカメが届けると代金として真珠がもらえます","팔 물건이 있어야 주문을 받아요 · 다시마 농장이나 산호 광산을 먼저 지어요":"売る品がないと注文は来ません · まず昆布農場かサンゴ鉱山を建てましょう","🚋 산 너머 광산 마을로 물건을 바꾸러 갔어요 · 돌아오기까지":"🚋 山向こうの鉱山の村へ品物を交換しに行きました · 戻るまで","주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요.":"住民が働いて得た真珠の一部を税金として納め、ここにたまります。","깊은 바닷속이라 물에 녹은 산소가 모자라요. 물고기는 펌프가 산소를 뿜는 둘레에서만 살 수 있어요.":"深い海の中なので水に溶けた酸素が足りません。魚はポンプが酸素を出す周りでしか暮らせません。","주민 일꾼들이 바닥의 산호석을 캐요. 남는 산호석은 주문으로 이웃 마을에 팔 수 있어요.":"住民の働き手が海底のサンゴ石を掘ります。余ったサンゴ石は注文で隣の村に売れます。","주민 일꾼들이 다시마를 길러요.":"住民の働き手が昆布を育てます。","짓기에 드는 진주는 이 게 일꾼들의 품삯과 재료값이에요.":"建設に使う真珠は、このカニ職人たちの手間賃と材料費です。","주민 일꾼이 만든 경단은 상점(상업 구역)으로 가서 주민들에게 팔려요.":"住民の働き手が作った団子は店(商業区画)に並び、住民に売られます。","만든 옷은 상점으로 가서 주민들에게 팔려요.":"作った服は店に並び、住民に売られます。","파는 물건은 우리 광산 · 농장 · 공장이 만들어 창고에 모아 둔 거예요.":"売る品は町の鉱山・農場・工場が作って倉庫にためたものです。","사 먹을 곳이 늘어야 더 많은 물고기가 끼니 걱정 없이 살 수 있어요.":"食べる場所が増えると、より多くの魚がごはんの心配なく暮らせます。","아이 물고기가 다닐 학교가 있어야 가족들이 이사 와요.":"子どもの魚が通える学校があると家族が引っ越してきます。","아플 때 갈 곳이 가까워야 큰 건물에 많이 모여 살 수 있어요.":"病院が近くにあってこそ、大きな建物に大勢で暮らせます。","바닥 틈에서 솟는 뜨거운 물을 거품으로 식혀 동네를 지켜요. 안전한 동네라야 집이 커져요.":"海底の割れ目から噴き出す熱い水を泡で冷やして町を守ります。安全な地域でこそ家が育ちます。","동네에 나타나는 상어를 쫓아내요. 상어 걱정이 없어야 높은 건물에 살아요.":"町に現れるサメを追い払います。サメの心配がないと高い建物に住めます。","주민 일꾼들이 산호석을 구워 벽돌을 만들어요.":"住民の働き手がサンゴ石を焼いてレンガを作ります。","열차가 우리 물건을 싣고 산 너머 광산 마을에 가서 벽돌 · 못과 바꿔 와요.":"列車が町の品物を積んで山向こうの鉱山の村へ行き、レンガ・釘と交換してきます。","구경 오는 손님들 덕에 둘레 땅값이 오르고, 내 수족관과 이어져요.":"見物客のおかげで周りの地価が上がり、自分の水族館とつながります。","우리 물건을 먼 바다 마을에 팔고, 그곳 특산품인 진주 못 · 보석을 사 와요.":"町の品を遠い海の村に売り、名産の真珠釘・宝石を買ってきます。","⚡ 아가미 파이터 한 판마다 공사 단축 15분 · 재료 상자에 든 연장 덕에 게 일꾼 일이 빨라져요":"⚡ アガミファイター1プレイごとに工事短縮15分 · 資材箱の道具でカニ職人の仕事が速くなります","축제를 열면 주민들이 광장에 모여 장을 보고, 신이 나서 일도 더 열심히 해요":"祭りを開くと住民が広場に集まって買い物をし、うきうきして仕事もはかどります","게 일꾼들이 말뚝을 박고 길을 내어 16×16칸 새 땅을 열어요 · 바위 · 덤불이 있어요":"カニ職人たちが杭を打ち道を通して16×16マスの新しい土地を開きます · 岩・茂みがあります","주민 대표들이 촌장님께 부탁하는 일이에요":"住民代表が村長に頼むことです","거북 배달소를 지으면 이웃 바다 마을에서 물건 주문이 들어와요. 거북이 실어다 주면 물건값으로 진주를 받아요":"カメ配達所を建てると隣の海の村から注文が来ます。カメが届けると代金として真珠がもらえます","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 구역 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"サンゴ宮のレベルが町の段階です。ほかの建物はサンゴ宮のレベルより高くできず、新しい建物 · 区域の段階 · 領地拡張がサンゴ宮のレベルに応じて解放されます。上げるには決まった建物レベルと人口が必要です。住民が働いて得た真珠の一部を税金として納め、ここにたまります。お店で買い物した人口が多く、幸せなほどたくさん集まります。","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 집 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정  밥으로":"Làm bánh viên từ tảo bẹ để nuôi cư dân","다시마로 옷을 지어요 (산호궁 Lv.5부터 필요)":"May quần áo từ tảo bẹ (cần từ Cung San Hô Lv.5)","다시마로 해초 옷을 지어요. 산호궁 Lv.5부터 주민이 옷도 사 입어야 행복해요. 열차 · 주문에도 쓰여요.":"May quần áo rong biển từ tảo bẹ. Từ Cung San Hô Lv.5, cư dân cần cả quần áo mới hạnh phúc. Cũng dùng cho tàu hỏa và đơn hàng.","다시마를 경단으로 만들어요. 주민은 상점에서 경단을 사 먹고, 경단이 떨어지면 배고파져 입주하지 않아요. 주문에도 쓰여요. 주변 땅값을 조금 내려요.":"Làm bánh viên từ tảo bẹ. Cư dân mua bánh ở cửa hàng; hết bánh là họ đói và không dọn vào nữa. Cũng dùng cho đơn hàng. Làm giá đất xung quanh giảm nhẹ.","다시마를 길러요 · 경단 · 옷의 재료":"Trồng tảo bẹ · nguyên liệu làm bánh viên và quần áo","다시마를 길러요. 경단 공장과 해초 공방이 다시마를 가져다 써요. 주문 · 열차에도 자주 나와요.":"Trồng tảo bẹ. Xưởng Bánh viên và Xưởng Rong biển lấy tảo bẹ để dùng. Thường xuất hiện trong đơn hàng và tàu hỏa.","따끈한 밥집이에요. 마을에 살 수 있는 인구를 늘리고 근처 땅값을 올려요.":"Quán ăn ấm cúng. Tăng giới hạn dân số và giá đất gần đó.","랜드마크 · 넓은 땅값 + · 인구 한도 +":"Công trình biểu tượng · Giá đất vùng rộng + · Giới hạn dân số +","마을의 중심 · 모든 건물과 단계를 열어요":"Trung tâm thị trấn · Mở khóa mọi công trình và cấp độ","모든 공사에 쓰는 산호석을 캐요. 말풍선을 눌러 받아요. 주변 땅값을 조금 내리니 주거 구역과 떨어뜨려 지어요.":"Khai thác Đá san hô dùng cho mọi công trình. Chạm bong bóng để nhận. Làm giá đất xung quanh giảm nhẹ, nên hãy xây xa khu Dân cư.","못":"Đinh","범위":"Phạm vi","범위 안 구역 건물이 3단계까지 자람":"Công trình khu trong phạm vi lớn đến Lv.3","범위 안 구역 건물이 4단계까지 자람":"Công trình khu trong phạm vi lớn đến Lv.4","산소 범위":"Phạm vi oxy","산소를 퍼뜨려 구역이 자랄 수 있게":"Tỏa oxy để các khu lớn lên được","산호석 4개를 구워 벽돌 1개를 만들어요. 산호궁 Lv.8부터 공사에 벽돌이 들어가요. 근처 땅값을 조금 내려요.":"Nung 4 Đá san hô thành 1 viên gạch. Từ Cung San Hô Lv.8, xây dựng cần có gạch. Làm giá đất gần đó giảm nhẹ.","산호석 · 벽돌 · 못 · 다시마 · 경단 · 옷을 담는 한도를 늘려요. 가득 차면 말풍선에 쌓인 채 기다려요.":"Tăng sức chứa Đá san hô, gạch, đinh, tảo bẹ, bánh viên và quần áo. Khi đầy, hàng sẽ chờ trong bong bóng.","산호석을 구워 벽돌로 · 8단계부터 필요":"Nung Đá san hô thành gạch · cần từ Lv.8","산호석을 캐요 · 거의 모든 공사 재료":"Khai thác Đá san hô · nguyên liệu của hầu hết công trình","상자":"Thùng","상자를 채워 고래 배를 먼 바다 마을로 보내요. 2시간 뒤 진주 못 · 보석 · 명성을 받고, 가끔 희귀 장식이 와요.":"Chất đầy thùng để đưa tàu cá voi đến thị trấn ở biển xa. Sau 2 giờ bạn nhận Đinh ngọc trai, Đá quý và Danh tiếng, đôi khi có trang trí hiếm.","아픈 물고기를 돌봐요. 인구 한도를 늘리고, 범위 안 구역 건물이 5단계로 자랄 수 있게 해요.":"Chăm sóc cá bị ốm. Tăng giới hạn dân số và cho công trình khu trong phạm vi lớn đến Lv.5.","열차 칸마다 물건을 실어 보내면 30분쯤 다녀와서 벽돌 · 못 · 명성을 줘요. 레벨 10에 4칸, 18에 5칸.":"Chất hàng lên từng toa, tàu đi khoảng 30 phút rồi mang về gạch, đinh và Danh tiếng. Lv.10 có 4 toa, Lv.18 có 5 toa.","열차 칸을 채워 보내면 벽돌 · 못":"Chất đầy toa tàu để nhận gạch · đinh","용왕 궁전이에요. 마을에서 가장 큰 랜드마크로 넓은 땅값과 인구 한도를 크게 올려요.":"Cung điện Long Vương. Công trình biểu tượng lớn nhất thị trấn, tăng mạnh giá đất vùng rộng và giới hạn dân số.","인구 한도 +":"Giới hạn dân số +","인구 한도 + · 근처 땅값 +":"Giới hạn dân số + · Giá đất gần đó +","인구 한도 + · 범위 안 5단계 건물":"Giới hạn dân số + · Công trình Lv.5 trong phạm vi","일꾼이 일자리를 다 채우면 최대 · 지금 일꾼 효율":"Tối đa khi đủ lao động cho mọi việc làm · Hiệu suất lao động hiện tại","재료를 담는 창고 크기를 늘려요":"Tăng sức chứa kho nguyên liệu","주문":"Đơn hàng","주문을 배달해 진주를 벌어요":"Giao đơn hàng để kiếm Ngọc trai","주민이 주문한 물건(다시마 · 산호석 · 경단 · 옷…)을 창고에서 꺼내 거북이 배달해요. 배달할 때마다 진주와 명성을 받아요. 세금과 함께 마을의 두 가지 수입이라, 생산 건물에서 받은 재료를 여기서 진주로 바꾼다고 생각하면 돼요. 레벨을 올리면 주문 칸이 늘어요(3~9칸).":"Rùa lấy hàng cư dân đặt (tảo bẹ, Đá san hô, bánh viên, quần áo…) từ kho đem giao. Mỗi lần giao bạn nhận Ngọc trai và Danh tiếng. Cùng với thuế, đây là hai nguồn thu của thị trấn, nên cứ xem như đổi nguyên liệu từ công trình sản xuất thành Ngọc trai. Nâng cấp để có thêm ô đơn (3~9 ô).","주변에 산소를 내보내요. 산소가 닿지 않는 구역에는 건물이 올라오지 않아요. 레벨을 올리면 범위가 넓어지고, 진주 양식장을 여는 조건이 돼요.":"Tỏa oxy ra xung quanh. Khu không có oxy thì không mọc công trình. Nâng cấp để mở rộng phạm vi, và là điều kiện để mở Trại Ngọc trai.","지금:":"Hiện:","진주와 진주 못을 조금씩 만들어요":"Làm ra từng chút Ngọc trai và Đinh ngọc trai","진주조개를 길러 진주를 조금씩 모으고, 14단계부터 쓰는 진주 못도 만들어요. 여기서 받은 진주는 아가미 파이터에서도 써요. 🛣 도로 탭 <b>🚋 선로 놓기<\/b>로 선로를 깔 수 있어요. ⚙ 기반의 <b>🚉 해류 열차 정거장<\/b>을 선로 옆에 놓고 다른 정거장(또는 열차역)과 이으면 트램이 오가고 둘레 5칸 길이 덜 막혀요.":"<b>🚋 Xe điện & phương tiện<\/b>: 🚌 xe buýt, 🐢 rùa giao hàng và 🦀 xe cua chạy trên đường của bạn và chậm lại kèm 💢 khi đường tắc. Khi đã xây Ga tàu Hải lưu (Cung San Hô Lv.9), dùng <b>🚋 Đặt ray<\/b> trong tab 🛣 Đường. Đặt <b>🚉 Trạm xe điện hải lưu<\/b> (⚙ Hạ tầng) cạnh ray và nối với trạm khác (hoặc ga): xe điện sẽ chạy và đường trong 5 ô bớt tắc.","<b>🛣 길 자동 연결<\/b>: 구역을 칠하고 손을 떼면 길에 안 닿은 칸까지 길을 깔아 줘요(한 칸 10🫧). 🏘 구역 탭에서 끌 수 있어요.":"<b>🛣 Tự nối đường<\/b>: khi nhấc tay sau khi tô khu, đường sẽ được thêm để mọi ô khu đều chạm đường (10🫧 mỗi ô). Tắt trong tab 🏘 Khu.","세율":"Thuế suất","올리면 진주가 더 들어오지만 그 구역 수요가 줄고(이사 · 가게 · 공방이 덜 생김) 행복이 내려가요 · 기본 9%":"Tăng thuế thì có thêm ngọc trai nhưng nhu cầu khu đó giảm (ít người chuyển đến, ít cửa hàng và xưởng hơn) và hạnh phúc giảm · mặc định 9%","수요 그대로":"Nhu cầu không đổi","물건값 ↑":"Giá cả ↑","<b>💰 세율<\/b>(☰ 메뉴): 산호궁 Lv.4부터 주거 · 상업 · 산업 세율을 0~20%로 정해요. 올리면 진주가 더 들어오지만 그 구역 수요가 줄고, 주거 · 상업 세금이 높으면 행복도 내려가요. 내리면 이사 오고 가게 · 공방이 잘 생겨요.":"<b>💰 Thuế suất<\/b> (☰ Menu): từ Cung San Hô Lv.4, đặt thuế Dân cư, Thương mại và Công nghiệp từ 0 đến 20%. Tăng thuế thì có thêm ngọc trai nhưng nhu cầu khu đó giảm, và thuế dân cư hoặc thương mại cao cũng làm giảm hạnh phúc. Giảm thuế thì có người chuyển đến, thêm cửa hàng và xưởng.","오늘의 마을 일":"Việc làng hôm nay","오늘의 일 3개 모두 끝내기":"Xong cả 3 việc hôm nay","광장":"Quảng trường","축제 · 기념물":"Lễ hội · Tượng đài","축제 중":"Đang lễ hội","축제 중이에요":"Lễ hội đang diễn ra","축제의 날":"Ngày lễ hội","축제의 날 열기":"Mở Ngày lễ hội","축제의 날! 1시간 동안 세금 2배 · 생산 1.5배":"Ngày lễ hội! Thuế ×2 · sản xuất ×1,5 trong 1 giờ","하루 한 번 · 1시간 동안 세금 2배 · 생산 1.5배 · 축제 방울 +15":"Mỗi ngày 1 lần · thuế ×2 và sản xuất ×1,5 trong 1 giờ · xu lễ hội +15","오늘은 이미 열었어요 · 내일 또 열 수 있어요":"Hôm nay đã mở rồi · mai mở lại được","산호 등대":"Hải đăng san hô","고래 뼈 아치":"Cổng xương cá voi","용궁 시계탑":"Tháp đồng hồ Long Cung","다 지었어요 ✨":"Đã xây xong ✨","다음 단계:":"Bậc tiếp theo:","👆 여기를 누르면 다시마 농장 → 경단 공장을 바로 지어요":"👆 Chạm vào đây để xây ngay trang trại tảo → xưởng bánh viên","👆 여기를 누르면 배달소를 바로 짓고, 다 지으면 주문판을 열어요":"👆 Chạm vào đây để xây ngay trạm giao hàng, xong rồi mở bảng đơn hàng","👆 여기를 누르면 바로 지어요":"👆 Chạm vào đây để xây ngay","끌면 화면 이동":"kéo để di chuyển màn hình","물고기가 살 <b>🏠 집 지을 땅<\/b>을 정해요":"Chọn <b>🏠 đất xây nhà<\/b> cho cá ở","👆 여기를 누르면 도로 옆 4칸을 바로 정해요 · 집은 물고기가 지어요":"👆 Chạm vào đây để chọn ngay 4 ô cạnh đường · nhà do cá tự xây","도로 옆 빈 땅이 없어요 · 직접 지정해 봐요":"Không còn đất trống cạnh đường · hãy tự chọn nhé","다 지어지면 다음 할 일을 알려 드릴게요":"Xây xong tôi sẽ báo việc tiếp theo","👆 여기를 누르면 산호궁 창을 열어요":"👆 Chạm vào đây để mở Cung San Hô","👆 누르면 집 지을 땅을 더 정해요 · 산소 · 경단이 있어야 와요":"👆 Chạm để chọn thêm đất · cá cần oxy và bánh viên","👆 여기를 누르면 그 건물 창을 열어요":"👆 Chạm vào đây để mở công trình đó","도미 비서 · 다음 할 일":"Thư ký Cá Tráp · Việc tiếp theo","이웃 바다 마을이 모자란 물건을 주문했어요 · 거북이 실어다 주면 물건값으로 진주를 받아요":"Các làng biển lân cận đặt món họ thiếu · rùa chở tới là được trả bằng ngọc trai","이웃 바다 마을에 물건을 팔아 진주를 벌어요":"Bán hàng cho làng biển lân cận để kiếm ngọc trai","거북 배달소를 지으면 이웃 바다 마을에서 물건 주문이 들어와요. 거북이 실어다 주면 물건값으로 진주를 받아요 · 🏛 산호궁 Lv.3에 열려요":"Xây trạm rùa để các làng biển lân cận đặt hàng. Rùa giao xong sẽ được trả ngọc trai · mở ở 🏛 Cung San Hô Lv.3","이웃 바다 마을들은 산호석 · 다시마 · 경단 · 옷이 늘 모자라요. 주문판에 필요한 물건이 올라오면 창고에서 꺼내 거북이 실어다 주고, 물건값으로 진주를 받아요(바닷속에선 진주가 돈이에요). 세금과 함께 마을의 두 가지 수입이라, 우리 마을이 만든 재료를 진주로 바꾸는 곳이에요.":"Các làng biển lân cận luôn thiếu đá san hô, tảo, bánh viên và quần áo. Khi có đơn, rùa chở hàng từ kho tới và họ trả bằng ngọc trai (dưới biển ngọc trai là tiền). Cùng với thuế, đây là một trong hai nguồn thu của làng — nơi đổi thứ làng làm ra thành ngọc trai.","<b>구역 = 물고기가 직접 짓는 땅<\/b>이에요. 🏠 주거엔 집, 🛍 상업엔 가게, 🔧 산업엔 공방이 생겨요. 도로 옆 칸을 손가락으로 쭉 끌면 끝 · 산소가 닿아야 지어요 · 한 칸 5🫧":"<b>Khu = đất cá tự xây<\/b>. 🏠 Dân cư thành nhà, 🛍 Thương mại thành cửa hàng, 🔧 Công nghiệp thành xưởng. Chỉ cần kéo dọc đường · cần có oxy · 5🫧 mỗi ô","<small>도미 비서 · 다음 할 일<\/small>":"<small>Thư ký Cá Tráp · Việc tiếp theo<\/small>","진주(바닷속 돈)로 게 일꾼에게 공사를 맡기고, 도로 옆에 집 지을 땅을 정해 주면 떠돌던 물고기들이 이사 와요. 마을 입구를 지난 물고기는 다리가 쑥 자라 주민이 돼요.":"Trả ngọc trai (tiền dưới biển) cho thợ cua xây dựng và chọn đất ở cạnh đường, đàn cá lang thang sẽ dọn tới. Cá đi qua cổng làng sẽ mọc chân và thành cư dân.","주민들은 광산 · 농장 · 공장에서 일해 재료를 만들어요. 건물 머리 위 동그란 말풍선(🪨 🌿 🫧)을 눌러 창고로 모으고, 그 재료로 건물을 올리거나 이웃 바다 마을에 팔아 진주를 벌어요.":"Cư dân làm việc ở mỏ, trang trại và xưởng để làm ra vật liệu. Chạm bong bóng tròn (🪨 🌿 🫧) trên công trình để gom vào kho, rồi dùng nâng cấp công trình hoặc bán cho làng biển lân cận lấy ngọc trai.","<b>🫧 진주<\/b>는 바닷속의 돈이에요. 아가미 파이터와 같은 지갑이라, 바다에서 모은 진주를 마을에서도 써요. 짓기에 드는 진주는 게 일꾼 품삯과 재료값이에요. <b>💎 보석<\/b>으로는 공사를 바로 끝내요(5분 이하는 무료).":"<b>🫧 Ngọc trai<\/b> là tiền dưới biển. Dùng chung ví với Gill Fighter nên ngọc trai nhặt ngoài biển dùng được trong làng. Ngọc trai khi xây là tiền công thợ cua và vật liệu. <b>💎 Đá quý<\/b> giúp xong công trình ngay (miễn phí khi còn dưới 5 phút).","<b>🔁 마을이 도는 순서<\/b>: 주민이 광산 · 농장 · 공장에서 일해 물건을 만들어요 → 창고에 모여요 → 🍡 경단 · 👕 옷은 상점으로 가서 주민이 사 먹고 입어요(그래야 행복해져 주택이 자라요) → 주민은 일해서 번 진주로 장을 보고 세금을 내요 → 남는 물건은 거북이 이웃 마을에 팔아 진주로 바꿔요.":"<b>🔁 Làng vận hành thế nào<\/b>: cư dân làm ở mỏ, trang trại, xưởng để làm ra hàng → hàng gom về kho → 🍡 bánh viên và 👕 quần áo lên cửa hàng cho cư dân mua (họ vui và nhà lớn lên) → cư dân dùng ngọc trai kiếm được để mua sắm và đóng thuế → hàng dư được rùa bán cho làng bên lấy ngọc trai.","<b>🧾 세금<\/b>은 주민이 일해서 번 진주 중 일부를 마을에 내는 거예요. 상점에서 장을 본 인구 × 행복만큼 🏛 산호궁에 쌓여요(8시간치까지). 산호궁 위 🫧 말풍선을 눌러 걷어요.":"<b>🧾 Thuế<\/b> là một phần ngọc trai cư dân kiếm được khi đi làm. Thuế tích ở 🏛 Cung San Hô theo số người mua sắm × độ vui (tối đa 8 giờ). Chạm bong bóng 🫧 trên Cung để thu.","<b>🐢 주문<\/b>은 이웃 바다 마을이 모자란 물건을 사겠다는 거예요. 우리 마을 광산 · 농장 · 공장이 만들어 창고에 모아 둔 물건을 거북이 실어다 주면 물건값으로 진주 · 명성을 받아요. 세금과 함께 마을의 두 가지 수입이에요. 명성 레벨마다 💎 선물이 있어요.":"<b>🐢 Đơn hàng<\/b> là các làng biển lân cận muốn mua thứ họ thiếu. Rùa chở hàng do mỏ, trang trại, xưởng của làng làm ra và cất trong kho, họ trả bằng ngọc trai và danh tiếng. Cùng với thuế là hai nguồn thu của làng. Mỗi cấp danh tiếng có quà 💎.","<b>📜 의뢰<\/b>는 주민 대표들이 촌장님께 부탁하는 일이에요. 산호궁 Lv.5부터 매주 월요일에 3개씩 와요. 하나에 🫧 진주, 셋 다 하면 💎 보석도 받아요.":"<b>📜 Nhờ vả<\/b> là việc đại diện cư dân nhờ trưởng làng. Từ Cung San Hô Lv.5, mỗi thứ Hai có 3 việc. Mỗi việc cho 🫧 ngọc trai, xong cả ba được thêm 💎 đá quý.","<b>📦 재료 상자<\/b>는 내 물고기가 아가미 파이터에서 바다를 헤엄치다 주운 재료를 마을로 보내는 거예요. 20초 넘게 한 판 할 때마다 1개씩(하루 6개) 와요. <b>🐠 내 물고기<\/b>는 가끔 마을에 놀러 오고, 쓰다듬으면 수족관 친밀도가 올라요.":"<b>📦 Thùng vật liệu<\/b> là đồ cá của bạn nhặt khi bơi trong Gill Fighter rồi gửi về làng — mỗi ván dài hơn 20 giây được 1 thùng (tối đa 6/ngày). <b>🐠 Cá của bạn<\/b> thỉnh thoảng đến chơi làng — vuốt ve để tăng độ thân thiết ở bể cá.","<b>🐠 수족관 공방<\/b>(📦 창고 아래)에서는 남는 재료로 내 수족관 전용 소품을 만들어요. <b>🐢 거북 배달소<\/b>를 지으면 <b>🐢 마을 택배<\/b> 거북이 수족관에 가끔 들러, 주민들이 촌장님께 고맙다며 모아 보낸 진주를 전해 줘요(하루 3번).":"Ở <b>🐠 Xưởng bể cá<\/b> (dưới 📦 Kho) bạn dùng nguyên liệu dư để làm đồ trang trí riêng cho bể cá. Khi xây <b>🐢 Trạm giao hàng Rùa<\/b>, rùa <b>🐢 Bưu kiện của làng<\/b> thỉnh thoảng ghé bể cá mang ngọc trai cư dân góp lại để cảm ơn trưởng làng (3 lần mỗi ngày).","이웃 바다 마을이 모자란 물건을 주문했어요 · 우리 마을이 만들어 창고에 모은 물건을 거북이 실어다 주면 물건값으로 진주를 받아요":"Các làng biển lân cận đặt món họ thiếu · rùa chở hàng làng mình làm ra và cất trong kho tới, họ trả bằng ngọc trai","팔 물건이 있어야 주문을 받아요 · 다시마 농장이나 산호 광산을 먼저 지어요":"Phải có hàng để bán mới nhận đơn · hãy xây trang trại tảo hoặc mỏ san hô trước","🚋 산 너머 광산 마을로 물건을 바꾸러 갔어요 · 돌아오기까지":"🚋 Đã sang làng mỏ bên kia núi đổi hàng · còn","주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요.":"Cư dân nộp một phần ngọc trai kiếm được làm thuế, và thuế tích ở đây.","깊은 바닷속이라 물에 녹은 산소가 모자라요. 물고기는 펌프가 산소를 뿜는 둘레에서만 살 수 있어요.":"Biển sâu nên nước thiếu oxy. Cá chỉ sống được quanh nơi máy bơm tỏa oxy.","주민 일꾼들이 바닥의 산호석을 캐요. 남는 산호석은 주문으로 이웃 마을에 팔 수 있어요.":"Cư dân làm thợ đào đá san hô dưới đáy. Đá dư có thể bán cho làng bên qua đơn hàng.","주민 일꾼들이 다시마를 길러요.":"Cư dân làm thợ trồng tảo.","짓기에 드는 진주는 이 게 일꾼들의 품삯과 재료값이에요.":"Ngọc trai bỏ ra khi xây là tiền công và vật liệu của các thợ cua này.","주민 일꾼이 만든 경단은 상점(상업 구역)으로 가서 주민들에게 팔려요.":"Bánh viên cư dân làm ra được đưa lên cửa hàng (khu thương mại) bán cho cư dân.","만든 옷은 상점으로 가서 주민들에게 팔려요.":"Quần áo làm ra được đưa lên cửa hàng bán cho cư dân.","파는 물건은 우리 광산 · 농장 · 공장이 만들어 창고에 모아 둔 거예요.":"Hàng bán là thứ mỏ, trang trại, xưởng của làng làm ra và cất trong kho.","사 먹을 곳이 늘어야 더 많은 물고기가 끼니 걱정 없이 살 수 있어요.":"Thêm chỗ ăn thì nhiều cá hơn sống được mà không lo bữa.","아이 물고기가 다닐 학교가 있어야 가족들이 이사 와요.":"Có trường cho cá con thì các gia đình mới dọn tới.","아플 때 갈 곳이 가까워야 큰 건물에 많이 모여 살 수 있어요.":"Có bệnh viện gần thì cá mới dám sống đông trong nhà lớn.","바닥 틈에서 솟는 뜨거운 물을 거품으로 식혀 동네를 지켜요. 안전한 동네라야 집이 커져요.":"Dùng bọt làm nguội nước nóng phun từ khe đáy biển. Nhà chỉ lớn ở khu an toàn.","동네에 나타나는 상어를 쫓아내요. 상어 걱정이 없어야 높은 건물에 살아요.":"Đuổi cá mập. Hết lo cá mập thì cá mới ở nhà cao tầng.","주민 일꾼들이 산호석을 구워 벽돌을 만들어요.":"Cư dân làm thợ nung đá san hô thành gạch.","열차가 우리 물건을 싣고 산 너머 광산 마을에 가서 벽돌 · 못과 바꿔 와요.":"Tàu chở hàng của làng sang làng mỏ bên kia núi đổi lấy gạch và đinh.","구경 오는 손님들 덕에 둘레 땅값이 오르고, 내 수족관과 이어져요.":"Nhờ khách tham quan mà giá đất quanh tăng, và nối với bể cá của bạn.","우리 물건을 먼 바다 마을에 팔고, 그곳 특산품인 진주 못 · 보석을 사 와요.":"Bán hàng của làng cho làng biển xa và mua đặc sản ở đó là đinh ngọc trai, đá quý.","⚡ 아가미 파이터 한 판마다 공사 단축 15분 · 재료 상자에 든 연장 덕에 게 일꾼 일이 빨라져요":"⚡ Mỗi ván Gill Fighter rút ngắn xây 15 phút · dụng cụ trong thùng vật liệu giúp thợ cua làm nhanh hơn","축제를 열면 주민들이 광장에 모여 장을 보고, 신이 나서 일도 더 열심히 해요":"Mở lễ hội thì cư dân tụ ở quảng trường mua sắm, vui vẻ làm việc hăng hơn","게 일꾼들이 말뚝을 박고 길을 내어 16×16칸 새 땅을 열어요 · 바위 · 덤불이 있어요":"Thợ cua đóng cọc, mở đường cho mảnh đất mới 16×16 ô · Có đá và bụi rậm","주민 대표들이 촌장님께 부탁하는 일이에요":"Việc đại diện cư dân nhờ trưởng làng","거북 배달소를 지으면 이웃 바다 마을에서 물건 주문이 들어와요. 거북이 실어다 주면 물건값으로 진주를 받아요":"Xây trạm rùa để các làng biển lân cận đặt hàng. Rùa giao xong sẽ được trả ngọc trai","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 구역 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"Cấp Cung San Hô là cấp độ của thị trấn. Công trình khác không thể cao cấp hơn Cung San Hô; công trình mới, cấp khu và mở rộng lãnh thổ đều mở theo cấp Cung San Hô. Muốn nâng cấp cần đủ cấp công trình và dân số. Cư dân nộp một phần ngọc trai kiếm được làm thuế, và thuế tích ở đây. Càng nhiều cư dân mua sắm và càng hạnh phúc thì thu càng nhiều.","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 집 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민들이 일해서 번 진주 중 일부를 세금으로 내면 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"Cấp Cung San Hô là cấp độ của thị trấn. Công trình khác không thể cao cấp hơn Cung San Hô; công trình mới, cấp nhà và mở rộng lãnh thổ đều mở theo cấp Cung San Hô. Muốn nâng cấp cần đủ cấp công trình và dân số. Cư dân nộp một phần ngọc trai kiếm được làm thuế, và thuế tích ở đây. Càng nhiều cư dân mua sắm và càng hạnh phúc thì thu càng nhiều.","산소를 퍼뜨려 집을 지을 수 있게":"Tỏa oxy để xây được nhà","주변에 산소를 내보내요. 산소가 닿지 않는 곳에는 집 · 가게 · 공방을 못 지어요. 레벨을 올리면 범위가 넓어지고, 진주 양식장을 여는 조건이 돼요.":"Tỏa oxy ra xung quanh. Nơi không có oxy thì không xây được nhà, cửa hàng, xưởng. Nâng cấp để mở rộng phạm vi, và là điều kiện để mở Trại Ngọc trai.","모든 공사에 쓰는 산호석을 캐요. 말풍선을 눌러 받아요. 주변 땅값을 조금 내리니 집과 떨어뜨려 지어요.":"Khai thác Đá san hô dùng cho mọi công trình. Chạm bong bóng để nhận. Làm giá đất xung quanh giảm nhẹ, nên hãy xây xa nhà ở.","아픈 물고기를 돌봐요. 인구 한도를 늘리고, 범위 안 집 · 가게 · 공방이 5단계로 자랄 수 있게 해요.":"Chăm sóc cá bị ốm. Tăng giới hạn dân số và cho nhà, cửa hàng, xưởng trong phạm vi lớn đến Lv.5.","범위 안 집 · 가게 · 공방이 3단계까지 자람":"Nhà, cửa hàng, xưởng trong phạm vi lớn đến Lv.3","범위 안 집 · 가게 · 공방이 4단계까지 자람":"Nhà, cửa hàng, xưởng trong phạm vi lớn đến Lv.4","해마 순찰대예요. 범위 안에 있는 집 · 가게 · 공방이 4단계(고층)로 자랄 수 있어요.":"Đội tuần tra Cá Ngựa. Nhà, cửa hàng, xưởng trong phạm vi có thể lớn đến Lv.4 (cao tầng).","주민 일꾼이 만든 경단은 가게로 가서 주민들에게 팔려요.":"Bánh viên cư dân làm ra được đưa lên cửa hàng bán cho cư dân.","산소 · 집을 지을 수 있는 범위":"Oxy · Phạm vi xây được nhà","건물 · 집 · 가게는 도로에 붙어야 돌아가요. 도로끼리 이어지면 모양이 저절로 맞춰져요.":"Công trình, nhà và cửa hàng phải sát đường mới hoạt động. Đường nối nhau sẽ tự khớp hình.","👷 일꾼이 모자라요 · 집을 더 지어요":"👷 Thiếu lao động · Xây thêm nhà","🛍 가게가 모자라요 · 짓기 → 🏠 집 · 가게":"🛍 Thiếu cửa hàng · Xây → 🏠 Nhà · Cửa hàng","🏠 집 · 가게":"🏠 Nhà · Cửa hàng","🏠 집":"🏠 Nhà","🛍 가게":"🛍 Cửa hàng","🔧 공방":"🔧 Xưởng","🧽 헐기":"🧽 Phá bỏ","물고기가 살아요 · 인구 +":"Cá ở đây · dân số +","주민이 경단 · 옷을 사요 · 세금 +":"Cư dân mua bánh viên, quần áo · thuế +","일자리 + · 생산이 빨라져요":"Việc làm + · sản xuất nhanh hơn","▲ 더 필요해요":"▲ Cần thêm","▼ 넘쳐요":"▼ Thừa","– 적당해요":"– Vừa đủ","놓으면 물고기들이 와서 지어요 · 도로 옆 · 산소가 닿는 곳 · ✓를 계속 누르면 옆에 한 채씩 더 지어요 · 다 지은 뒤엔 저절로 커져요":"Đặt xuống là cá đến xây · cạnh đường · nơi có oxy · nhấn ✓ tiếp để xây thêm bên cạnh · xây xong sẽ tự lớn","산소가 안 닿아요 · 산소 펌프 가까이에 지어요":"Không có oxy · xây gần máy bơm oxy","여기에 지을 수 있어요 · 끌거나 다른 칸을 눌러 옮겨요 · ✓를 또 누르면 옆에 한 채 더":"Xây được ở đây · kéo hoặc chạm ô khác để dời · nhấn ✓ lần nữa để xây thêm bên cạnh","도로 옆 · 산소가 닿는 빈 땅이 없어요 · 산소 펌프 · 도로를 먼저 놓아요":"Không còn đất trống cạnh đường có oxy · hãy đặt máy bơm oxy hoặc đường trước","물고기가 살 <b>🏠 집<\/b>을 4채 지어요":"Xây 4 <b>🏠 ngôi nhà<\/b> cho cá ở","👆 여기를 누르면 도로 옆에 집 4채를 바로 지어요 · 짓는 건 물고기들이 해요":"👆 Chạm vào đây để xây ngay 4 ngôi nhà cạnh đường · cá sẽ tự xây","👆 누르면 집을 더 지어요 · 산소 · 경단이 있어야 이사 와요":"👆 Chạm để xây thêm nhà · cá cần oxy và bánh viên mới dọn tới","<b>🏠 집 · 🛍 가게 · 🔧 공방<\/b>은 🔨 짓기 → 🏠 집 · 가게에서 건물처럼 놓으면 물고기들이 와서 지어요. 도로 옆, 산소 펌프의 산소가 닿는 곳이어야 해요. 다 지으면 땅값 · 행복에 따라 저절로 커져요.":"<b>🏠 Nhà · 🛍 Cửa hàng · 🔧 Xưởng<\/b>: đặt như công trình từ 🔨 Xây → 🏠 Nhà · Cửa hàng là cá đến xây. Cần cạnh đường và có oxy từ máy bơm. Xây xong sẽ tự lớn theo giá đất và độ vui.","<b>🌫 탁한 물<\/b>: 광산 · 가마 · 공장 · 공방 · 항구 둘레의 물이 흐려져요. 집 근처가 탁하면 입주가 줄고 행복이 내려가며, 집 3단계는 40 · 4단계는 25 · 5단계는 15 이하여야 자라요. ⚙ 기반의 <b>🫧 물 거르개<\/b>를 여러 개 지어 맑게 하고, 🗺 지도에서 확인해요.":"<b>🌫 Nước đục<\/b>: nước quanh mỏ, lò, nhà máy, xưởng và cảng bị đục. Gần nhà mà đục thì ít cư dân hơn và giảm hạnh phúc; nhà cấp 3 cần từ 40 trở xuống, cấp 4 là 25, cấp 5 là 15. Xây nhiều <b>🫧 Máy lọc nước<\/b> ở ⚙ Hạ tầng và xem trên 🗺 bản đồ.","<b>💨 숨샘 · 큰 숨탑<\/b>(⚙ 기반)은 여러 개 지을 수 있어요. 산소 펌프만으로 모자란 곳에 놓아 집을 지을 수 있는 범위를 넓혀요.":"<b>💨 Suối thở · Tháp thở lớn<\/b> (⚙ Hạ tầng) xây được nhiều cái. Đặt ở nơi Máy bơm oxy không tới để mở rộng vùng xây được nhà.","<b>🚦 교통<\/b>: 집 · 가게 · 공방 · 일터가 몰린 길은 막혀요. 막힌 길 옆은 생산 · 입주 · 행복이 줄고, 집 · 가게 · 공방 4단계부터는 길이 안 막혀야 자라요. 🛣 도로 탭 <b>⬆ 길 넓히기<\/b>로 자갈길(Lv.5) · 산호 대로(Lv.12)를 깔거나, ⚙ 기반의 <b>🚌 해류 버스 정류장<\/b>을 놓아요. 🗺 지도 → 교통으로 확인해요.":"<b>🚦 Giao thông<\/b>: đường có nhiều nhà, cửa hàng, xưởng và nơi làm sẽ bị tắc. Cạnh đường tắc thì sản xuất, người chuyển đến và hạnh phúc giảm, và nhà, cửa hàng, xưởng từ cấp 4 trở lên cần đường không tắc. Dùng <b>⬆ Mở rộng đường<\/b> ở tab 🛣 Đường để làm đường sỏi (Lv.5) và đại lộ san hô (Lv.12), hoặc đặt <b>🚌 Trạm xe buýt hải lưu<\/b> ở ⚙ Hạ tầng. Xem ở 🗺 Bản đồ → Giao thông.","🏠 집 ":"🏠 Nhà ","🛍 가게 ":"🛍 Cửa hàng ","🔧 공방 ":"🔧 Xưởng ","진주(바닷속 돈)로 게 일꾼에게 공사를 맡기고, 도로 옆에 집을 지어 주면 떠돌던 물고기들이 이사 와요. 마을 입구를 지난 물고기는 다리가 쑥 자라 주민이 돼요.":"Trả ngọc trai (tiền dưới biển) cho thợ cua xây dựng và xây nhà cạnh đường, đàn cá lang thang sẽ dọn tới. Cá đi qua cổng làng sẽ mọc chân và thành cư dân.","🐟 물고기들이 집을(를) 짓기 시작했어요":"🐟 Cá đã bắt đầu xây nhà","🏠 집 짓기":"🏠 Xây nhà","🐟 물고기들이 가게을(를) 짓기 시작했어요":"🐟 Cá đã bắt đầu xây cửa hàng","🛍 가게 짓기":"🛍 Xây cửa hàng","🐟 물고기들이 공방을(를) 짓기 시작했어요":"🐟 Cá đã bắt đầu xây xưởng","🔧 공방 짓기":"🔧 Xây xưởng","🦀 게 일꾼들이 짓는 중":"🦀 Thợ cua đang xây","👆 여기를 누르면 게 일꾼들이 도로 옆에 집 4채를 바로 지어요":"👆 Chạm vào đây, thợ cua sẽ xây ngay 4 nhà cạnh đường","놓으면 게 일꾼들이 와서 지어요(다른 공사와 따로라 일꾼 수에 안 걸려요) · 도로 옆 · 산소가 닿는 곳 · ✓를 계속 누르면 옆에 한 채씩 더 · 다 지은 뒤엔 저절로 커져요":"Đặt xuống là thợ cua đến xây (đội riêng nên không tính vào số thợ) · cạnh đường · nơi có oxy · nhấn ✓ tiế '</defs>';
function S(p){return ' stroke="'+p.out+'" stroke-width="'+p.sw+'" stroke-linejoin="round" stroke-linecap="round"'}
/* 아이소 상자: 바닥 마름모 중심(cx,cy), 가로 반폭 a, 높이 h */
function box(p,cx,cy,a,h,T,L,R){var b=a/2;return ''+
  '<path d="M'+(cx-a)+','+(cy-h)+' L'+cx+','+(cy+b-h)+' L'+cx+','+(cy+b)+' L'+(cx-a)+','+cy+'Z" fill="'+L+'"'+S(p)+'/>'+
  '<path d="M'+(cx+a)+','+(cy-h)+' L'+cx+','+(cy+b-h)+' L'+cx+','+(cy+b)+' L'+(cx+a)+','+cy+'Z" fill="'+R+'"'+S(p)+'/>'+
  '<path d="M'+cx+','+(cy-b-h)+' L'+(cx+a)+','+(cy-h)+' L'+cx+','+(cy+b-h)+' L'+(cx-a)+','+(cy-h)+'Z" fill="'+T+'"'+S(p)+'/>'}
/* 왼쪽 · 오른쪽 벽면에 붙여 그리기(기울인 좌표) */
function faceL(cx,cy,a,inner){return '<g transform="matrix(1,0.5,0,1,'+(cx-a)+','+cy+')">'+inner+'</g>'}
function faceR(cx,cy,a,inner){return '<g transform="matrix(1,-0.5,0,1,'+cx+','+(cy+a/2)+')">'+inner+'</g>'}
function archWin(p,x,y,w,h){var r=w/2;return '<path d="M'+x+','+y+' L'+x+','+(y-h+r)+' A'+r+','+r+' 0 0 1 '+(x+w)+','+(y-h+r)+' L'+(x+w)+','+y+'Z" fill="'+p.win+'"'+S(p)+'/>'+
  (p.bp?'':'<path d="M'+(x+w*.28)+','+(y-3)+' L'+(x+w*.28)+','+(y-h+r)+'" stroke="'+p.winHi+'" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>')}
function roundWin(p,x,y,r){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+p.win+'"'+S(p)+'/>'+(p.bp?'':'<circle cx="'+(x-r*.3)+'" cy="'+(y-r*.3)+'" r="'+r*.32+'" fill="'+p.winHi+'" opacity=".85"/>')}
function cyl(p,cx,cy,r,h,fill){var e=r/2;return '<path d="M'+(cx-r)+','+(cy-h)+' L'+(cx-r)+','+cy+' A'+r+','+e+' 0 0 0 '+(cx+r)+','+cy+' L'+(cx+r)+','+(cy-h)+'Z" fill="'+fill+'"'+S(p)+'/>'+
  '<ellipse cx="'+cx+'" cy="'+(cy-h)+'" rx="'+r+'" ry="'+e+'" fill="'+(p.bp?p.flat:'#e9fffb')+'"'+S(p)+'/>'}
function bands(p,cx,cy,r,h,n){if(p.bp)return '';var s='';for(var i=1;i<=n;i++){var y=cy-h*i/(n+1);s+='<path d="M'+(cx-r)+','+y+' A'+r+','+(r/2)+' 0 0 0 '+(cx+r)+','+y+'" fill="none" stroke="'+OUT+'" stroke-width="1.4" opacity=".35"/>'}return s}
function cone(p,cx,cy,r,h,fill){return '<path d="M'+(cx-r)+','+cy+' A'+r+','+(r/2)+' 0 0 0 '+(cx+r)+','+cy+' L'+cx+','+(cy-h)+'Z" fill="'+(p.bp?'none':(fill||p.roof))+'"'+S(p)+'/>'}
function shellDome(p,cx,cy,r,h,ribs,fill,rc){var s='<path d="M'+(cx-r)+','+cy+' C'+(cx-r)+','+(cy-h*1.05)+' '+(cx+r)+','+(cy-h*1.05)+' '+(cx+r)+','+cy+' A'+r+','+(r/2)+' 0 0 1 '+(cx-r)+','+cy+'Z" fill="'+(p.bp?'none':(fill||p.gold))+'"'+S(p)+'/>';
  if(!p.bp)for(var i=1;i<ribs;i++){var t=i/ribs,x=cx-r+2*r*t,yb=cy+Math.sin(Math.PI*t)*r/2*.92;s+='<path d="M'+x+','+yb+' Q'+(cx+(x-cx)*.55)+','+(cy-h*.55)+' '+cx+','+(cy-h*.8)+'" fill="none" stroke="'+(rc||'#b86d10')+'" stroke-width="1.6" opacity=".55"/>'}
  return s}
function pearl(p,x,y,r,glow,fill){return (p.bp||!glow?'':'<circle cx="'+x+'" cy="'+y+'" r="'+r*2.6+'" fill="url(#gGlow)"/>')+'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(p.bp?'none':(fill||p.pearl))+'"'+S(p)+'/>'}
function flag(p,x,y,h,c){return '<path d="M'+x+','+y+' L'+x+','+(y-h)+'" stroke="'+p.out+'" stroke-width="2.4"/>'+
  '<path d="M'+x+','+(y-h)+' Q'+(x+14)+','+(y-h-5)+' '+(x+26)+','+(y-h+2)+' Q'+(x+14)+','+(y-h+7)+' '+x+','+(y-h+13)+'Z" fill="'+(p.bp?'none':c||p.flag)+'"'+S(p)+'/>'}
function coral(p,x,y,s,c){if(p.bp)return '';var d='M'+x+','+y+' L'+x+','+(y-26*s)+' M'+x+','+(y-12*s)+' Q'+(x-12*s)+','+(y-16*s)+' '+(x-13*s)+','+(y-30*s)+' M'+x+','+(y-18*s)+' Q'+(x+11*s)+','+(y-20*s)+' '+(x+12*s)+','+(y-34*s)+' M'+x+','+(y-26*s)+' L'+(x-3*s)+','+(y-38*s);
  return '<path d="'+d+'" fill="none" stroke="'+OUT+'" stroke-width="'+(9*s+3)+'" stroke-linecap="round"/><path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+9*s+'" stroke-linecap="round"/>'}
function kelp(p,x,y,h){if(p.bp)return '';var d='M'+x+','+y+' C'+(x-9)+','+(y-h*.3)+' '+(x+9)+','+(y-h*.6)+' '+(x-2)+','+(y-h);
  return '<path d="'+d+'" fill="none" stroke="'+OUT+'" stroke-width="9" stroke-linecap="round"/><path d="'+d+'" fill="none" stroke="'+p.kelp+'" stroke-width="5.5" stroke-linecap="round"/>'}
function stones(p,cx,cy,a,h){if(p.bp)return '';var s='',b=a/2,i;/* 돌 줄눈 */
  for(i=1;i<4;i++){var t=i/4;s+='<path d="M'+(cx-a+a*t)+','+(cy-h+b*t)+' L'+(cx-a+a*t)+','+(cy+b*t)+'" stroke="'+OUT+'" stroke-width="1.2" opacity=".25"/>';
    s+='<path d="M'+(cx+a*t)+','+(cy+b-h-b*t)+' L'+(cx+a*t)+','+(cy+b-b*t)+'" stroke="'+OUT+'" stroke-width="1.2" opacity=".25"/>'}return s}
function steps(p,cx,cy,hb){var s='';for(var i=0;i<3;i++){var w=26-i*0,y=cy+hb*.55-i*hb/3;s+='<path d="M'+(cx+30-i*6)+','+(y+4)+' l'+w+',-13 l8,4 l-'+w+',13Z" fill="'+(p.bp?p.flat:p.stoneL)+'"'+S(p)+'/>'}return s}


/* 산호궁 Lv.1~25: 레벨마다 하나씩 더해지는 모습 */
function crenel(p,cx,cy,r){if(p.bp)return '';var s='';for(var i=0;i<5;i++){var t=i/4,x=cx-r+2*r*t,y=cy+Math.sin(Math.PI*t)*r/2*.9;s+='<rect x="'+(x-4)+'" y="'+(y-9)+'" width="8" height="9" rx="1.5" fill="#e9fffb"'+S(p)+'/>'}return s}
function jelly(p,x,y,c){if(p.bp)return '';return '<g transform="translate('+x+','+y+') scale(1.8) translate('+(-x)+','+(-y)+')"><circle cx="'+x+'" cy="'+y+'" r="16" fill="url(#gGlow)"/>'+
  '<path d="M'+(x-9)+','+y+' Q'+(x-9)+','+(y-13)+' '+x+','+(y-13)+' Q'+(x+9)+','+(y-13)+' '+(x+9)+','+y+'Z" fill="'+c+'"'+S(p)+'/>'+
  '<path d="M'+(x-5)+','+y+' q-2,7 1,12 M'+x+','+y+' q2,7 -1,13 M'+(x+5)+','+y+' q-2,7 1,11" fill="none" stroke="'+OUT+'" stroke-width="1.6"/></g>'}
function crown(p,cx,y,w){if(p.bp)return '';var d='M'+(cx-w)+','+y+' L'+(cx-w)+','+(y-12)+' L'+(cx-w/2)+','+(y-5)+' L'+cx+','+(y-18)+' L'+(cx+w/2)+','+(y-5)+' L'+(cx+w)+','+(y-12)+' L'+(cx+w)+','+y+'Z';
  return '<path d="'+d+'" fill="url(#gGoldRoof)"'+S(p)+'/>'+'<circle cx="'+cx+'" cy="'+(y-18)+'" r="3.5" fill="#ff6f8f"'+S(p)+'/>'}
function gate(p,cx,cy){if(p.bp)return '';var c='#ff8fa3',l=cx-34,r=cx+34;
  return '<path d="M'+l+','+cy+' L'+l+','+(cy-40)+' Q'+cx+','+(cy-78)+' '+r+','+(cy-40)+' L'+r+','+cy+'" fill="none" stroke="'+OUT+'" stroke-width="12" stroke-linecap="round"/>'+
    '<path d="M'+l+','+cy+' L'+l+','+(cy-40)+' Q'+cx+','+(cy-78)+' '+r+','+(cy-40)+' L'+r+','+cy+'" fill="none" stroke="'+c+'" stroke-width="7.5" stroke-linecap="round"/>'+
    '<circle cx="'+cx+'" cy="'+(cy-59)+'" r="5" fill="url(#gPearl)"'+S(p)+'/>'}
function tower(p,L,x,y,r,h,flagC){var g=cyl(p,x,y,r,h,p.teal);if(L>=16)g+=bands(p,x,y,r,h,3);
  g+=roundWin(p,x,y-h*.55,Math.max(5,r*.3));if(L>=13)g+=roundWin(p,x,y-h*.28,Math.max(5,r*.28));
  if(L>=9){var rf=L>=20?'url(#gGoldRoof)':null;g+=cone(p,x,y-h,r+5,r*2.2,rf);var tip=y-h-r*2.2;
    if(L>=22)g+=pearl(p,x,tip-4,5,L>=19);else if(L>=17)g+=flag(p,x,tip,24,flagC||'#ffd54a')}
  else g+=crenel(p,x,y-h,r);
  return g}
function palaceL(L,bp){var p=pal(bp),g='',cx=GX,cy=GY;if(L>=25&&!bp){p.wallT='#fdfaff';p.wallL='#efe6ff';p.wallR='#c9b6f0'}
  if(L>=25&&!bp)g+='<ellipse cx="'+cx+'" cy="'+(cy-190)+'" rx="170" ry="170" fill="url(#gGlow)" opacity=".55"/>';
  var baseA=L>=3?100+Math.min(L,22)*1.8:0,baseH=L>=3?10+L*.55:0;
  if(L>=6)g+=kelp(p,cx-150,cy+8,44+L)+kelp(p,cx+142,cy+10,40+L);
  if(L>=21)g+=box(p,cx,cy+10,baseA+22,10,p.bp?p.flat:'#e7f0f8',p.bp?p.flat:'#cfdcec',p.bp?p.flat:'#a9bbd3'); /* 바깥 테라스 */
  if(baseA)g+=box(p,cx,cy,baseA,baseH,p.stoneT,p.stoneL,p.stoneR)+stones(p,cx,cy,baseA,baseH);
  var y1=cy-baseH,ba=58+Math.min(L,20)*1.6,bh=50+L*1.4,th=74+L*3.4,tr=15+L*.35;

  var fl='',fr='';

  if(L>=13){fl='';var n=3;for(var i=0;i<n;i++)fl+=archWin(p,ba*(.12+i*.28),-10,ba*.17,bh*.42);fl+=roundWin(p,ba*.3,-bh*.75,7)+roundWin(p,ba*.66,-bh*.75,7)}
  fl+='<path d="M0,'+(-bh+8)+' L'+ba+','+(-bh+8)+'" stroke="'+trim+'" stroke-width="'+(L>=11?4:3)+'"/>';
  var dw=Math.min(40,22+L*.8),dh=Math.min(62,36+L*1.2);
  fr+=archWin(p,ba*.28,0,dw,dh).replace(p.win,p.bp?p.win:p.door);

  g+=faceL(cx,y1,ba,fl)+faceR(cx,y1,ba,fr);
