  if(L>=24){g+=jelly(p,cx-ba-40,top-20,'#ffc3ec')+jelly(p,cx+ba+42,top-40,'#c3ecff')+jelly(p,cx-74,top-dh2-70,'#fff0a8')}
  if(L>=25&&!bp)for(var k=0;k<8;k++){var a=k/8*Math.PI*2,rx=cx+Math.cos(a)*120,ry=top-40+Math.sin(a)*40;g+='<path d="M'+rx+','+(ry-6)+' Q'+rx+','+ry+' '+(rx+6)+','+ry+' Q'+rx+','+ry+' '+rx+','+(ry+6)+' Q'+rx+','+ry+' '+(rx-6)+','+ry+' Q'+rx+','+ry+' '+rx+','+(ry-6)+'Z" fill="#fff6c0"/>'}

/* 건물 그림 17종 — 같은 그림체(외곽선 · 면 밝기 3단 · 그라데이션). 좌표: 땅 중심(GX,GY), 1칸 반폭 48 */
function sp(p,c){return p.bp?p.flat||'none':c}
function star(p,x,y,r,c){var d='';for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;d+=(i?'L':'M')+(x+Math.cos(a)*rr).toFixed(1)+','+(y+Math.sin(a)*rr).toFixed(1)}return '<path d="'+d+'Z" fill="'+sp(p,c)+'"'+S(p)+'/>'}
function sign(p,x,y,w,h,c,txt){return '<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="5" fill="'+sp(p,c)+'"'+S(p)+'/>'+(p.bp||!txt?'':'<text x="'+x+'" y="'+(y+h*.22)+'" font-size="'+h*.62+'" text-anchor="middle" font-family="sans-serif">'+txt+'</text>')}
function plat(p,a,h,c){return box(p,GX,GY,a,h,sp(p,c[0]),sp(p,c[1]),sp(p,c[2]))}
var STONE=['#f6f9fd','#e2eaf5','#bccbe0'],SAND=['#f7ecd6','#ead8b8','#cdb58f'],SOIL=['#b98b62','#9e734f','#7d583b'];
function bubblesUp(p,x,y,n){if(p.bp)return '';var s='';for(var i=0;i<n;i++)s+='<circle cx="'+(x+(i%2?5:-3))+'" cy="'+(y-i*12)+'" r="'+(3+i)+'" fill="none" stroke="#e8fbff" stroke-width="1.8" opacity=".85"/>';return s}
function lvlDeco(p,L,x,y){var s='';if(L>=10)s+=flag(p,x,y,22,L>=20?'#ffd54a':'#ff5d5d');if(L>=15&&!p.bp)s+='<circle cx="'+x+'" cy="'+(y-26)+'" r="14" fill="url(#gGlow)"/>';return s}
var ART_B={
 pump:function(p,L){var cx=GX,cy=GY,h=46+L*1.2,g=plat(p,40,10,STONE);var y=cy-10;
   g+=cyl(p,cx,y,18,h,sp(p,'url(#gTeal)'))+bands(p,cx,y,18,h,2);
   g+='<rect x="'+(cx-9)+'" y="'+(y-h+8)+'" width="18" height="'+(h-18)+'" rx="8" fill="'+sp(p,'rgba(220,250,255,.75)')+'"'+S(p)+'/>'+bubblesUp(p,cx,y-14,3);
   g+=cone(p,cx,y-h,22,18,sp(p,'url(#gTeal)'));if(L>=10)g+=bubblesUp(p,cx+2,y-h-22,3);return {svg:g,top:y-h-40}},
 quarry:function(p,L){var cx=GX,cy=GY,g=plat(p,90,8,SAND),y=cy-8,s='';

   g+='<path d="M'+(cx+44)+','+(y+12)+' L'+(cx+44)+','+(y-52)+' L'+(cx+70)+','+(y-40)+'" fill="none" stroke="'+OUT+'" stroke-width="7"/><path d="M'+(cx+44)+','+(y+12)+' L'+(cx+44)+','+(y-52)+' L'+(cx+70)+','+(y-40)+'" fill="none" stroke="'+sp(p,'#d9995a')+'" stroke-width="4"/>';
   if(L>=10)g+='<rect x="'+(cx+58)+'" y="'+(y-38)+'" width="16" height="12" rx="2" fill="'+sp(p,'#9aa6b8')+'"'+S(p)+'/>';

   for(var f=0;f<5;f++){var t=f/4;g+='<rect x="'+(cx-90+t*90-2)+'" y="'+(y+t*45-16)+'" width="5" height="16" fill="'+sp(p,'#d9995a')+'"'+S(p)+'/>'}

var GV={kelp:1,stone:1,dango:3,cloth:4,brick:6,nail:15},GB={kelp:8,stone:10,dango:4,cloth:3,brick:2,nail:1};
function ordSlots(){var L=lvOf('turtle');return L?Math.min(9,3+Math.floor(L/2)):0}
function goodsPool(){var L=hallLv(),p=[];if(lvOf('farm'))p.push('kelp');if(lvOf('quarry'))p.push('stone');if(lvOf('factory'))p.push('dango');if(lvOf('sew'))p.push('cloth');if(lvOf('kiln'))p.push('brick');if(lvOf('pearl')&&L>=12)p.push('nail');return p}
function genOrder(){var L=hallLv(),pool=goodsPool(),n=Math.min(pool.length,1+Math.floor(Math.random()*Math.min(3,1+L/5))),it={},val=0;pool=pool.slice().sort(function(){return Math.random()-.5});
  for(var i=0;i<n;i++){var g=pool[i],a=Math.max(1,Math.round(GB[g]*(1+L*.35)*(.7+Math.random()*.6)));it[g]=a;val+=a*GV[g]}
  var rw={pearl:Math.max(10,Math.round(val*.5/5)*5),xp:Math.round(val/3)+3};if(Math.random()<.12&&L>=7)rw.brick=Math.max(2,Math.round(L/2));else if(Math.random()<.05&&ogemLeft()>0)rw.gem=1;return {id:G.nid++,it:it,rw:rw,at:0,who:ORDWHO[Math.floor(Math.random()*ORDWHO.length)]}}
/* 1.1.33: 보석 주는 주문은 하루 3개까지(취소하고 다시 뽑아 보석만 골라 받는 것 막기) */
function ogemDay(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function ogemLeft(){var o=G.ogem||{};return o.d===ogemDay()?3-(o.n|0):3}
function ogemUse(){var d=ogemDay();if(!G.ogem||G.ogem.d!==d)G.ogem={d:d,n:0};G.ogem.n++}
var ORDWHO=['🐡 복어 아주머니','🐠 흰동가리 남매','🦐 새우 요리사','🐙 문어 선생님','🦀 꽃게 목수','🐟 고등어 반장','🦑 오징어 화가','🐚 소라 할머니','🐬 돌고래 우체부','🦞 가재 대장장이'];
function ordTick(now){var n=ordSlots();G.ord=G.ord||[];while(G.ord.length<n)G.ord.push({id:G.nid++,it:null,at:now});G.ord.forEach(function(o){if(!o.it&&now>=o.at&&goodsPool().length){var g=genOrder();o.it=g.it;o.rw=g.rw;o.who=g.who}})}
function ordCan(o){if(!o.it)return false;for(var k in o.it)if((G.res[k]||0)<o.it[k])return false;return true}
function ordReady(){return (G.ord||[]).filter(ordCan).length}
function ordSend(o){if(!ordCan(o)){toast('창고에 물건이 모자라요');return}for(var k in o.it)G.res[k]-=o.it[k];G.ordSent=(G.ordSent|0)+1;snd('coin');var tc=bOf('turtle'),tcc=tc?centerOf(tc):{x:VW/2,y:VH/2};evtAdd(3+Math.floor(Object.keys(o.it).length*2),tcc.x+30,tcc.y-40*cam.z);WAL.add('pearl',o.rw.pearl);if(o.rw.gem){WAL.add('gem',o.rw.gem);ogemUse()}if(o.rw.brick)G.res.brick+=o.rw.brick;addXP(o.rw.xp);
  var t=bOf('turtle');if(t){var c=centerOf(t);float(c.x,c.y-70*cam.z,'+'+o.rw.pearl+'🫧');bubbleFx(c.x,c.y-50*cam.z)}o.it=null;o.at=NOW()+60000;save();orderPanel()}
function ordDrop(o){o.it=null;o.at=NOW()+5*60000;save();orderPanel()}

    var can=ordCan(o);return '<div class="ord'+(can?' can':'')+'"><small class="who">'+(o.who||'🐟 주민')+'</small><div class="its">'+Object.keys(o.it).map(function(k){var ok=(G.res[k]||0)>=o.it[k];return '<span class="'+(ok?'ok':'no')+'">'+ICON[k]+' '+o.it[k]+'</span>'}).join('')+'</div>'+

  h+='<p class="role">배달하면 1분 뒤 새 주문 · 취소하면 5분 뒤 · 주문 칸은 배달소 레벨에 따라 3~9칸</p>';
  el.innerHTML=h;el.hidden=false;$('pX').onclick=closePanel;el.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){ordSend(G.ord[+b.dataset.s])}});el.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){ordDrop(G.ord[+b.dataset.d])}});panelFor='ord'}

   - 본게임이 넘겨 주는 GF_MYFISH() = 수족관에 넣어 둔 물고기 [{id,n(이름),src(그림),lv(친밀도)}]
   - 처음엔 8초 뒤, 그다음엔 50~90초마다 한 마리: 입구 바깥 바다에서 헤엄쳐 와 → 길을 따라 산호궁(또는 명소) 앞까지 → 12초 머물며 빙글 → 다시 길로 나가 바다로
   - 진짜 그림 + 이름표(♥친밀도) + 발밑 빛 동그라미로 마을 주민과 구별
   - 누르면 하트 · 본게임 수족관과 같은 친밀도가 오름(물고기마다 하루 5번, GF_PET) · 명성 +2. 친해지면 본게임 규칙대로 진주 선물 ===== */
var VIS=null,VIS_NEXT=NOW()+8000,VIS_LAST={},VIS_IMG={};
function visList(){try{if(!EMB||!window.parent.GF_MYFISH)return [];return window.parent.GF_MYFISH()||[]}catch(e){return []}}
function visImg(f){var o=VIS_IMG[f.id];if(!o){o=VIS_IMG[f.id]={im:new Image(),ok:false};o.im.onload=function(){o.ok=true};o.im.src=f.src}return o}

    el.hidden=false;el.dataset.vis='1';el.style.top=$('tut').hidden?'':Math.round($('tut').getBoundingClientRect().bottom+10)+'px';el.innerHTML='🐠 내 물고기 '+f.n+' 놀러 왔어요 <b>보러 가기 ›</b>';clearTimeout(el.t);el.t=setTimeout(function(){el.hidden=true;delete el.dataset.vis},15000)},1800)}

function visTick(dt,now){if(!VIS){if(now>=VIS_NEXT)visStart(now);return}var v=VIS;v.hop=Math.max(0,v.hop-dt*2.4);
  if(v.st==='in'){v.al=Math.min(1,v.al+dt*.8);if(swimTo(v,G.gate.x-.3,G.gate.y,dt,1.4)){v.st='road';v.u=0}return}
  if(v.st==='road'||v.st==='back'){var n=v.p.length-1,sp=1.25*dt;v.u=v.st==='road'?Math.min(n,v.u+sp):Math.max(0,v.u-sp);var q=pathPt(v,v.u);if(q[0]-q[1]!==v.fx-v.fy)v.dir=(q[0]-q[1])>(v.fx-v.fy)?1:-1;v.fx=q[0];v.fy=q[1];
    if(v.st==='road'&&v.u>=n){v.st='stay';v.stay=12;v.cx=v.fx;v.cy=v.fy}else if(v.st==='back'&&v.u<=0){v.st='out';v.gx=G.gate.x-10;v.gy=G.gate.y+(Math.random()-.5)*4}return}
  if(v.st==='stay'){v.stay-=dt;var a=(12-v.stay)*1.3+v.ph,nx=v.cx+Math.cos(a)*.55,ny=v.cy+Math.sin(a)*.55;v.dir=Math.cos(a+1.57)-Math.sin(a+1.57)>0?1:-1;v.fx=nx;v.fy=ny;if(v.stay<=0){v.st='back';v.u=v.p.length-1}return}
  if(v.st==='out'){v.al=Math.max(0,v.al-dt*.5);swimTo(v,v.gx,v.gy,dt,1.6);if(v.al<=0){VIS=null;VIS_NEXT=now+50000+Math.random()*40000}}}

  var lab=v.f.n+((v.f.lv|0)?'  ♥'+v.f.lv:''),fs=Math.max(10,Math.round(11*Math.min(1.2,z+.25)));ctx.font='700 '+fs+'px Jua,sans-serif';var tw=ctx.measureText(lab).width+14,ty=s.y-s.w*.55-fs;

  ctx.restore()}

/* ===== 본게임 → 마을 (늑구 '본게임을 하면 마을에 생기는 일'):
   ① 판에서 모은 '마을 재료 상자'(본게임이 'gfcity.gift' 에 쌓음, 20초 넘는 판마다 1개 · 하루 6개)
      → 마을 위 알림 '📦 재료 상자 n개 · 받기' → 산호궁 단계에 맞는 재료(산호석 · 다시마 · 7단계부터 벽돌 · 8단계부터 못), 창고 한도까지
      상자 하나 = 광산 · 농장 Lv(산호궁) 1.2시간치. 명성 +3 · 축제 토큰 +3 씩
   ② 새로 모은 물고기는 마을로 이사: 처음 연 날 가진 물고기는 조용히 등록(G.kf), 그 뒤 새로 생긴 물고기는 '이사 왔어요' + 명성 +10 + 다음 나들이 1순위 ===== */
function boxWorth(){var L=Math.max(1,hallLv()),o={},q=D.prodPerHour('quarry',L),f=D.prodPerHour('farm',L);o.stone=Math.max(20,Math.round((q.stone||0)*1.2));o.kelp=Math.max(10,Math.round((f.kelp||0)*1.2));

/* ===== 39차 키우는 깊이: 🌫 탁한 물 · ⚖ 마을 정책 · ⚠ 마을 사건 =====
   1) 탁한 물: 광산 · 가마 · 경단 공장 · 해초 공방 · 고래 항구 · 산업 구역이 주변 물을 흐리게 함.

      🦈 상어 출몰(주거 · 상업, 👮 순찰대) · 🌋 뜨거운 물 분출(생산 건물, 🚒 소방서) · 🤧 물고기 감기(주거, 🏥 병원) · 🔴 적조(탁한 물 45 넘는 곳, 막는 건물 없음 → 물 거르개)
   저장: G.pol {on:[], t}, G.inc {next, blk, fix}, 건물 b.inc {k, at, end} */

/* --- 1) 탁한 물 --- */
var MURK={},MSRC={quarry:[4,30],kiln:[4,36],factory:[3,26],sew:[3,16],port:[3,14]};
function murkCalc(){var M={},cl={};G.b.forEach(function(b){if(!b.lv&&!(DEC[b.k]))return;var s=sz(b.k),cx=b.x+(s-1)/2,cy=b.y+(s-1)/2,r=0,v=0,neg=false;
    if(MSRC[b.k]){r=MSRC[b.k][0];v=MSRC[b.k][1]*polV('murk')}else if(isZ(b.k)&&b.k.charAt(1)==='I'&&b.lv){r=2;v=(6+4*b.lv)*polV('murk')}else if(DEC[b.k]&&DEC[b.k].fac){r=DEC[b.k].cr;v=DEC[b.k].cv;neg=true}
    if(!r||!v)return;for(var i=-r;i<=r;i++)for(var j=-r;j<=r;j++){var d=Math.abs(i)+Math.abs(j);if(d>r)continue;var key=Math.round(cx+i)+','+Math.round(cy+j),val=neg?v:v*(1-d/(r+1));if(neg)cl[key]=Math.max(cl[key]||0,val);else M[key]=(M[key]||0)+val}});
  for(var k in M){var m=M[k]-(cl[k]||0);if(m<1)delete M[k];else M[k]=Math.min(100,m)}MURK=M}
function murkAt(x,y){return MURK?Math.round(MURK[x+','+y]||0):0}
/* 💨 숨샘 · 큰 숨탑(40차): 산소 펌프 말고도 여러 개 놓아 산소 범위를 넓힘 */
function o2Extra(){G.b.forEach(function(b){var d=DEC[b.k];if(!d||!d.o2r)return;var s=sz(b.k),cx=b.x+(s-1)/2,cy=b.y+(s-1)/2,r=d.o2r;for(var i=-r;i<=r;i++)for(var j=-r;j<=r;j++)if(Math.abs(i)+Math.abs(j)<=r*1.3)O2[Math.round(cx+i)+','+Math.round(cy+j)]=1})}
var _fieldsM=fields;fields=function(){_fieldsM.apply(this,arguments);try{o2Extra()}catch(e){}try{murkCalc()}catch(e){}};
