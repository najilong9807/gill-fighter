rial","상업":"Commercial","수요<br>🏠 주거":"Demand<br>🏠 Residential","수요가 없어요":"No demand","에는 인구":" needs population","옷이 없어요":"No clothes","이(가) 필요해요":" required","이상(지금":"+ (now","인구":"Population","일꾼이 차면 마을 생산이 빨라져요":"Fully staffed jobs speed up town production","일자리":"Jobs","주거":"Residential","주민이 더 입주해야 해요":"More residents must move in","최고 단계":"Max level","행복":"Happiness","행복 55 이상(지금":"Happiness 55+ (now","🍡 경단":"🍡 Dumplings","🐟 마을 현황":"🐟 Town Status","🐟 물고기":"🐟 Residents","🐟 사는 물고기":"🐟 Residents living here","🐟 인구":"🐟 Population","👕 옷":"👕 Clothes","🔧 산업":"🔧 Industrial","🛍 상업":"🛍 Commercial","🧾 세금 시간당":"🧾 Tax per hour:","🫧<\/b> <small>(장보는 인구 × 행복 · 산호궁 말풍선으로 걷어요)<\/small>":"🫧<\/b> <small>(shoppers × happiness · collect from the Coral Hall bubble)<\/small>","〰 바다 〰":"〰 Sea 〰","다리가 생겼다!":"It grew legs!","뿅!":"Poof!","아가미시티":"Gill City","🐟 새 물고기가 입구로 들어와요 <b>보러 가기 ›<\/b>":"🐟 A new fish is at the gate <b>Go see ›<\/b>","🐟 새 주민이 집으로 걸어가요":"🐟 A new resident is walking home","🐟 첫 주민이 아가미시티로 들어와요!":"🐟 The first resident is entering Gill City!","거품 소방서예요. 범위 안에 있는 주택 · 상점 · 공장만 3단계 이상으로 자라요. 레벨을 올리면 범위가 넓어져요.":"The Bubble Fire Station. Only homes, shops and factories within range can grow to Lv.3 or higher. Upgrading widens the range.","게 일꾼":"Crab workers","게 일꾼 수를 늘려 동시에 여러 개 짓기":"More crab workers to build several things at once","게 일꾼이 사는 곳이에요. 레벨 3에 2마리, 10에 3마리, 18에 4마리가 되어 한꺼번에 더 많은 건물을 지을 수 있어요.":"Home of the crab workers. You get 2 at Lv.3, 3 at Lv.10 and 4 at Lv.18, so more buildings can go up at the same time.","고래 배 교역 · 못 · 보석 · 희귀 장식":"Whale ship trade · Nails · Gems · Rare decor","까지":" max","다시마로 경단을 만들어 주민 밥으로":"Turns kelp into dumplings to feed residents","다시마로 옷을 지어요 (산호궁 Lv.5부터 필요)":"Makes clothes from kelp (needed from Coral Hall Lv.5)","다시마로 해초 옷을 지어요. 산호궁 Lv.5부터 주민이 옷도 사 입어야 행복해요. 열차 · 주문에도 쓰여요.":"Makes seaweed clothes from kelp. From Coral Hall Lv.5, residents also need clothes to stay happy. Used for trains and orders too.","다시마를 경단으로 만들어요. 주민은 상점에서 경단을 사 먹고, 경단이 떨어지면 배고파져 입주하지 않아요. 주문에도 쓰여요. 주변 땅값을 조금 내려요.":"Turns kelp into dumplings. Residents buy them at shops; if you run out they go hungry and stop moving in. Also used for orders. Slightly lowers nearby land value.","다시마를 길러요 · 경단 · 옷의 재료":"Grows kelp · used for dumplings and clothes","다시마를 길러요. 경단 공장과 해초 공방이 다시마를 가져다 써요. 주문 · 열차에도 자주 나와요.":"Grows kelp. The Dumpling Factory and Seaweed Workshop use it up. Often needed for orders and trains.","따끈한 밥집이에요. 마을에 살 수 있는 인구를 늘리고 근처 땅값을 올려요.":"A cozy diner. Raises the population cap and nearby land value.","랜드마크 · 넓은 땅값 + · 인구 한도 +":"Landmark · Wide land value + · Population cap +","마을의 중심 · 모든 건물과 단계를 열어요":"Heart of the town · Unlocks every building and stage","모든 공사에 쓰는 산호석을 캐요. 말풍선을 눌러 받아요. 주변 땅값을 조금 내리니 주거 구역과 떨어뜨려 지어요.":"Mines the Coral Stone used in all construction. Tap the bubble to collect. It slightly lowers nearby land value, so build it away from homes.","못":"Nails","범위":"Range","범위 안 구역 건물이 3단계까지 자람":"Zone buildings in range can grow to Lv.3","범위 안 구역 건물이 4단계까지 자람":"Zone buildings in range can grow to Lv.4","산소 범위":"Oxygen range","산소를 퍼뜨려 구역이 자랄 수 있게":"Spreads oxygen so zones can grow","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 구역 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민 세금도 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"The Coral Hall level is your town's stage. No building can be a higher level, and new buildings, zone levels and land expansion unlock with it. Upgrading needs certain building levels and population. Resident taxes also build up here: the more shoppers and the happier they are, the more you collect.","산호석 4개를 구워 벽돌 1개를 만들어요. 산호궁 Lv.8부터 공사에 벽돌이 들어가요. 근처 땅값을 조금 내려요.":"Bakes 4 Coral Stone into 1 brick. Construction needs bricks from Coral Hall Lv.8. Slightly lowers nearby land value.","산호석 · 벽돌 · 못 · 다시마 · 경단 · 옷을 담는 한도를 늘려요. 가득 차면 말풍선에 쌓인 채 기다려요.":"Raises the storage cap for Coral Stone, bricks, nails, kelp, dumplings and clothes. When full, goods wait in the bubbles.","산호석을 구워 벽돌로 · 8단계부터 필요":"Bakes Coral Stone into bricks · needed from Lv.8","산호석을 캐요 · 거의 모든 공사 재료":"Mines Coral Stone · used in almost all construction","상자":"Crates","상자를 채워 고래 배를 먼 바다 마을로 보내요. 2시간 뒤 진주 못 · 보석 · 명성을 받고, 가끔 희귀 장식이 와요.":"Fill the crates to send the whale ship to a faraway town. After 2 hours you get Pearl Nails, Gems and Fame, and sometimes rare decor.","아픈 물고기를 돌봐요. 인구 한도를 늘리고, 범위 안 구역 건물이 5단계로 자랄 수 있게 해요.":"Cares for sick fish. Raises the population cap and lets zone buildings in range grow to Lv.5.","열차 칸마다 물건을 실어 보내면 30분쯤 다녀와서 벽돌 · 못 · 명성을 줘요. 레벨 10에 4칸, 18에 5칸.":"Load every train car and it returns in about 30 minutes with bricks, nails and Fame. 4 cars at Lv.10, 5 at Lv.18.","열차 칸을 채워 보내면 벽돌 · 못":"Fill the train cars for bricks and nails","용왕 궁전이에요. 마을에서 가장 큰 랜드마크로 넓은 땅값과 인구 한도를 크게 올려요.":"The Dragon King's Palace. The town's greatest landmark, greatly raising land value over a wide area and the population cap.","인구 한도 +":"Population cap +","인구 한도 + · 근처 땅값 +":"Population cap + · Nearby land value +","인구 한도 + · 범위 안 5단계 건물":"Population cap + · Lv.5 buildings in range","일꾼이 일자리를 다 채우면 최대 · 지금 일꾼 효율":"Max when all jobs are filled · Worker efficiency now","재료를 담는 창고 크기를 늘려요":"Increases material storage","주문":"Orders","주문을 배달해 진주를 벌어요":"Deliver orders to earn Pearls","주민이 주문한 물건(다시마 · 산호석 · 경단 · 옷…)을 창고에서 꺼내 거북이 배달해요. 배달할 때마다 진주와 명성을 받아요. 세금과 함께 마을의 두 가지 수입이라, 생산 건물에서 받은 재료를 여기서 진주로 바꾼다고 생각하면 돼요. 레벨을 올리면 주문 칸이 늘어요(3~9칸).":"Turtles deliver the goods residents order (kelp, Coral Stone, dumplings, clothes…) from your warehouse. Every delivery earns Pearls and Fame. Along with taxes this is the town's income, so think of it as turning what your production buildings make into Pearls. Upgrading adds order slots (3–9).","주변에 산소를 내보내요. 산소가 닿지 않는 구역에는 건물이 올라오지 않아요. 레벨을 올리면 범위가 넓어지고, 진주 양식장을 여는 조건이 돼요.":"Releases oxygen around it. Nothing gets built in zones without oxygen. Upgrading widens the range and is required to unlock the Pearl Farm.","지금:":"Now:","진주와 진주 못을 조금씩 만들어요":"Slowly produces Pearls and Pearl Nails","진주조개를 길러 진주를 조금씩 모으고, 14단계부터 쓰는 진주 못도 만들어요. 여기서 받은 진주는 아가미 파이터에서도 써요.":"Raises pearl oysters for a trickle of Pearls and makes the Pearl Nails needed from Lv.14. Pearls from here can be spent in Gill Fighter too.","최대 경단 시간당":"Max Dumplings per hour:","최대 다시마 시간당":"Max Kelp per hour:","최대 벽돌 시간당":"Max Bricks per hour:","최대 산호석 시간당":"Max Coral Stone per hour:","최대 옷 시간당":"Max Clothes per hour:","최대 진주 시간당":"Max Pearls per hour:","최종 랜드마크 · 아주 큰 인구 한도":"Final landmark · Huge population cap","해마 선생님의 학교예요. 인구 한도를 크게 늘리고 근처 땅값을 올려요.":"Teacher Seahorse's school. Greatly raises the population cap and nearby land value.","해마 순찰대예요. 범위 안에 있는 구역 건물이 4단계(고층)로 자랄 수 있어요.":"The Seahorse Patrol. Zone buildings in range can grow to Lv.4 (high-rise).","(다녀오는 데":"(trip takes","<b>거북 배달소<\/b>에서 주문을 하나 배달해요":"Deliver one order at the <b>Turtle Depot<\/b>","<b>경단 공장<\/b>을 지어 주민 밥을 만들어요":"Build a <b>Dumpling Factory<\/b> to feed residents","<b>산소 펌프<\/b>를 지어 산소를 넓혀요":"Build an <b>Oxygen Pump<\/b> to spread oxygen","<b>🏛 산호궁<\/b>을 Lv.2로 업그레이드해요":"Upgrade the <b>🏛 Coral Hall<\/b> to Lv.2","<small>✓ 실었어요<\/small>":"<small>✓ Loaded<\/small>","<small>도미 비서":"<small>Secretary Bream","광산 머리 위 <b>🪨 동그라미(말풍선)<\/b>를 눌러 산호석을 받아요":"Tap the <b>🪨 bubble<\/b> above the quarry to collect Coral Stone","노란 화살표가 가리키는 곳을 눌러요":"Tap where the yellow arrow points","다 실으면 떠나요 · 돌아오면 🧱":"Departs when fully loaded · Returns with 🧱","다시마 농장 → 경단 공장":"Kelp Farm → Dumpling Factory","다시마 정원":"Kelp Garden","도로 옆에 <b>🏠 주거 구역<\/b>을 4칸 지정해요":"Zone 4 tiles of <b>🏠 Residential<\/b> next to a road","동안 마을 소식이에요":" of town news","모두 받기":"Collect all","물고기 <b>10마리<\/b>가 입주하게 해요":"Get <b>10 residents<\/b> to move in","바로 돌아오기":"Return now","받기":"Collect","보관한 것이 없어요":"Nothing in storage","보관함으로 넣기":"Put into storage","산호 화단":"Coral Flowerbed","산호궁 옆에 <b>산호 광산<\/b>을 지어 봐요":"Build a <b>Coral Quarry<\/b> next to the Coral Hall","산호궁을 눌러 ⬆ 업그레이드":"Tap the Coral Hal edidos y trenes.","따끈한 밥집이에요. 마을에 살 수 있는 인구를 늘리고 근처 땅값을 올려요.":"Un comedor calentito. Aumenta el límite de población y sube el valor del suelo cercano.","랜드마크 · 넓은 땅값 + · 인구 한도 +":"Monumento · Valor del suelo amplio + · Límite de población +","마을의 중심 · 모든 건물과 단계를 열어요":"Corazón del pueblo · Desbloquea todos los edificios y etapas","모든 공사에 쓰는 산호석을 캐요. 말풍선을 눌러 받아요. 주변 땅값을 조금 내리니 주거 구역과 떨어뜨려 지어요.":"Extrae la Piedra de coral que usan todas las obras. Toca la burbuja para reclamarla. Baja un poco el valor del suelo cercano, así que constrúyela lejos de las casas.","못":"Clavos","범위":"Alcance","범위 안 구역 건물이 3단계까지 자람":"Los edificios de zona en el alcance crecen hasta Lv.3","범위 안 구역 건물이 4단계까지 자람":"Los edificios de zona en el alcance crecen hasta Lv.4","산소 범위":"Alcance de oxígeno","산소를 퍼뜨려 구역이 자랄 수 있게":"Reparte oxígeno para que las zonas crezcan","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 구역 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민 세금도 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"El nivel del Palacio de Coral es la etapa de tu pueblo. Ningún edificio puede superarlo, y con él se desbloquean nuevos edificios, niveles de zona y más territorio. Para mejorarlo necesitas ciertos niveles de edificios y población. Aquí también se acumulan los impuestos: cuanta más población compra y más feliz es, más cobras.","산호석 4개를 구워 벽돌 1개를 만들어요. 산호궁 Lv.8부터 공사에 벽돌이 들어가요. 근처 땅값을 조금 내려요.":"Hornea 4 de Piedra de coral para hacer 1 ladrillo. Desde Palacio de Coral Lv.8, las obras usan ladrillos. Baja un poco el valor del suelo cercano.","산호석 · 벽돌 · 못 · 다시마 · 경단 · 옷을 담는 한도를 늘려요. 가득 차면 말풍선에 쌓인 채 기다려요.":"Aumenta el límite para guardar Piedra de coral, ladrillos, clavos, algas, bolitas de arroz y ropa. Si se llena, lo producido espera en las burbujas.","산호석을 구워 벽돌로 · 8단계부터 필요":"Hornea Piedra de coral en ladrillos · necesarios desde Lv.8","산호석을 캐요 · 거의 모든 공사 재료":"Extrae Piedra de coral · material de casi todas las obras","상자":"Cajas","상자를 채워 고래 배를 먼 바다 마을로 보내요. 2시간 뒤 진주 못 · 보석 · 명성을 받고, 가끔 희귀 장식이 와요.":"Llena las cajas para enviar el barco ballena a un pueblo lejano. Tras 2 horas recibes Clavos de perla, Gemas y Fama, y a veces decoración rara.","아픈 물고기를 돌봐요. 인구 한도를 늘리고, 범위 안 구역 건물이 5단계로 자랄 수 있게 해요.":"Cuida a los peces enfermos. Aumenta el límite de población y permite que los edificios de zona en su alcance crezcan a Lv.5.","열차 칸마다 물건을 실어 보내면 30분쯤 다녀와서 벽돌 · 못 · 명성을 줘요. 레벨 10에 4칸, 18에 5칸.":"Carga todos los vagones y el tren vuelve en unos 30 minutos con ladrillos, clavos y Fama. 4 vagones en Lv.10, 5 en Lv.18.","열차 칸을 채워 보내면 벽돌 · 못":"Llena los vagones y recibe ladrillos y clavos","용왕 궁전이에요. 마을에서 가장 큰 랜드마크로 넓은 땅값과 인구 한도를 크게 올려요.":"El Palacio del Rey Dragón. El mayor monumento del pueblo: sube mucho el valor del suelo en un área amplia y el límite de población.","인구 한도 +":"Límite de población +","인구 한도 + · 근처 땅값 +":"Límite de población + · Valor del suelo cercano +","인구 한도 + · 범위 안 5단계 건물":"Límite de población + · Edificios Lv.5 en el alcance","일꾼이 일자리를 다 채우면 최대 · 지금 일꾼 효율":"Máximo con todos los empleos cubiertos · Eficiencia actual","재료를 담는 창고 크기를 늘려요":"Aumenta el espacio para guardar materiales","주문":"Pedidos","주문을 배달해 진주를 벌어요":"Entrega pedidos para ganar Perlas","주민이 주문한 물건(다시마 · 산호석 · 경단 · 옷…)을 창고에서 꺼내 거북이 배달해요. 배달할 때마다 진주와 명성을 받아요. 세금과 함께 마을의 두 가지 수입이라, 생산 건물에서 받은 재료를 여기서 진주로 바꾼다고 생각하면 돼요. 레벨을 올리면 주문 칸이 늘어요(3~9칸).":"Las tortugas entregan desde tu almacén lo que piden los habitantes (algas, Piedra de coral, bolitas de arroz, ropa…). Cada entrega da Perlas y Fama. Junto con los impuestos, son los ingresos del pueblo: piensa que aquí cambias por Perlas lo que hacen tus edificios de producción. Al mejorarlo hay más espacios de pedido (de 3 a 9).","주변에 산소를 내보내요. 산소가 닿지 않는 구역에는 건물이 올라오지 않아요. 레벨을 올리면 범위가 넓어지고, 진주 양식장을 여는 조건이 돼요.":"Libera oxígeno a su alrededor. En las zonas sin oxígeno no se construye nada. Al mejorarla, el alcance aumenta, y es requisito para abrir el Criadero de Perlas.","지금:":"Ahora:","진주와 진주 못을 조금씩 만들어요":"Produce poco a poco Perla y tảo bẹ để dùng. Thường xuất hiện trong đơn hàng và tàu hỏa.","따끈한 밥집이에요. 마을에 살 수 있는 인구를 늘리고 근처 땅값을 올려요.":"Quán ăn ấm cúng. Tăng giới hạn dân số và giá đất gần đó.","랜드마크 · 넓은 땅값 + · 인구 한도 +":"Công trình biểu tượng · Giá đất vùng rộng + · Giới hạn dân số +","마을의 중심 · 모든 건물과 단계를 열어요":"Trung tâm thị trấn · Mở khóa mọi công trình và cấp độ","모든 공사에 쓰는 산호석을 캐요. 말풍선을 눌러 받아요. 주변 땅값을 조금 내리니 주거 구역과 떨어뜨려 지어요.":"Khai thác Đá san hô dùng cho mọi công trình. Chạm bong bóng để nhận. Làm giá đất xung quanh giảm nhẹ, nên hãy xây xa khu Dân cư.","못":"Đinh","범위":"Phạm vi","범위 안 구역 건물이 3단계까지 자람":"Công trình khu trong phạm vi lớn đến Lv.3","범위 안 구역 건물이 4단계까지 자람":"Công trình khu trong phạm vi lớn đến Lv.4","산소 범위":"Phạm vi oxy","산소를 퍼뜨려 구역이 자랄 수 있게":"Tỏa oxy để các khu lớn lên được","산호궁 레벨이 마을의 단계예요. 다른 건물은 산호궁 레벨보다 높게 못 올리고, 새 건물 · 구역 단계 · 영토 확장이 산호궁 레벨에 따라 열려요. 올리려면 정해진 건물 레벨과 인구가 필요해요. 주민 세금도 여기에 쌓여요. 상점에서 장을 본 인구가 많고 행복할수록 많이 걷혀요.":"Cấp Cung San Hô là cấp độ của thị trấn. Công trình khác không thể cao cấp hơn Cung San Hô; công trình mới, cấp khu và mở rộng lãnh thổ đều mở theo cấp Cung San Hô. Muốn nâng cấp cần đủ cấp công trình và dân số. Thuế của cư dân cũng tích ở đây. Càng nhiều cư dân mua sắm và càng hạnh phúc thì thu càng nhiều.","산호석 4개를 구워 벽돌 1개를 만들어요. 산호궁 Lv.8부터 공사에 벽돌이 들어가요. 근처 땅값을 조금 내려요.":"Nung 4 Đá san hô thành 1 viên gạch. Từ Cung San Hô Lv.8, xây dựng cần có gạch. Làm giá đất gần đó giảm nhẹ.","산호석 · 벽돌 · 못 · 다시마 · 경단 · 옷을 담는 한도를 늘려요. 가득 차면 말풍선에 쌓인 채 기다려요.":"Tăng sức chứa Đá san hô, gạch, đinh, tảo bẹ, bánh viên và quần áo. Khi đầy, hàng sẽ chờ trong bong bóng.","산호석을 구워 벽돌로 · 8단계부터 필요":"Nung Đá san hô thành gạch · cần từ Lv.8","산호석을 캐요 · 거의 모든 공사 재료":"Khai thác Đá san hô · nguyên liệu của hầu hết công trình","상자":"Thùng","상자를 채워 고래 배를 먼 바다 마을로 보내요. 2시간 뒤 진주 못 · 보석 · 명성을 받고, 가끔 희귀 장식이 와요.":"Chất đầy thùng để đưa tàu cá voi đến thị trấn ở biển xa. Sau 2 giờ bạn nhận Đinh ngọc trai, Đá quý và Danh tiếng, đôi khi có trang trí hiếm.","아픈 물고기를 돌봐요. 인구 한도를 늘리고, 범위 안 구역 건물이 5단계로 자랄 수 있게 해요.":"Chăm sóc cá bị ốm. Tăng giới hạn dân số và cho công trình khu trong phạm vi lớn đến Lv.5.","열차 칸마다 물건을 실어 보내면 30분쯤 다녀와서 벽돌 · 못 · 명성을 줘요. 레벨 10에 4칸, 18에 5칸.":"Chất hàng lên từng toa, tàu đi khoảng 30 phút rồi mang về gạch, đinh và Danh tiếng. Lv.10 có 4 toa, Lv.18 có 5 toa.","열차 칸을 채워 보내면 벽돌 · 못":"Chất đầy toa tàu để nhận gạch · đinh","용왕 궁전이에요. 마을에서 가장 큰 랜드마크로 넓은 땅값과 인구 한도를 크게 올려요.":"Cung điện Long Vương. Công trình biểu tượng lớn nhất thị trấn, tăng mạnh giá đất vùng rộng và giới hạn dân số.","인구 한도 +":"Giới hạn dân số +","인구 한도 + · 근처 땅값 +":"Giới hạn dân số + · Giá đất gần đó +","인구 한도 + · 범위 안 5단계 건물":"Giới hạn dân số + · Công trình Lv.5 trong phạm vi","일꾼이 일자리를 다 채우면 최대 · 지금 일꾼 효율":"Tối đa khi đủ lao động cho mọi việc làm · Hiệu suất lao động hiện tại","재료를 담는 창고 크기를 늘려요":"Tăng sức chứa kho nguyên liệu","주문":"Đơn hàng","주문을 배달해 진주를 벌어요":"Giao đơn hàng để kiếm Ngọc trai","주민이 주문한 물건(다시마 · 산호석 · 경단 · 옷…)을 창고에서 꺼내 거북이 배달해요. 배달할 때마다 진주와 명성을 받아요. 세금과 함께 마을의 두 가지 수입이라, 생산 건물에서 받은 재료를 여기서 진주로 바꾼다고 생각하면 돼요. 레벨을 올리면 주문 칸이 늘어요(3~9칸).":"Rùa lấy hàng cư dân đặt (tảo bẹ, Đá san hô, bánh viên, quần áo…) từ kho đem giao. Mỗi lần giao bạn nhận Ngọc trai và Danh tiếng. Cùng với thuế, đây là hai nguồn thu của thị trấn, nên cứ xem như đổi nguyên liệu từ công trình sản xuất thành Ngọc trai. Nâng cấp để có thêm ô đơn (3~9 ô).","주변에 산소를 내보내요. 산소가 닿지 않는 구역에는 건물이 올라오지 않아요. 레벨을 올리면 범위가 넓어지고, 진주 양식장을 여는 조건이 돼요.":"Tỏa oxy ra xung quanh. Khu không có oxy thì không mọc công trình. Nâng cấp để mở rộng phạm vi, và là điều kiện để mở Trại Ngọc trai.","지금:":"Hiện:","진주와 진주 못을 조금씩 만들어요":"Làm ra từng chút Ngọc trai và Đinh ngọc trai","진주조개를 길러 진주를 조금씩 모으고, 14단계부터 쓰는 진주 못도 만들어요. 여기서 받은 진주는 아가미 파이터에서도 써요.":"Nuôi trai ngọc để gom từng chút Ngọc trai và làm Đinh ngọc trai cần dùng từ Lv.14. Ngọc trai nhận ở đây cũng dùng được trong Gill Fighter.","최대 경단 시간당":"Bánh viên tối đa mỗi giờ:","최대 다시마 시간당":"Tảo bẹ tối đa mỗi giờ:","최대 벽돌 시간당":"Gạch tối đa mỗi giờ:","최대 산호석 시간당":"Đá san function palaceL(L,bp){var p=pal(bp),g='',cx=GX,cy=GY;if(L>=25&&!bp){p.wallT='#fdfaff';p.wallL='#efe6ff';p.wallR='#c9b6f0'}

var GV={kelp:1,stone:1,dango:3,cloth:4,brick:6,nail:15},GB={kelp:8,stone:10,dango:4,cloth:3,brick:2,nail:1};

  for(var i=0;i<n;i++){var g=pool[i],a=Math.max(1,Math.round(GB[g]*(1+L*.35)*(.7+Math.random()*.6)));it[g]=a;val+=a*GV[g]}
