<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
<!-- 아래 메뉴 '마을' 탭 아이콘(svart/ic_town.webp 원본). 다른 탭 아이콘처럼 반짝이는 입체 그림 -->
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD2DE"/><stop offset=".55" stop-color="#FF9DB8"/><stop offset="1" stop-color="#E8628A"/></linearGradient>
  <linearGradient id="wallS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#B83A66" stop-opacity="0"/><stop offset="1" stop-color="#B83A66" stop-opacity=".35"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FD8FF"/><stop offset=".5" stop-color="#2F9BF0"/><stop offset="1" stop-color="#1A5FC8"/></linearGradient>
  <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A3"/><stop offset="1" stop-color="#FFB547"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".5" stop-color="#FFD03A"/><stop offset="1" stop-color="#E89A12"/></linearGradient>
  <linearGradient id="kelp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CF0A0"/><stop offset="1" stop-color="#22A35A"/></linearGradient>
  <radialGradient id="bub" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#CFF1FF"/><stop offset="1" stop-color="#4DB8F0"/></radialGradient>
  <radialGradient id="sand" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#FFE6B0"/><stop offset="1" stop-color="#E9B66A"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#062A45" flood-opacity=".45"/></filter>
</defs>
<g transform="translate(64 66) scale(1.13) translate(-62 -64)"><g filter="url(#sh)">
  <!-- 모래 언덕 -->
  <ellipse cx="62" cy="110" rx="48" ry="11" fill="url(#sand)" stroke="#173E86" stroke-width="3.6" stroke-linejoin="round"/>
  <ellipse cx="54" cy="106" rx="24" ry="3.4" fill="#fff" opacity=".45"/>
  <!-- 다시마 -->
  <path d="M22 108c-6-10 4-16-2-26s3-14 0-20" fill="none" stroke="#173E86" stroke-width="11" stroke-linecap="round"/><path d="M22 108c-6-10 4-16-2-26s3-14 0-20" fill="none" stroke="url(#kelp)" stroke-width="6" stroke-linecap="round"/>
  <path d="M22 108c-6-10 4-16-2-26s3-14 0-20" fill="none" stroke="#C9FFD4" stroke-width="2" stroke-linecap="round" opacity=".7" transform="translate(-1.6 0)"/>
  <!-- 집 벽(조개처럼 둥근 아치) -->
  <path d="M30 106V64q0-6 6-6h52q6 0 6 6v42z" fill="url(#wall)" stroke="#173E86" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M30 106V64q0-6 6-6h52q6 0 6 6v42z" fill="url(#wallS)"/>
  <!-- 조개 결 -->
  <path d="M44 60v46M62 58v48M80 60v46" stroke="#E8628A" stroke-width="2.4" opacity=".35"/>
  <!-- 지붕(둥근 돔) -->
  <path d="M22 64Q24 22 62 16Q100 22 102 64Q62 54 22 64z" fill="url(#roof)" stroke="#173E86" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M34 52Q38 30 60 24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <path d="M22 64Q62 54 102 64" fill="none" stroke="#164E9E" stroke-width="3" opacity=".45"/>
  <!-- 지붕 끝 진주 -->
  <circle cx="62" cy="13" r="7.5" fill="url(#gold)" stroke="#173E86" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="59.5" cy="10.5" r="2.6" fill="#fff" opacity=".9"/>
  <!-- 문 -->
  <path d="M52 106V86a10 10 0 0 1 20 0v20z" fill="#7A3B2A"/>
  <path d="M55 106V87a7 7 0 0 1 14 0v19z" fill="url(#door)"/>
  <circle cx="66" cy="96" r="1.8" fill="#7A3B2A"/>
  <!-- 둥근 창 -->
  <circle cx="83" cy="78" r="8" fill="#7A3B2A"/><circle cx="83" cy="78" r="5.6" fill="url(#door)"/>
  <path d="M83 72.4v11.2M77.4 78h11.2" stroke="#7A3B2A" stroke-width="1.6"/>
  <circle cx="41" cy="78" r="6.4" fill="#7A3B2A"/><circle cx="41" cy="78" r="4.4" fill="url(#door)"/>
  <!-- 벽 위 반짝 -->
  <path d="M35 66v26" stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity=".55"/>
  <!-- 불가사리 -->
  <path d="M98 92l3 6.2 6.8.6-5.2 4.4 1.7 6.6-6.3-3.6-5.9 3.6 1.6-6.6-5.1-4.4 6.8-.6z" fill="url(#gold)" stroke="#173E86" stroke-width="2.6" stroke-linejoin="round"/>
</g>
</g>
<!-- 물방울 -->
<circle cx="106" cy="40" r="7" fill="url(#bub)" opacity=".95" stroke="#1E6FB8" stroke-width="1.6"/><circle cx="103.6" cy="37.6" r="2" fill="#fff"/>
<circle cx="114" cy="24" r="4.4" fill="url(#bub)" opacity=".95" stroke="#1E6FB8" stroke-width="1.6"/><circle cx="112.6" cy="22.6" r="1.3" fill="#fff"/>
<circle cx="16" cy="44" r="5" fill="url(#bub)" opacity=".9" stroke="#1E6FB8" stroke-width="1.6"/><circle cx="14.4" cy="42.4" r="1.4" fill="#fff"/>
</svg>
